<head>

<title>Employment Models · Tara Rose</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-96x96.png" sizes="96x96" type="image/png">
<link rel="shortcut icon" href="../assets/favicon.ico">

<!-- Kate, 30 Sep 2026: our own copy of the GHL page promo.tararosesalon.com/employment-models,
     which went 404. Each "Read the brochure" on a stylist's page opens this in a new window,
     on that brochure: ?b=overview | employed | flex-dubai | flex-abudhabi | chair | relocation.
     The PDFs are the local copies in brochures/, and the logo is the dashboard's own
     white + mint lockup, not the GHL media image. -->
<style>
  html, body { margin: 0; min-height: 100%; background: #1C1B18; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #fff; }
  .page { min-height: 100vh; box-sizing: border-box; padding: 28px 16px 40px;
    background: radial-gradient(ellipse 65% 55% at 50% 40%, rgba(153,246,228,.16), transparent 70%), #1C1B18; }
  /* 5.png is a 3000px square with the lockup at 337,1149 to 2658,1812; show just the lockup. */
  .logo { position: relative; overflow: hidden; width: 200px; max-width: 60vw; aspect-ratio: 2321 / 663; margin: 0 auto 22px; }
  .logo img { position: absolute; width: 129.254%; height: auto; left: -14.52%; top: -173.3%; }
  .page .br-wrap { background: none; padding: 0; margin: 0; overflow: visible; }
</style>
</head>
<body>
<div class="page">
  <div class="logo"><img src="../assets/5.png" alt="Tara Rose Salons"></div>
  <div id="brochures"></div>
</div>
<script src="brochures.js?v=20260930b"></script>
<script>
(function () {
  var PDF = 'brochures/';
  var LIST = [
    { key: 'overview',      label: 'All three paths',  title: 'The Full Overview',           pdf: PDF + 'full-overview.pdf' },
    { key: 'employed',      label: 'Employed',         title: 'The Employed Stylist',        pdf: PDF + 'employed-stylist.pdf' },
    { key: 'flex-dubai',    label: 'Flex · Dubai',     title: 'The Flex Stylist, Dubai',     pdf: PDF + 'flex-stylist-dubai.pdf' },
    { key: 'flex-abudhabi', label: 'Flex · Abu Dhabi', title: 'The Flex Stylist, Abu Dhabi', pdf: PDF + 'flex-stylist-abu-dhabi.pdf' },
    { key: 'chair',         label: 'Rent-a-Chair',     title: 'Rent-a-Chair',                pdf: PDF + 'rent-a-chair.pdf' },
    { key: 'relocation',    label: 'Relocation',       title: 'Making the Move',             pdf: PDF + 'relocation.pdf' }
  ];
  var start = null;
  try { start = new URLSearchParams(location.search).get('b'); } catch (e) {}
  if (!LIST.some(function (b) { return b.key === start; })) start = 'overview';
  mountBrochures(document.getElementById('brochures'), LIST, start, function (key) {
    try { var u = new URL(location.href); u.searchParams.set('b', key); history.replaceState(null, '', u); } catch (e) {}
    var b = LIST.filter(function (x) { return x.key === key; })[0];
    if (b) document.title = b.title + ' · Tara Rose';
  });
  var first = LIST.filter(function (x) { return x.key === start; })[0];
  document.title = first.title + ' · Tara Rose';
})();
</script>
</body>
</html>
