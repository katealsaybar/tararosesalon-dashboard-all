<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>My Numbers · Tara Rose</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-96x96.png" sizes="96x96" type="image/png">
<link rel="shortcut icon" href="../assets/favicon.ico">
<link rel="apple-touch-icon" href="../assets/favicon-96x96.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="performance.css?v=20260926a">
<script>
// Light / Dark (Kate, 25 Sep 2026): a stylist's own link remembers the choice per
// browser; with none saved it follows the phone. Inside the dashboard the frame takes
// the dashboard's theme instead (trs-theme message in performance.js).
(function () {
  if (new URLSearchParams(location.search).get('embed') === '1') return;
  try { var t = localStorage.getItem('perf-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
})();
function perfIsDark() {
  var t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function perfPaintTheme() {
  var dark = perfIsDark();
  var logo = document.getElementById('brandLogo'), btn = document.getElementById('themeBtn');
  if (logo) logo.src = dark ? '../assets/5.png' : '../assets/logo-ink-mint.png';
  if (btn) btn.textContent = dark ? 'Light' : 'Dark';
}
function perfToggleTheme() {
  var t = perfIsDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('perf-theme', t); } catch (e) {}
  perfPaintTheme();
  // Chart.js reads its colours when it draws, so redraw the charts in the new theme.
  if (document.querySelector('#app canvas')) location.reload();
}
</script>
</head>
<body>
<header class="top">
  <!-- TARA ROSE SALONS, the dashboard's lockup: white + mint in dark, ink + mint in light. -->
  <div class="brand">
    <div class="brand-mark"><img id="brandLogo" src="../assets/logo-ink-mint.png" alt="Tara Rose Salons"></div>
    <div class="brand-word">Salons</div>
  </div>
  <div class="top-acts">
    <div class="month-pick"><span class="month-lbl">Month</span>
      <span class="pdd"><select id="monthSel" aria-label="Month"></select></span>
    </div>
    <button type="button" class="theme-btn" id="themeBtn" onclick="perfToggleTheme()">Dark</button>
  </div>
<script>perfPaintTheme(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', perfPaintTheme);</script>
</header>

<main id="app">
  <p class="loading">Loading your numbers…</p>
</main>

<footer class="foot" id="foot"></footer>
<!-- Back to top (Kate, 25 Sep 2026), same round TOP button as the dashboard. Shows once
     the first screen is behind you; not in the dashboard frame, which has its own. -->
<button type="button" class="perf-top" id="perfTop" aria-label="Back to top"
        onclick="window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'})"><span class="perf-top-k">TOP</span><span aria-hidden="true">↑</span></button>
<script>
(function () {
  var b = document.getElementById('perfTop');
  if (!b || new URLSearchParams(location.search).get('embed') === '1') { if (b) b.remove(); return; }
  var paint = function () { b.classList.toggle('on', scrollY > innerHeight * 0.9); };
  addEventListener('scroll', paint, {passive: true}); paint();
})();
</script>

<script src="../staff-profiles.js?v=20260924n"></script>
<script src="performance.js?v=20260926a"></script>
</body>
</html>
