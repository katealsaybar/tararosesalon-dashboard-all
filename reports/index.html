<!-- Kate, 22 Oct 2026: the Reports Hub. One box per report, a star on each, the starred ones first. It draws what this person
     may already open (pages.js for the dashboard's pages, Team Home's own list for the rest), so it adds no access of its own.
     Stars are the same kb_favourites rows Team Home and the dashboard's sidebar use. -->
<style>
  :root{--star:#D99A00}
  [data-theme="dark"]{--star:#F5C84B}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--star:#F5C84B}}
  .rp-hello{margin:0 0 4px;font:600 clamp(22px,4vw,30px)/1.15 'Inter',system-ui,sans-serif;letter-spacing:-.01em}
  .rp-sub{margin:0 0 18px;color:var(--muted)}
  .rp-find{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 16px;max-width:460px;margin-bottom:26px;color:var(--muted2);font-size:14px}
  .rp-find svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .rp-find input{border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--text);width:100%;min-width:0}
  .rp-sec{margin-bottom:28px}
  .rp-sec h2{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .rp-sec h2 em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted2)}
  .rp-sec h2 svg{width:14px;height:14px;fill:var(--star);stroke:var(--star)}
  .rp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .rp-box{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 13px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:112px;box-shadow:0 1px 2px rgba(26,26,26,.04);transition:box-shadow .18s,transform .18s,border-color .18s}
  .rp-box:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--muted2)}
  .rp-box:focus-within{outline:2px solid var(--accent);outline-offset:2px}
  .rp-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--text);background:color-mix(in srgb,var(--c) 30%,var(--surface));font-size:13px;font-weight:600}
  .rp-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .rp-nm{font-weight:600;font-size:15px;line-height:1.25;text-wrap:balance;padding-right:30px}
  .rp-nm a{color:inherit;text-decoration:none}
  .rp-nm a::after{content:"";position:absolute;inset:0;border-radius:var(--radius)}
  .rp-nm a:focus-visible{outline:none}
  .rp-bl{font-size:12.5px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rp-star{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted2)}
  .rp-star:hover{background:var(--surface2);color:var(--text)}
  .rp-star:focus-visible{outline:2px solid var(--accent)}
  .rp-star svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
  .rp-star.on{color:var(--star)}
  .rp-star.on svg{fill:var(--star)}
  .rp-empty{color:var(--muted);padding:30px 0;font-size:14px}
  @media (max-width:600px){
    .rp-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .rp-box{min-height:96px;padding:12px 11px;gap:8px}
    .rp-bl{display:none}
    .rp-find{max-width:none}
    .rp-ic{width:34px;height:34px;border-radius:10px}
    .rp-ic svg{width:19px;height:19px}
    .rp-nm{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){.rp-box{transition:none}.rp-box:hover{transform:none}}
</style>

    stafflevels: '<path d="M3 21h5v-5h5v-5h5V6h3"/>',
    attrition: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',

    access: '<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.7-8.7"/><path d="m16 7 3 3"/>',

  var DASH_GROUP = { 'Numbers': 'Numbers', 'Clients': 'Numbers', 'Targets': 'Targets', 'Campaigns': 'Marketing & Campaigns', 'Content': 'Marketing & Campaigns', 'People': 'People' };

  });
  // A section holds pages (the SOPs, the inductions) or links out; only a live one gets a box.
  var cnt = {};
  var pr = await c.from('kb_pages').select('section,slug');
  (pr.data || []).forEach(function (x) { if (KB.shows(x.slug)) cnt[x.section] = (cnt[x.section] || 0) + 1; });

  var items = [];
  // Dashboard pages: exactly the ones pages.js opens for this level and this person's extras.

  var favs = await KB.loadFavs();
  var q = '';
  var grid = document.getElementById('rpGrid');
  function on(it) { return !!(favs[it.key] || (it.alias && favs[it.alias])); }
  function match(it) { return !q || (it.title + ' ' + it.blurb + ' ' + (it.words || '')).toLowerCase().indexOf(q) >= 0; }

  function box(it) {
    var o = on(it);
    var icon = it.svg ? '<svg viewBox="0 0 24 24">' + it.svg + '</svg>' : esc(it.init || it.title.charAt(0));
    return '<div class="rp-box"><span class="rp-ic" style="--c:' + COLOR[it.group] + '" aria-hidden="true">' + icon + '</span>' +
      '<div class="rp-nm"><a href="' + esc(it.href) + '">' + esc(it.title) + '</a></div><div class="rp-bl">' + esc(it.blurb) + '</div>' +
      '<button type="button" class="rp-star' + (o ? ' on' : '') + '" data-k="' + esc(it.key) + '" aria-pressed="' + o + '" aria-label="' + (o ? 'Remove ' : 'Add ') + esc(it.title) + (o ? ' from' : ' to') + ' favourites" title="' + (o ? 'In your favourites' : 'Add to favourites') + '">' + STAR_SVG + '</button></div>';
  }
  function paint() {
    var list = items.filter(match);
    document.getElementById('rpSub').textContent = items.length + (items.length === 1 ? ' report' : ' reports') + '. Star the ones you open most and they sit at the top.';
    var h = '', pinned = list.filter(on);
    if (pinned.length) h += '<section class="rp-sec"><h2>' + STAR_SVG + 'Starred <em>' + pinned.length + '</em></h2><div class="rp-grid">' + pinned.map(box).join('') + '</div></section>';
    ORDER.forEach(function (g) {
      var rest = list.filter(function (it) { return it.group === g && !on(it); });
      if (rest.length) h += '<section class="rp-sec"><h2>' + esc(g) + ' <em>' + rest.length + '</em></h2><div class="rp-grid">' + rest.map(box).join('') + '</div></section>';
    });
    if (!list.length) h = '<p class="rp-empty">' + (items.length ? 'No report matches that. Try fewer letters.' : 'Nothing to show here yet.') + '</p>';
    grid.innerHTML = h;
  }
  var first = (KB.name || '').split(/[\s(]/)[0];
  document.getElementById('rpHello').textContent = first ? 'Reports, ' + first : 'Reports';
  paint();

  grid.addEventListener('click', async function (e) {
    var b = e.target.closest('.rp-star');
    if (!b) return;
    e.preventDefault();
    var it = items.filter(function (x) { return x.key === b.dataset.k; })[0];
    if (!it) return;
    var keys = [it.key].concat(it.alias ? [it.alias] : []), was = on(it), before = Object.assign({}, favs);
    if (was) keys.forEach(function (k) { delete favs[k]; }); else favs[it.key] = true;
    paint();
    var res = was ? await c.from('kb_favourites').delete().in('section', keys) : await c.from('kb_favourites').insert({ section: it.key });
    if (res.error) { Object.keys(favs).forEach(function (k) { delete favs[k]; }); Object.assign(favs, before); paint(); }
  });
  document.getElementById('rpQ').addEventListener('input', function (e) { q = e.target.value.trim().toLowerCase(); paint(); });
});
</script>
</body>
</html>
