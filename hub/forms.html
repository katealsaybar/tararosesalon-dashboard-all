<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HR Forms &amp; Waivers · Team Home</title>
<script>
  try { var t = localStorage.getItem('trs-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-96x96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon-96x96.png">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2D2E37" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub/hub.css?v=20261008su">
</head>
<body class="kb-wait">
<!-- HR Forms & Waivers (Kate, 5 Oct 2026): the 14 fillable forms (real PDF form fields) rebuilt from the
     2020 pack with the current logo. The PDFs live in kb_files in Supabase
     (migrations/kb_files.sql), readable only by those who may open the hr-forms
     section (Level 2 and up); nothing of them is in this repo, which is public. -->
<div class="wrap">
  <header class="kb-head" id="kbHead" data-title="Team Home"></header>
  <main id="kbMain"><p class="kb-msg">Loading…</p></main>
  <footer class="kb-foot">For the Tara Rose Salons team only. <a href="/privacy/">Privacy</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=20261001kb"></script>
<script src="/hub/hub.js?v=20261008s10"></script>
<script src="/visits.js?v=20261008v1"></script>
<script>
(function () {
  var main = document.getElementById('kbMain'), esc = KB.esc;
  if (/\.html$/.test(location.pathname)) history.replaceState(null, '', location.pathname.replace(/\.html$/, '') + location.search + location.hash);
  function notFound() {
    main.innerHTML = '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p><p class="kb-msg">This page isn’t open to your account. <a href="/hub/">Back to Team Home</a></p>';
  }
  function size(b) { return b ? Math.round(b / 1024) + ' KB' : ''; }
  // A bytea comes back from PostgREST as "\x" followed by hex.
  function bytes(hex) {
    hex = String(hex || '').replace(/^\\x/, '');
    var out = new Uint8Array(hex.length / 2);
    for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
    return out;
  }
  // Kate, 8 Oct 2026: the booking and deposit policy documents sit in their own group. Not forms:
  // no fields to fill in, so View instead of Fill in; a row with an href is a link to the live client page.
  var POLICY = 'Policies & client pages';   // the group's name in kb_files.grp
  var cache = {};
  async function blobUrl(code) {
    if (cache[code]) return cache[code];
    var r = await KB.client.from('kb_files').select('pdf').eq('code', code).single();
    if (r.error || !r.data || !r.data.pdf) throw new Error('not found');
    return (cache[code] = URL.createObjectURL(new Blob([bytes(r.data.pdf)], { type: 'application/pdf' })));
  }
  async function act(btn) {
    var open = btn.dataset.act === 'open';
    var tab = open ? window.open('', '_blank') : null;   // opened on the click, so it isn't blocked
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = 'Loading…';
    try {
      var u = await blobUrl(btn.dataset.code);
      if (tab) tab.location.href = u;
      else {
        var a = document.createElement('a');
        a.href = u; a.download = btn.dataset.file;
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (e) {
      if (tab) tab.close();
      alert('That form couldn’t be loaded. Try again, or tell Kate.');
    }
    btn.disabled = false; btn.textContent = was;
  }

  KB.ready.then(async function () {
    if (KB.allowed.indexOf('hr-forms') < 0) { notFound(); return; }   // also "View as" below Level 2
    var r = await KB.client.from('kb_files').select('code,grp,title,subtitle,blurb,filename,pages,bytes,sort,note,href')
      .eq('section', 'hr-forms').order('sort');
    if (r.error || !r.data || !r.data.length) { notFound(); return; }
    var groups = [], by = {};
    // Kate, 5 Oct 2026: client forms split into Hair and Beauty; the general waiver
    // (grp 'Hair and beauty client forms') shows under both.
    var BOTH = 'Hair and beauty client forms', SPLIT = ['Hair client forms', 'Beauty client forms'];
    function add(g, f) { if (!by[g]) { by[g] = []; groups.push(g); } by[g].push(f); }
    r.data.forEach(function (f) { if (f.grp === BOTH) SPLIT.forEach(function (g) { add(g, f); }); else add(f.grp, f); });
    // Kate, 5 Oct 2026: one group at a time, picked with the switch under the title.
    // The pick stays in the address (?t=1, ?t=2) and in this browser (trs-forms-tab).
    var pick = 0;
    try { pick = +(new URLSearchParams(location.search).get('t') || localStorage.getItem('trs-forms-tab') || 1) - 1; } catch (e) {}
    if (!(pick >= 0 && pick < groups.length)) pick = 0;
    // Kate, 6 Oct 2026: a form with an open question (kb_files.note, from CHANGES-hr-forms.md)
    // wears "To check" and its questions; ?check=1, Team Home's "N to check" link, lists
    // only those forms.
    var flagged = function (f) { return !!f.note && /confirm|approv|review/i.test(f.note); };
    var nCheck = r.data.filter(flagged).length;
    var only = new URLSearchParams(location.search).get('check') === '1' && nCheck > 0;
    main.innerHTML =
      '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p>' +
      KB.titleIcon('hr-forms', 'HR Forms &amp; Waivers') +
      '<p class="kb-meta">' + r.data.filter(function (f) { return f.grp !== POLICY; }).length + ' fillable A4 forms. Fill one in on screen and save it, or print it and fill it in by hand, then file the signed copy. The booking and deposit policy and the client pages sit under Policies &amp; client pages.</p>' +
      (nCheck ? '<p class="kb-legend"><span class="kb-flag" style="margin:0">To check</span>' + nCheck + ' forms have a question still being confirmed.' +
        '<button type="button" id="fmOnlyCheck" aria-pressed="' + only + '">' + (only ? 'Show all forms' : 'Show only these') + '</button></p>' : '') +
      '<div class="fm-switch" role="group" aria-label="Which forms">' + groups.map(function (g, i) {
        var n = only ? by[g].filter(flagged).length : by[g].length;
        return '<button type="button" data-i="' + i + '" aria-pressed="' + (i === pick) + '"><b class="fm-full">' + esc(g) + '</b><b class="fm-short">' + esc(g === POLICY ? 'Policies' : g.replace(/( client)? forms$/, '')) + '</b> <span>' + n + '</span></button>';
      }).join('') + '</div>' +
      groups.map(function (g, i) {
        var list = only ? by[g].filter(flagged) : by[g];
        return '<section class="kb-dept fm-dept" data-i="' + i + '"' + (i === pick ? '' : ' hidden') + '><h2 class="kb-dept-h">' + esc(g) + '</h2>' +
          (list.length ? '' : '<p class="kb-msg">Nothing to check in this group.</p>') + list.map(function (f) {
          var t = f.title + (f.subtitle ? ' (' + f.subtitle + ')' : '');
          var notes = flagged(f) ? f.note.split('\n').map(function (x) { return '<span class="fm-note">' + esc(x.replace(/^Being confirmed:\s*/i, '').replace(/^./, function (ch) { return ch.toUpperCase(); })) + '</span>'; }).join('') : '';
          return '<div class="kb-row fm-row"><span class="fm-code">' + esc(f.code) + '</span>' +
            '<span class="kb-row-tx"><b>' + esc(t) + (flagged(f) ? '<span class="kb-flag">To check</span>' : '') + '</b><span>' + esc(f.blurb || '') + '</span>' + notes + '</span>' +
            (f.href ? '<span class="kb-row-n">Web page</span>' : '<span class="kb-row-n">' + (f.pages || 1) + (f.pages > 1 ? ' pages' : ' page') + ' · ' + size(f.bytes) + '</span>') +
            (f.href
              ? '<span class="fm-acts"><a class="fm-btn fm-dl" style="display:inline-flex;align-items:center;text-decoration:none" href="' + esc(f.href) + '" target="_blank" rel="noopener">Open page</a></span></div>'
              : '<span class="fm-acts"><button type="button" class="fm-btn" data-act="open" data-code="' + esc(f.code) + '"' + (f.grp === POLICY ? '>View' : ' title="Opens the form to type in. Save it with the download button in the PDF viewer.">Fill in') + '</button>' +
                '<button type="button" class="fm-btn fm-dl" data-act="dl" data-code="' + esc(f.code) + '" data-file="' + esc(f.filename) + '">Download</button></span></div>');
        }).join('') + '</section>';
      }).join('');
    main.addEventListener('click', function (e) {
      if (e.target.closest('#fmOnlyCheck')) {
        var cu = new URL(location.href);
        if (only) cu.searchParams.delete('check'); else cu.searchParams.set('check', '1');
        location.replace(cu.pathname + cu.search);
        return;
      }
      var b = e.target.closest('.fm-btn');
      if (b) { if (b.tagName !== 'A') act(b); return; }   // a link row just follows its link
      var s = e.target.closest('.fm-switch button');
      if (!s) return;
      var i = +s.dataset.i;
      main.querySelectorAll('.fm-switch button').forEach(function (x) { x.setAttribute('aria-pressed', String(+x.dataset.i === i)); });
      main.querySelectorAll('.fm-dept').forEach(function (d) { d.hidden = +d.dataset.i !== i; });
      try { localStorage.setItem('trs-forms-tab', String(i + 1)); } catch (err) {}
      var u = new URL(location.href); u.searchParams.set('t', String(i + 1)); history.replaceState(null, '', u.pathname + u.search);
    });
  });
})();
</script>
</body>
</html>
