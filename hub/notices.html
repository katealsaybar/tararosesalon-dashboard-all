<style>
/* Kate, 9 Nov 2026: Notices, Level 5 only. Write a notice for the bell (and one popup for an important one), see what was sent, switch an automatic kind
   on or off. Saved in public.site_notices (migrations/site_notices.sql); the bell itself is notifications.js on every page. */
.nt{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;align-items:start;max-width:1040px;margin:0 auto}
.nt-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.nt-card+.nt-card{margin-top:18px}
.nt-card h2{font-size:15px;font-weight:600;margin:0 0 12px}
.nt-f{margin-bottom:14px}
.nt-f>label,.nt-f>.nt-l{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.nt-f input[type=text],.nt-f input[type=datetime-local],.nt-f textarea,.nt-f select{width:100%;font:inherit;color:var(--text);border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:9px 12px;min-height:40px}
.nt-f textarea{min-height:92px;resize:vertical}
.nt-f .nt-h{font-size:12px;color:var(--muted);margin-top:4px}
.nt-c{display:flex;flex-wrap:wrap;gap:6px}
.nt-c button{font:inherit;font-size:13px;color:var(--muted);border:1px solid var(--border);background:none;border-radius:999px;padding:6px 12px;cursor:pointer;min-height:34px}
.nt-c button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:transparent}
.nt-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nt-sw{display:flex;align-items:center;gap:10px;font-size:14px}
.nt-sw button{width:42px;height:24px;flex:none;border-radius:999px;border:1px solid var(--border);background:var(--surface2);position:relative;padding:0;cursor:pointer}
.nt-sw button::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s}
.nt-sw button[aria-pressed="true"]{background:var(--text);border-color:transparent}
.nt-sw button[aria-pressed="true"]::after{transform:translateX(18px);background:var(--bg)}
.nt-btn{font:inherit;font-size:14px;font-weight:600;padding:9px 20px;min-height:42px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.nt-btn.pri{background:var(--text);color:var(--bg);border-color:transparent}
.nt-btn:disabled{opacity:.5;cursor:default}
.nt-st{min-height:22px;font-size:13px;color:var(--muted);margin-top:10px}
.nt-st.err{color:#B3402A;font-weight:600}
.nt-sent{width:100%;border-collapse:collapse;font-size:13px}
.nt-sent td{padding:9px 0;border-top:1px solid var(--border2);vertical-align:top}
.nt-sent tr:first-child td{border-top:0}
.nt-sent .r{text-align:right;color:var(--muted);white-space:nowrap;padding-left:10px}
.nt-sent small{display:block;color:var(--muted);margin-top:1px}
.nt-sent .lnk{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font:inherit;font-size:12px;cursor:pointer;padding:2px 0}
.nt-pill{display:inline-block;font-size:11px;border:1px solid var(--border);border-radius:999px;padding:1px 8px;color:var(--muted);margin-left:6px}
.nt-auto{list-style:none;padding:0;margin:0}
.nt-auto li{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:9px 0;border-top:1px solid var(--border2);font-size:14px}
.nt-auto li:first-child{border-top:0}
.nt-auto li.soon{color:var(--muted)}
.nt-note{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:820px){.nt{grid-template-columns:1fr}.nt-2{grid-template-columns:1fr}}
</style>
</head>
<body class="kb-wait">
<header class="kb-head" id="kbHead" data-title="Team Home"></header>
<main id="kbMain"><p class="kb-msg">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=3823f956"></script>
<script src="/assets/theme-fade.js"></script>
<script src="/pages.js?v=6044f3d7"></script>
<script src="/hub/hub.js?v=b36f9bda"></script>
<script src="/visits.js?v=1176426c"></script>
<script>
(function () {
  var main = document.getElementById('kbMain');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // The levels as people SEE them (28 Oct 2026: 1 Stylists & Beauticians, 2 Reception & Call Centre, 3 Leadership, 4 Executives & Marketing, 5 Accounts & Admin);
  // the database still keeps the old numbers, so each chip says which old level and which teams it means.
  var LV = [
    { k: 'all', t: 'Everyone' },
    { k: '1', t: '1 Stylists & Beauticians', old: 1, depts: ['Hair', 'Beauty'] },
    { k: '2', t: '2 Reception & Call Centre', old: 1, depts: ['Front Desk', 'Call Centre'] },
    { k: '3', t: '3 Leadership', old: 2 },
    { k: '4', t: '4 Executives & Marketing', old: 3 },
    { k: '5', t: '5 Accounts & Admin', old: 4 }
  ];
  var BR = [{ k: 'all', t: 'All salons' }, { k: 'SAA', t: 'Saadiyat' }, { k: 'KCA', t: 'Khalifa City A' }, { k: 'MC', t: 'Motor City' }, { k: 'AQ', t: 'Al Quoz' }];
  var LINKS = [
    ['', 'No link'], ['/?view=team', 'Podium Race'], ['/hub/complaint?view=board', 'Follow Up Complaints'], ['/hub/complaint', 'My Complaints'],
    ['/hub/suggestions', 'Suggestions Box'], ['/hub/', 'Team Home'], ['/reports/', 'Reports']
  ];
  var ICONS = [['megaphone', 'Announcement'], ['podium', 'Podium'], ['complaint', 'Complaint'], ['clock', 'Reminder'], ['reply', 'Reply'], ['chat', 'Comment'], ['pay', 'Payslip']];
  var AUTO = [
    { kind: 'complaint_tagged', t: 'Someone is tagged on a complaint', live: true },
    { kind: 'complaint_assigned', t: 'A complaint is assigned to you' }, { kind: 'complaint_overdue', t: 'A complaint is overdue or stuck' },
    { kind: 'podium_final', t: 'A Podium Race month is final' }, { kind: 'suggestion_reply', t: 'Someone replies to your suggestion' },
    { kind: 'one2one_comment', t: 'A comment is added to your 1-to-1' }, { kind: 'payslip_ready', t: 'Your payslip is ready' }
  ];
  var pick = { lv: { all: true }, br: { all: true } }, popup = false, autoState = {};

  function say(t, err) { var e = document.getElementById('ntSt'); if (!e) return; e.textContent = t; e.className = 'nt-st' + (err ? ' err' : ''); }
  function chips(list, key, id) {
    return '<div class="nt-c" id="' + id + '">' + list.map(function (o) { return '<button type="button" data-k="' + o.k + '" aria-pressed="' + (!!pick[key][o.k]) + '">' + esc(o.t) + '</button>'; }).join('') + '</div>';
  }
  function bindChips(id, key) {
    document.getElementById(id).addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var k = b.dataset.k, p = pick[key];
      if (k === 'all') { pick[key] = { all: true }; }
      else { delete p.all; if (p[k]) delete p[k]; else p[k] = true; if (!Object.keys(p).length) pick[key] = { all: true }; }
      [].forEach.call(this.children, function (x) { x.setAttribute('aria-pressed', !!pick[key][x.dataset.k]); });
    });
  }
  function audienceText(r) {
    var l = r.levels ? r.levels.map(function (n) { return n === 1 ? (r.depts ? (r.depts.indexOf('Hair') >= 0 ? '1' : '2') : '1 and 2') : (n + 1); }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(', ') : 'everyone';
    return (r.to ? 'one person' : (r.levels ? 'Level ' + l : 'everyone')) + (r.branches ? ', ' + r.branches.join(' ') : '');
  }
  var fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Dubai', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
  async function loadSent() {
    var r = await KB.client.rpc('notices_sent');
    var box = document.getElementById('ntSent'); if (!box) return;
    if (r.error) { box.innerHTML = '<tr><td>Could not load: ' + esc(r.error.message) + '</td></tr>'; return; }
    var rows = (r.data || []).filter(function (n) { return n.kind === 'manual'; });
    box.innerHTML = rows.length ? rows.map(function (n) {
      return '<tr><td>' + esc(n.title) + (n.popup ? '<span class="nt-pill">popup</span>' : '') + (n.withdrawn ? '<span class="nt-pill">taken down</span>' : '') +
        '<small>' + esc(audienceText(n)) + ', ' + esc(fmt.format(new Date(n.at))) + '</small>' +
        (n.withdrawn ? '' : '<button class="lnk" type="button" data-w="' + n.id + '">Take it down</button>') + '</td><td class="r">' + n.seen + ' seen</td></tr>';
    }).join('') : '<tr><td>Nothing sent yet.</td></tr>';
  }
  async function loadAuto() {
    var r = await KB.client.rpc('notices_auto_get');
    autoState = (!r.error && r.data) || {};
    var ul = document.getElementById('ntAuto'); if (!ul) return;
    ul.innerHTML = AUTO.map(function (a) {
      if (!a.live) return '<li class="soon"><span>' + esc(a.t) + '</span><span class="nt-pill">not built yet</span></li>';
      var on = autoState[a.kind] !== false;
      return '<li><span>' + esc(a.t) + '</span><span class="nt-sw"><button type="button" data-a="' + a.kind + '" aria-pressed="' + on + '" aria-label="' + esc(a.t) + ', ' + (on ? 'on' : 'off') + '"></button></span></li>';
    }).join('');
  }
  async function send() {
    var title = document.getElementById('ntTitle').value.trim();
    if (!title) { say('Write a title first.', true); return; }
    var levels = null, depts = null;
    if (!pick.lv.all) {
      var sel = LV.filter(function (o) { return pick.lv[o.k]; });
      levels = sel.map(function (o) { return o.old; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
      var d1 = sel.filter(function (o) { return o.old === 1; });
      if (d1.length === 1) depts = d1[0].depts;   // only one of the two level-1 groups ticked: narrow it to those teams (both ticked = all staff)
    }
    var branches = pick.br.all ? null : Object.keys(pick.br);
    var from = document.getElementById('ntFrom').value, until = document.getElementById('ntUntil').value;
    var who = pick.lv.all ? 'EVERYONE' : LV.filter(function (o) { return pick.lv[o.k]; }).map(function (o) { return o.t; }).join(' + ');
    if (!confirm('Send "' + title + '" to ' + who + (branches ? ' (' + branches.join(', ') + ')' : '') + (popup ? ', with a popup' : '') + '?')) return;
    var b = document.getElementById('ntSend'); b.disabled = true;
    var linkSel = document.getElementById('ntLink');
    var r = await KB.client.rpc('notice_send', {
      p_title: title, p_body: document.getElementById('ntBody').value, p_icon: document.getElementById('ntIcon').value,
      p_link: linkSel.value || null, p_label: linkSel.value ? 'Open ' + linkSel.options[linkSel.selectedIndex].text : null,
      p_levels: levels, p_depts: depts, p_branches: branches, p_popup: popup,
      p_from: from ? new Date(from + ':00+04:00').toISOString() : null, p_until: until ? new Date(until + ':00+04:00').toISOString() : null
    });
    b.disabled = false;
    if (r.error) { say('Not sent: ' + (r.error.message || 'try again') + '.', true); return; }
    say('Sent. It is in the bell now' + (popup ? ', and pops up once for each person.' : '.'));
    document.getElementById('ntTitle').value = ''; document.getElementById('ntBody').value = '';
    loadSent();
  }
  KB.ready.then(async function () {
    if (KB.realLevel !== 5 || KB.viewAs) {
      main.innerHTML = '<p class="kb-msg">This page is for Kate only' + (KB.viewAs ? ' (switch View as back to Level 6)' : '') + '.</p>';
      return;
    }
    main.innerHTML =
      KB.titleIcon('notices', 'Notices') +
      '<p class="kb-meta">Write a notice and it appears in the bell on every page for the people you pick. An important one can also pop up, once for each person. Notices stay for 30 days.</p>' +
      '<div class="nt"><div class="nt-card"><h2>Write a notice</h2>' +
        '<div class="nt-f"><label for="ntTitle">Title</label><input type="text" id="ntTitle" maxlength="120" autocomplete="off"></div>' +
        '<div class="nt-f"><label for="ntBody">What to tell them</label><textarea id="ntBody" maxlength="600"></textarea><div class="nt-h">No client names, please. Notices are seen by staff.</div></div>' +
        '<div class="nt-2"><div class="nt-f"><label for="ntLink">Where it takes them</label><select id="ntLink">' + LINKS.map(function (l) { return '<option value="' + esc(l[0]) + '">' + esc(l[1]) + '</option>'; }).join('') + '</select></div>' +
        '<div class="nt-f"><label for="ntIcon">Picture</label><select id="ntIcon">' + ICONS.map(function (l) { return '<option value="' + l[0] + '">' + l[1] + '</option>'; }).join('') + '</select></div></div>' +
        '<div class="nt-f"><span class="nt-l">Who sees it</span>' + chips(LV, 'lv', 'ntLv') + '<div class="nt-h">Same levels and teams as Page Access. Pick Everyone, or tick the levels.</div></div>' +
        '<div class="nt-f"><span class="nt-l">Which salons</span>' + chips(BR, 'br', 'ntBr') + '<div class="nt-h">A salon filter reaches stylists and beauticians. Reception, call centre and leadership have no salon on record, so they only get notices with All salons.</div></div>' +
        '<div class="nt-2"><div class="nt-f"><label for="ntFrom">Show from (Dubai time)</label><input type="datetime-local" id="ntFrom"><div class="nt-h">Empty means now.</div></div>' +
        '<div class="nt-f"><label for="ntUntil">Hide after</label><input type="datetime-local" id="ntUntil"><div class="nt-h">Empty means 30 days.</div></div></div>' +
        '<div class="nt-f"><div class="nt-sw"><button type="button" id="ntPop" aria-pressed="false" aria-label="Also show as a popup"></button><span>Also show as a popup (important only)</span></div><div class="nt-h">One popup at a time. Each person sees it once, then it is only in the bell.</div></div>' +
        '<button type="button" class="nt-btn pri" id="ntSend">Send to the bell</button><div class="nt-st" id="ntSt" role="status" aria-live="polite"></div></div>' +
      '<div><div class="nt-card"><h2>Sent notices</h2><table class="nt-sent"><tbody id="ntSent"><tr><td>Loading…</td></tr></tbody></table></div>' +
        '<div class="nt-card"><h2>These send themselves</h2><ul class="nt-auto" id="ntAuto"></ul><div class="nt-note">Switch one off here and it stops for everyone. Each one goes to the person it is about, with the complaint code only, never a client name.</div></div></div></div>';
    bindChips('ntLv', 'lv'); bindChips('ntBr', 'br');
    document.getElementById('ntPop').addEventListener('click', function () { popup = !popup; this.setAttribute('aria-pressed', popup); });
    document.getElementById('ntSend').addEventListener('click', send);
    document.getElementById('ntSent').addEventListener('click', async function (e) {
      var b = e.target.closest('[data-w]'); if (!b) return;
      if (!confirm('Take this notice down? It leaves everyone’s bell.')) return;
      var r = await KB.client.rpc('notice_withdraw', { p_id: Number(b.dataset.w) });
      if (r.error) say('Not done: ' + r.error.message, true); else loadSent();
    });
    document.getElementById('ntAuto').addEventListener('click', async function (e) {
      var b = e.target.closest('[data-a]'); if (!b) return;
      var on = b.getAttribute('aria-pressed') !== 'true';
      var r = await KB.client.rpc('notices_auto_set', { p_kind: b.dataset.a, p_enabled: on });
      if (r.error) { say('Not saved: ' + r.error.message, true); return; }
      b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', b.getAttribute('aria-label').replace(/, (on|off)$/, ', ' + (on ? 'on' : 'off')));
      say(on ? 'Switched on.' : 'Switched off. No new ones of this kind will be made.');
    });
    loadSent(); loadAuto();
  });
})();
</script>
<!-- Kate, 9 Nov 2026: the notification bell, on every signed-in page. -->
<script src="/notifications.js?v=a52ed9df"></script>
</body>
