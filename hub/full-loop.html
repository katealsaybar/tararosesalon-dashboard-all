<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Full Loop Handover · Team Home</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-96x96.png" sizes="96x96" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

<style>
  body.fl-wait .top,body.fl-wait .shell{visibility:hidden}
  .fl-msg{max-width:640px;margin:96px auto;padding:0 16px;font:400 16px/1.6 Inter,system-ui,sans-serif;color:var(--ink)}
  .fl-msg a{color:inherit}
  .fl-home{font-size:13.5px;color:var(--muted);text-decoration:none;white-space:nowrap;margin-right:4px}
  .fl-home:hover{color:var(--ink)}
  @media (max-width:640px){.fl-home{display:none}}

<body class="fl-wait">
<!-- The Full Loop Handover (Kate, 5 Oct 2026): Tara's handover site from Perplexity,
     as she built it (playbooks, decoder, Menu Builder, Handover Tracker, Marketing).
     Level 3 and up (kb_sections 'full-loop'). The three files that hold its text,
     content.js, data.js and app.js, are not in this repo (it is public; they carry AED
     tiers, the average bill and KPIs): they are rows in kb_assets, which only people
     who can open the section can read (migrations/kb_full_loop.sql), and this page
     runs them after the sign-in check. Her styles.css is in full-loop-tool/; the
     marketing files are the same ones /hub/marketing uses. Work stays in this tab;
     Save my work / Open saved file as on her site. ‹ Team Home is the only addition. -->
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <button class="iconbtn menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a href="#/" class="brand" aria-label="Tara Rose handover home">
    <svg class="logo" viewBox="0 0 40 40" width="34" height="34" fill="none" aria-hidden="true">
      <path d="M20 6c-7.7 0-14 6.3-14 14s6.3 14 14 14 14-6.3 14-14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M20 13c-3.9 0-7 3.1-7 7s3.1 7 7 7 7-3.1 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
      <circle cx="31" cy="11" r="3" style="fill:var(--accent-ink)"/>
    </svg>
    <span class="brand-text"><span class="brand-name">Tara Rose</span><span class="brand-sub">The Full Loop · Handover</span></span>
  </a>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <input id="q" type="search" placeholder="Search everything: brassy, fringe, gloss, Reset…" autocomplete="off" aria-label="Search the playbooks">
    <kbd>/</kbd>
    <div id="results" class="results" role="listbox" hidden></div>
  </div>
  <div class="actions">
    <a class="fl-home" href="/hub/">&lsaquo; Team Home</a>
    <span id="saveState" class="savestate" aria-live="polite"></span>
    <button class="btn ghost" id="loadBtn" title="Open a saved handover file">Open saved file</button>
    <button class="btn primary" id="saveBtn" title="Download your work as a file">Save<span class="hide-sm"> my work</span></button>
    <input type="file" id="loadFile" accept=".json,application/json" hidden>
    <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark mode">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Playbooks"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=20261001kb"></script>
<script src="/hub/hub.js?v=20261005loop"></script>
<script src="/hub/marketing-tool/marketing.js?v=20261005mkt"></script>
<script>
(function () {
  if (/\.html$/.test(location.pathname)) history.replaceState(null, '', location.pathname.replace(/\.html$/, '') + location.search + location.hash);
  var FILES = ['full-loop/content.js', 'full-loop/data.js', 'full-loop/app.js'];
  function say(html) {
    document.querySelector('.shell').remove();
    document.querySelector('.top').remove();
    var p = document.createElement('p'); p.className = 'fl-msg'; p.innerHTML = html;
    document.body.appendChild(p);
    document.body.classList.remove('fl-wait');
  }
  KB.ready.then(async function () {
    if (KB.allowed.indexOf('full-loop') < 0) { say('This page isn’t open to your account. <a href="/hub/">Back to Team Home</a>'); return; }
    var r = await TRSAuth.client().from('kb_assets').select('key,body').in('key', FILES);
    var got = {};
    (r.data || []).forEach(function (x) { got[x.key] = x.body; });
    if (r.error || FILES.some(function (k) { return !got[k]; })) { say('The handover didn’t load. Reload the page, and if it keeps happening tell Kate. <a href="/hub/">Back to Team Home</a>'); return; }
    FILES.forEach(function (k) {
      var s = document.createElement('script');
      s.text = got[k] + '\n//# sourceURL=' + k;
      document.body.appendChild(s);
    });
    document.body.classList.remove('fl-wait');
  });
})();
</script>
</body>
</html>
