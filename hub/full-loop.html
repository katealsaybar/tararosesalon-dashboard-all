<body class="fl-wait">
<!-- Service Playbooks (Kate, 5 Oct 2026), under The Tara Rose Way on Team Home: Tara's
     Full Loop handover site from Perplexity (playbooks, decoder, Menu Builder, Handover
     Tracker). Level 3 and up (kb_sections 'full-loop'). The three files that hold its
     text, content.js, data.js and app.js, are not in this repo (it is public; they carry
     AED tiers, the average bill and KPIs): they are rows in kb_assets, which only people
     who can open the section can read (migrations/kb_full_loop.sql), and this page runs
     them after the sign-in check. Her styles.css draws the layout; brand.css puts it in
     the site's look (lockup, colours, the Marketing-style sidebar), and the theme is the
     site's trs-theme. Her Marketing copy is left out: the Marketing row and any
     #/marketing link go to the shared /hub/marketing instead.
     Team sync (Kate, 5 Oct 2026): the Menu Builder and the Handover Tracker save to
     kb_playbook_state as you go and show live for everyone (full-loop-tool/sync.js,
     migrations/kb_playbook_state.sql). door() below gives sync.js its way into her
     app; Open saved file is hidden, it would overwrite everyone. -->
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <button class="iconbtn menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a href="#/" class="brand" aria-label="Service Playbooks home">

      <img class="fl-logo-light" src="/assets/mast-ink.png" alt="Tara Rose">
      <img class="fl-logo-dark" src="/assets/mast-paper.png" alt="Tara Rose">
      <span>Salons</span>
    </span>
  </a>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <input id="q" type="search" placeholder="Search everything: brassy, fringe, gloss, Reset…" autocomplete="off" aria-label="Search the playbooks">
    <kbd>/</kbd>

  </div>
  <div class="actions">
    <a class="fl-home" href="/hub/">&lsaquo; Team Home</a>

    <button class="btn ghost" id="loadBtn" title="Open a saved handover file">Open saved file</button>
    <button class="btn primary" id="saveBtn" title="Download your work as a file">Save<span class="hide-sm"> my work</span></button>
    <input type="file" id="loadFile" accept=".json,application/json" hidden>
    <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark mode">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </div>

<script src="/hub/hub.js?v=20261008s8"></script>
<script src="/hub/marketing-tool/marketing.js?v=20261005mkt"></script>
<script src="/hub/full-loop-tool/sync.js?v=20261005pb2"></script>
<script>
(function () {
  if (/\.html$/.test(location.pathname)) history.replaceState(null, '', location.pathname.replace(/\.html$/, '') + location.search + location.hash);
  var FILES = ['full-loop/content.js', 'full-loop/data.js', 'full-loop/app.js'];
  // Team sync (Kate, 5 Oct 2026): her markDirty() also tells sync.js, a small
  // window.TR_STATE lets sync.js read and redraw her state, and the sidebar note says
  // the work is shared. Each edit must find its exact text in her app.js.
  function door(src) {
    var edits = [
      ['const markDirty = () => { dirty = true; updateSaveState(); };',
       'const markDirty = () => { dirty = true; updateSaveState(); if (window.TR_SYNC) window.TR_SYNC.changed(); };\n' +
       '  window.TR_STATE = { get: () => S, redraw: () => route(), saved: t => { dirty = false; savedAt = t; updateSaveState(); }, unsaved: () => { dirty = true; updateSaveState(); } };'],
      ['<strong>Saving:</strong> prices, handover and marketing work stay in this tab. Press <strong>Save my work</strong> to keep a file, and <strong>Open saved file</strong> to carry on. Not live team sync.',
       '<strong>Saving:</strong> the Menu Builder and the Handover Tracker are shared with the team and save as you go. <strong>Save my work</strong> downloads a copy.']
    ];
    for (var i = 0; i < edits.length; i++) {
      if (src.indexOf(edits[i][0]) < 0) return null;
      src = src.replace(edits[i][0], edits[i][1]);
    }
    return src;
  }
  function say(html) {
    document.querySelector('.shell').remove();
    document.querySelector('.top').remove();
    var p = document.createElement('p'); p.className = 'fl-msg'; p.innerHTML = html;
    document.body.appendChild(p);
    document.body.classList.remove('fl-wait');
  }
  KB.ready.then(async function () {
    if (KB.allowed.indexOf('full-loop') < 0) { say('This page isn’t open to your account. <a href="/hub/">Back to Team Home</a>'); return; }
    var r = await TRSAuth.client().from('kb_assets').select('key,body').in('key', FILES);
    var got = {};
    (r.data || []).forEach(function (x) { got[x.key] = x.body; });
    if (r.error || FILES.some(function (k) { return !got[k]; })) { say('The handover didn’t load. Reload the page, and if it keeps happening tell Kate. <a href="/hub/">Back to Team Home</a>'); return; }
    // Marketing has its own page, shared by the team: no second copy in here.
    var toMarketing = function () {
      if (/^#\/marketing/.test(location.hash)) { location.replace('/hub/marketing' + location.hash); return true; }
    };
    if (toMarketing()) return;
    window.addEventListener('hashchange', toMarketing);
    var stop = false;
    FILES.forEach(function (k) {
      if (stop) return;
      var s = document.createElement('script');
      var body = got[k];
      if (k === 'full-loop/app.js') { body = door(body); if (!body) { stop = true; say('The playbooks didn’t load. Reload the page, and if it keeps happening tell Kate. <a href="/hub/">Back to Team Home</a>'); return; } }
      s.text = body + '\n//# sourceURL=' + k;
      document.body.appendChild(s);
      if (k === 'full-loop/data.js') window.TR_NAV = window.TR_NAV.map(function (n) {
        return n.id === 'marketing' ? Object.assign({}, n, { label: 'Marketing ↗' }) : n;
      });
    });
    // Her app picks light or dark from the computer; the site's own setting wins, and
    // her moon button saves to it, so every page stays the same.
    // Her app titles each page "… · Tara Rose Handover"; the site calls it Service Playbooks.
    var retitle = function () {
      var t = document.title.replace(/ · Tara Rose Handover$/, ' · Service Playbooks');
      if (t !== document.title) document.title = t;
    };
    retitle();
    new MutationObserver(retitle).observe(document.querySelector('title'), { childList: true });
    var root = document.documentElement;
    try { var th = localStorage.getItem('trs-theme'); if (th === 'dark' || th === 'light') root.dataset.theme = th; } catch (e) {}
    document.getElementById('themeBtn').addEventListener('click', function () {
      try { localStorage.setItem('trs-theme', root.dataset.theme); } catch (e) {}
    });
    document.body.classList.remove('fl-wait');
    if (stop) return;
    try { await TR_SYNC.boot(); }
    catch (e) { say('The shared menu and tracker didn’t load. Reload the page, and if it keeps happening tell Kate. <a href="/hub/">Back to Team Home</a>'); }
  });
})();
</script>
<script>KB.iconTitles('full-loop', '#99F6E4');</script>
</body>
</html>
