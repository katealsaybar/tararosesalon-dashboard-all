<style>
/* Service Calendar (Kate, 17 Nov 2026). Phorest's Day and Week appointment calendar for the four UAE salons: stylists across, time down the side, one
   block per service. Tokens hub.css does not have are the category colours and the now line below. */
:root{
  --c-colour:#C2467A;--c-colour-bg:#FBE4EE;--c-cut:#1F8A8A;--c-cut-bg:#DDF1F0;--c-treat:#6E56CF;--c-treat-bg:#ECE8FA;
  --c-nails:#B97A0C;--c-nails-bg:#FBF0D6;--c-beauty:#3E7A5E;--c-beauty-bg:#E1F1E8;--c-other:#77706A;--c-other-bg:#ECE9E2;--now:#D62F2F;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --c-colour:#F27BAB;--c-colour-bg:rgba(242,123,171,.20);--c-cut:#5CD0CB;--c-cut-bg:rgba(92,208,203,.18);--c-treat:#B5A4FF;--c-treat-bg:rgba(181,164,255,.20);
  --c-nails:#F0B547;--c-nails-bg:rgba(240,181,71,.18);--c-beauty:#7FD3A8;--c-beauty-bg:rgba(127,211,168,.18);--c-other:#B7B0A6;--c-other-bg:rgba(183,176,166,.16);--now:#FF7A7A;
}}
:root[data-theme="dark"]{
  --c-colour:#F27BAB;--c-colour-bg:rgba(242,123,171,.20);--c-cut:#5CD0CB;--c-cut-bg:rgba(92,208,203,.18);--c-treat:#B5A4FF;--c-treat-bg:rgba(181,164,255,.20);
  --c-nails:#F0B547;--c-nails-bg:rgba(240,181,71,.18);--c-beauty:#7FD3A8;--c-beauty-bg:rgba(127,211,168,.18);--c-other:#B7B0A6;--c-other-bg:rgba(183,176,166,.16);--now:#FF7A7A;
}
.wrap{max-width:1400px}
body{overflow-x:hidden}
/* the site's sticky header (same as Leave & Holiday Calendar): the rule that sums up the filters, Branch, Period and View rows, and on a phone the filter sheet.
   --kbh is the Team Home header's height, --tb the bottom of this bar. */
.topbar{position:sticky;top:var(--kbh,76px);z-index:19;background:var(--bg);margin:0 -2px;padding:0 2px}
.lc-rule{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 0;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2)}
.lc-rule b{font-weight:700;color:var(--text)}
.lc-rule .rl{display:flex;gap:8px;flex-wrap:wrap}
.mast-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.tglr{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:20px;padding:6px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;min-height:34px}
.tglr:hover{color:var(--text)}
#fSheetBtn{display:none}
.topbar.fclosed .filters-wrap{display:none}
.filters{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 32px;padding:8px 0}
.f-row{display:flex;align-items:baseline;gap:12px;min-width:0}
.f-lbl{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);flex-shrink:0}
.chipset{display:flex;flex-wrap:wrap;align-items:baseline}
.gchip{border:0;background:none;padding:6px 0;font-size:14px;color:var(--muted2);cursor:pointer;white-space:nowrap;border-bottom:1px solid transparent;line-height:1.3;font-family:inherit}
.gchip:hover{color:var(--text)}
.gchip[aria-pressed="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.sep{color:var(--muted2);opacity:.4;font-size:14px;padding:0 8px;user-select:none}
.gseg{display:inline-flex;align-self:center;border:1px solid var(--border);border-radius:999px;padding:2px;gap:2px}
.gseg .gchip{padding:3px 12px;border:0;border-radius:999px;font-size:13px}
.gseg .gchip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.dIn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 12px;min-height:32px;color:var(--text);font:inherit;font-size:13.5px;margin-left:8px}
.fscrim{display:none;position:fixed;inset:0;z-index:130;background:rgba(26,26,26,.38)}
.fsheet{display:none;flex-direction:column;position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:131;width:min(100%,390px);background:var(--bg);border-radius:18px 18px 0 0;padding:0 10px 18px;max-height:80vh;overflow:auto;box-shadow:var(--shadow)}
body.sheet-open .fscrim,body.sheet-open .fsheet{display:flex}
.fsheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.fsheet-head b{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.fsheet .filters{flex-direction:column;align-items:stretch;gap:14px;padding:12px 0 4px}
.fsheet .f-row{flex-direction:column;align-items:stretch;gap:8px}
.fsheet .f-lbl{font-size:12px}
.fsheet .chipset{gap:8px}
.fsheet .sep{display:none}
.fsheet .gchip{min-height:44px;padding:0 16px;border:1px solid var(--border);border-radius:999px;font-size:15px;background:var(--surface)}
.fsheet .gseg .gchip{border:0}
.fsheet .dIn{margin:0;min-height:44px}
.fchip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13.5px;cursor:pointer;white-space:nowrap;min-height:32px;color:var(--text)}
.navbtn{border:1px solid var(--border);background:var(--surface);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.pg{padding-top:18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
.pg h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:32px;line-height:1.15;margin:4px 0 8px}
.pg .lead{margin:0;color:var(--muted);max-width:70ch;font-size:15.5px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.sc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px 10px;cursor:pointer;box-shadow:var(--shadow);min-width:0;color:var(--text)}
.sc:hover{border-color:var(--muted2)}
.sc .lbl{font-size:13px;font-weight:600}
.sc .big{font-family:'Playfair Display',Georgia,serif;font-size:32px;font-weight:500;line-height:1.1;margin:5px 0 0;font-variant-numeric:tabular-nums}
.sc .sub{font-size:13px;color:var(--muted);margin-top:3px}

.tools{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:18px 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg,.sg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;min-height:30px;color:var(--text)}
.lg i{width:12px;height:12px;border-radius:4px;display:inline-block;background:var(--cc-bg);border:2px solid var(--cc)}
.sg i{width:14px;height:12px;border-radius:3px;display:inline-block;border:2px solid var(--muted2)}
.sg i.paid{background:var(--muted2)}
.sg i.in{background:repeating-linear-gradient(135deg,var(--muted2) 0 3px,transparent 3px 6px)}
.sg i.booked{border-style:dashed}
.lg[aria-pressed="false"],.sg[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.star{color:var(--warn);font-weight:700}
.pill{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:34px;cursor:pointer;max-width:100%;color:var(--text);font:inherit}
.view-set{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
.view-set button{border:0;background:none;padding:6px 16px;cursor:pointer;min-height:34px;font-size:14px;color:var(--text)}
.view-set button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
#staffPick{display:inline-flex;gap:6px;align-items:center}
#staffPick[hidden]{display:none}
.upd{font-size:12.5px;color:var(--muted2);margin-left:auto}

.cal{position:relative;overflow:auto;max-height:76vh;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.cal-in{min-width:calc(56px + var(--n)*118px)}
.grid{display:grid;grid-template-columns:56px repeat(var(--n),minmax(118px,1fr))}
.chead{position:sticky;top:0;z-index:12;background:var(--surface2);border-bottom:1px solid var(--border)}
.chead>div{padding:8px 8px 7px;border-left:1px solid var(--border);min-width:0}
.chead .corner{position:sticky;left:0;z-index:13;background:var(--surface2);border-left:0}
.chead .ch{cursor:pointer;text-align:left;background:none;border-top:0;border-right:0;border-bottom:0;color:var(--text);font:inherit}
.chead .ch:hover{background:var(--border2)}
.chead .n1{font-weight:700;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .n2{font-size:13px;line-height:1.2;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .n3{font-size:11.5px;color:var(--muted2);margin-top:3px;font-variant-numeric:tabular-nums}
.chead .ch.is-today .n1{color:var(--accent)}
.cbody{position:relative}
.gut{position:sticky;left:0;z-index:8;background:var(--surface);border-right:1px solid var(--border);height:var(--h)}
.gut span{position:absolute;right:7px;transform:translateY(-50%);font-size:11.5px;color:var(--muted2);font-variant-numeric:tabular-nums;background:var(--surface);padding:0 2px}
.col{position:relative;height:var(--h);border-left:1px solid var(--border);
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(var(--border2) 1px,transparent 1px);
  background-size:100% var(--hh),100% calc(var(--hh)/2)}
.col.off{background-color:var(--surface2)}
.blk{position:absolute;overflow:hidden;border-radius:7px;border:1px solid var(--cc);border-left-width:5px;background:var(--cc-bg);padding:2px 5px;cursor:pointer;line-height:1.2;font-size:12px;text-align:left;color:var(--text);font-family:inherit}
.blk:hover{z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.22);overflow:visible;min-height:var(--minh)}
.blk .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .m{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk.sm{display:flex;gap:6px;align-items:center;padding-top:0;padding-bottom:0}
.blk.sm .t{flex:0 1 auto}.blk.sm .m{flex:1 1 0;min-width:0}
.blk.s-in{background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--cc) 22%,transparent) 6px 12px)}
.blk.s-booked{background:color-mix(in srgb,var(--cc-bg) 40%,var(--surface));border-style:dashed;border-left-style:solid}
.c-colour{--cc:var(--c-colour);--cc-bg:var(--c-colour-bg)}
.c-cut{--cc:var(--c-cut);--cc-bg:var(--c-cut-bg)}
.c-treat{--cc:var(--c-treat);--cc-bg:var(--c-treat-bg)}
.c-nails{--cc:var(--c-nails);--cc-bg:var(--c-nails-bg)}
.c-beauty{--cc:var(--c-beauty);--cc-bg:var(--c-beauty-bg)}
.c-other{--cc:var(--c-other);--cc-bg:var(--c-other-bg)}
.now{position:absolute;left:56px;right:0;height:0;border-top:2px solid var(--now);z-index:7;pointer-events:none}
.now b{position:absolute;left:-52px;top:-10px;background:var(--now);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:700}
.band{position:absolute;left:56px;right:0;background:color-mix(in srgb,var(--accent) 16%,transparent);border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);z-index:3;pointer-events:none}
.empty{padding:34px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:14px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.search{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:36px;min-width:240px;color:var(--text);font:inherit}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer}
th[aria-sort]::after{content:" \25B2";font-size:9px}
th[aria-sort="descending"]::after{content:" \25BC"}
td{padding:9px 12px;border-bottom:1px solid var(--border2);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--surface2)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--cc);margin-right:8px}
.badge{display:inline-flex;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.badge.paid{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;min-height:36px;color:var(--text);font:inherit}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
.more{margin:12px auto 0;display:block}
.foot{margin-top:20px;font-size:13px;color:var(--muted2);max-width:84ch}
.foot p{margin:5px 0}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.scrim[hidden]{display:none}
.dlg{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;color:var(--text)}
.dlg .top{padding:14px 18px;background:var(--cc-bg);border-bottom:4px solid var(--cc)}
.dlg .top h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:21px;margin:0;line-height:1.2}
.dlg .top .when{font-size:14px;color:var(--muted);margin-top:4px}
.dlg dl{margin:0;padding:12px 18px 4px;display:grid;grid-template-columns:96px 1fr;gap:8px 10px;font-size:14.5px}
.dlg dt{color:var(--muted2);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.dlg dd{margin:0}
.dlg .act{padding:8px 18px 16px;display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:760px){
  .cards{grid-template-columns:1fr 1fr}.sc .big{font-size:27px}
  .pg h1{font-size:26px}
  .lc-rule{padding:6px 0;min-height:44px}
  .lc-rule .rl{display:none}
  .mast-acts{flex-wrap:nowrap;min-width:0;width:100%;justify-content:flex-start}
  .filters-wrap,#filtersBtn{display:none}
  .tglr{min-height:44px;padding:0 14px;font-size:12.5px;letter-spacing:.02em;text-transform:none;color:var(--text)}
  #fSheetBtn{display:inline-flex;align-items:center;gap:7px;max-width:100%;min-width:0}
  #fSheetSum{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar{border-bottom:1px solid var(--border)}
  .wrap{padding-left:10px;padding-right:10px}
  .cal{max-height:none;border-radius:10px}
  .scrim{align-items:flex-end;padding:0}.dlg{width:100%;border-radius:16px 16px 0 0}
  .upd{margin-left:0;flex-basis:100%}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr.row{padding:10px 12px;border-bottom:1px solid var(--border)}
  td{border:0;padding:2px 0}
  .search{min-width:0;flex:1 1 100%}
}
</style>
</head>
<body class="kb-wait">
<!-- Service Calendar (Kate, 17 Nov 2026): who did what and when, at each UAE salon. Levels 2, 3 and 5 (Accounts, old Level 4, is skipped): it shows client names.
     Nothing personal is in this file: the page reads service_calendar() in Supabase (migrations/service_calendar.sql), which answers those levels only.
     The rows come from Phorest's API through "phorest data export/appointments/sync_appointments.py" (cowork repo). -->
<div class="wrap">
  <header class="kb-head" id="kbHead" data-title="Team Home"></header>
  <main id="kbMain"><p class="kb-msg">Loading…</p></main>
  <footer class="kb-foot">For the Tara Rose Salons team only. <a href="/privacy/">Privacy</a></footer>
</div>
<div class="scrim" id="scrim" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-label="Service detail"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js?v=3823f956"></script>
<script src="/assets/theme-fade.js"></script>
<script src="/hub/hub.js?v=ae8fbb27"></script>
<script src="/js/visits.js?v=e33b3a0d"></script>
<script>
(function () {
  var main = document.getElementById('kbMain');
  if (/\.html$/.test(location.pathname)) history.replaceState(null, '', location.pathname.replace(/\.html$/, '') + location.search + location.hash);
  function notFound() { main.innerHTML = '<p class="kb-msg">This page isn’t open to your account. <a href="/hub/">Back to Team Home</a></p>'; }

  /* The site's sticky header drives the page: Branch, Period (with Custom From and To) and View, the same bar as Leave & Holiday Calendar. */
  var BODY = '<div class="topbar" id="topbar">' +
    '<div class="lc-rule"><span id="mastBranch"></span><span class="rl"><span id="mastRange"></span></span>' +
    '<span class="mast-acts"><button class="tglr" id="filtersBtn" type="button" aria-expanded="true" aria-controls="filters">Hide filters</button>' +
    '<button class="tglr" id="fSheetBtn" type="button" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg><span id="fSheetSum">Filters</span></button></span></div>' +
    '<div class="filters-wrap"><div class="filters" id="filters"></div></div></div>' +
    '<div class="pg"><div class="eyebrow">Numbers · Daily</div><h1>Service Calendar</h1>' +
    '<p class="lead">Who did what, and when, at each salon. The same picture as the Phorest calendar, for any day, so you can look back at a day without opening Phorest.</p>' +
    '<div class="cards" id="cards"></div>' +
    '<div class="tools"><span id="staffPick" hidden></span><span class="upd" id="upd"></span></div>' +
    '<div class="tools" style="margin-top:0"><div class="legend" id="legend"></div></div>' +
    '<div class="tools" style="margin-top:0"><div class="legend" id="stlegend"></div><span style="font-size:13px;color:var(--muted)"><span class="star">★</span> client asked for this stylist</span></div>' +
    '<div id="calMain"></div>' +
    '<div class="foot"><p><b>How to read it:</b> a solid block is a service that is done and paid. Striped means the client is in the chair now. Dashed means booked and still to come. Click a block for the detail, click a stylist’s name for her week.</p>' +
    '<p>Branch and Period come from the bar at the top. One day shows the Day view; a longer period shows each stylist across the days, or the List. Up to 4 weeks at a time.</p>' +
    '<p>Times come from Phorest and refresh once a day, so today shows the bookings as they were at the last update. The groups (Colour, Cut and style, Treatments, Nails, Beauty) are read from the service name, so a few odd names may sit in the wrong group. Cancelled and no-show bookings are not shown.</p></div></div>' +
    '<div class="fscrim" id="fScrim"></div><div class="fsheet" id="fSheet" role="dialog" aria-label="Filters"><div class="fsheet-head"><b>Filters</b><button class="tglr" type="button" id="fDone">Done</button></div><div id="fSheetBody"></div></div>';

  function setTb() {
    var h = document.getElementById('kbHead'), t = document.getElementById('topbar');
    var kh = h ? Math.round(h.getBoundingClientRect().height) : 76;
    document.documentElement.style.setProperty('--kbh', kh + 'px');
    document.documentElement.style.setProperty('--tb', (kh + (t ? t.offsetHeight : 0)) + 'px');
  }

  var PX = 1.1, T0 = 540, T1 = 1260;           // 9:00 AM to 9:00 PM, 1.1px a minute
  var HH = 60 * PX, H = (T1 - T0) * PX, MAXDAYS = 28;

    rows.sort(function (a,b) { var x = keyf(a), y = keyf(b); return (x < y ? -1 : x > y ? 1 : a.s - b.s) * S.sortDir; });
    var shown = S.showAll ? rows : rows.slice(0, 40), cols = 6 + (many ? 1 : 0) + (mb ? 1 : 0);
    function th(k, l){ return '<th data-sort="' + k + '" ' + (S.sortKey === k ? 'aria-sort="' + (S.sortDir > 0 ? 'ascending' : 'descending') + '"' : '') + '>' + l + '</th>'; }
    document.getElementById('calMain').innerHTML = '<div class="bar"><input class="search" id="q" type="search" placeholder="Search stylist, service or client" value="' + esc(S.q) + '"><span style="color:var(--muted);font-size:14px">' + rows.length + ' service' + (rows.length === 1 ? '' : 's') + ' · ' + (single() ? dlabel(S.from, true) : dlabel(S.from) + ' to ' + dlabel(S.to, true)) + ' · ' + brLabel() + '</span></div>'
      + '<div class="tw"><table><thead><tr>' + th('ds', many ? 'Day and time' : 'Time') + (mb ? th('b', 'Salon') : '') + th('st','Stylist') + th('sv','Service') + th('cn','Client') + th('len','Length') + th('state','Status') + '</tr></thead><tbody>'
      + (shown.map(function (r) { var st = STATES[r.state] || ['', r.state];
          return '<tr class="row c-' + r.cat + '" data-id="' + r.i + '"><td>' + (many ? dlabel(r.d) + ', ' : '') + fmt(r.s) + '</td>' + (mb ? '<td>' + r.b + '</td>' : '') + '<td>' + esc(r.st) + '</td><td><span class="cdot"></span>' + esc(r.sv) + '</td><td>' + (r.req ? '<span class="star">★</span> ' : '') + esc(r.cn) + '</td><td>' + dur(r.e - r.s) + '</td><td><span class="badge ' + st[0] + '">' + st[1] + '</span></td></tr>'; }).join('') || '<tr><td colspan="' + cols + '" style="text-align:center;color:var(--muted);padding:26px">No services match.</td></tr>')
      + '</tbody></table></div>' + (rows.length > 40 && !S.showAll ? '<button class="btn more" type="button" id="more">Show all ' + rows.length + '</button>' : '');
  }

  /* ---- detail */
  function openDetail(i){
    var r = W.rows[i]; if (!r) return;
    var st = STATES[r.state] || ['paid', r.state], dlg = document.getElementById('dlg'); dlg.className = 'dlg c-' + r.cat;
    dlg.innerHTML = '<div class="top"><h3>' + esc(r.sv) + '</h3><div class="when">' + dlabel(r.d, true) + ' · ' + fmt(r.s) + ' to ' + fmt(r.e) + ' · ' + dur(r.e - r.s) + '</div></div>'
      + '<dl><dt>Stylist</dt><dd>' + esc(r.st) + (r.req ? ' <span class="star">★</span> asked for' : '') + '</dd><dt>Client</dt><dd>' + (esc(r.cn) || '-') + '</dd><dt>Status</dt><dd>' + st[1] + '</dd><dt>Group</dt><dd>' + CATS[r.cat] + '</dd><dt>Salon</dt><dd>' + BR_FULL[r.b] + '</dd></dl>'
      + '<div class="act"><button class="btn pri" type="button" data-act="week" data-staff="' + esc(r.sk) + '">' + esc(firstLast(r.st)[0]) + '’s week</button><button class="btn" type="button" data-act="close">Close</button></div>';
    document.getElementById('scrim').hidden = false; dlg.querySelector('.btn.pri').focus();
  }
  function closeDetail(){ document.getElementById('scrim').hidden = true; }

  /* ---- render */
  function render(){
    renderFilters();
    renderTiles();
    if (S.view === 'list') renderList(); else renderGrid(S.view === 'week' ? weekCols() : dayCols());
    setTb();
  }
  function flashBand(m){
    var col = document.querySelector('.cbody'), cal = document.getElementById('cal'); if (!col || !cal) return;
    [].forEach.call(document.querySelectorAll('.band'), function (b) { b.remove(); });
    var b = document.createElement('div'); b.className = 'band'; b.style.top = (m - T0) * PX + 'px'; b.style.height = 15 * PX + 'px'; col.appendChild(b);
    cal.scrollTo({top:Math.max(0, (m - T0) * PX - 120), behavior:'smooth'}); setTimeout(function () { b.remove(); }, 5000);
  }
  /* a week of a stylist: the page's period becomes the Monday to Sunday of the day she was opened from */
  function openWeek(sk, fromDay){ S.staff = sk; S.view = 'week'; if (single()) { var ws = weekStart(fromDay || S.from); S.from = ws; S.to = addDays(ws, 6); } load(); }

  function wire(){
    document.getElementById('filters').addEventListener('click', onGlobalChip);
    document.getElementById('fSheetBody').addEventListener('click', onGlobalChip);
    function sheetOpen(on){ document.body.classList.toggle('sheet-open', on); document.getElementById('fSheetBtn').setAttribute('aria-expanded', on); }
    document.getElementById('fSheetBtn').onclick = function () { sheetOpen(true); };
    document.getElementById('fDone').onclick = function () { sheetOpen(false); };
    document.getElementById('fScrim').onclick = function () { sheetOpen(false); };
    var tbar = document.getElementById('topbar'), fb = document.getElementById('filtersBtn');
    function setBar(open, save){
      tbar.classList.toggle('fclosed', !open); fb.textContent = open ? 'Hide filters' : 'Show filters'; fb.setAttribute('aria-expanded', open);
      if (save) { try { localStorage.setItem('trs-filters', open ? 'open' : 'closed'); } catch (e) {} }
      setTb();
    }
    fb.onclick = function () { setBar(tbar.classList.contains('fclosed'), true); };
    try { if (localStorage.getItem('trs-filters') === 'closed' && matchMedia('(min-width:761px)').matches) setBar(false, false); } catch (e) {}

    document.getElementById('calMain').parentNode.addEventListener('click', function (e) {
      var t = e.target.closest('button, tr.row, th'); if (!t || t.classList.contains('gchip')) return;
      var d = t.dataset;
      if (d.v) return;
      if (d.day && !d.act) { S.view = 'day'; S.from = S.to = d.day; S.staff = null; S.mi = 0; load(); }
      else if (d.cat) { S.hideCat[d.cat] = !S.hideCat[d.cat]; render(); }
      else if (d.state) { S.hideState[d.state] = !S.hideState[d.state]; render(); }
      else if (d.nav) { var n = dayStaff().length; S.mi = (S.mi + +d.nav + n) % n; render(); }
      else if (t.closest('.chead') && d.staff) { openWeek(d.staff, S.from); }
      else if (t.classList.contains('blk') || t.classList.contains('row')) { openDetail(+d.id); }
      else if (d.sort) { if (S.sortKey === d.sort) S.sortDir *= -1; else { S.sortKey = d.sort; S.sortDir = 1; } render(); }
      else if (t.id === 'more') { S.showAll = true; render(); }
      else if (d.act === 'list') { S.view = 'list'; render(); }
      else if (d.act === 'sortchair') { S.sortChair = !S.sortChair; render(); }
      else if (d.act === 'busy') { flashBand(busiest(dayRows().filter(visible)).at); }
      else if (d.act === 'busyday') {
        var b = days().map(function (x) { return [x, weekRows().filter(function (r) { return r.d === x && visible(r); }).length]; }).sort(function (a,c) { return c[1] - a[1]; })[0];
        if (b) { S.view = 'day'; S.from = S.to = b[0]; load(); }
      }
    });
    document.getElementById('dlg').addEventListener('click', function (e) {
      var t = e.target.closest('button'); if (!t) return;
      if (t.dataset.act === 'close') closeDetail();
      if (t.dataset.act === 'week') { closeDetail(); var r = W.rows.filter(function (x) { return x.sk === t.dataset.staff; })[0]; openWeek(t.dataset.staff, r ? r.d : S.from); }
    });
    document.addEventListener('change', function (e) {
      if (e.target.id === 'staffSel') { S.staff = e.target.value; render(); }
      if (e.target.id === 'mSel') { S.mi = +e.target.value; render(); }
      if (e.target.classList.contains('dIn') && e.target.value) { S[e.target.dataset.k] = e.target.value; if (S.to < S.from) { if (e.target.dataset.k === 'from') S.to = S.from; else S.from = S.to; } S.staff = null; S.mi = 0; load(); }
    });
    document.addEventListener('input', function (e) {
      if (e.target.id === 'q') { S.q = e.target.value; var p = e.target.selectionStart; renderList(); var q = document.getElementById('q'); q.focus(); q.setSelectionRange(p, p); }
    });
    document.getElementById('scrim').addEventListener('click', function (e) { if (e.target.id === 'scrim') closeDetail(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetail(); });
    MQ.addEventListener('change', function () { if (W) render(); });
    window.addEventListener('resize', setTb);
    if (window.ResizeObserver) new ResizeObserver(setTb).observe(tbar);
  }

  KB.ready.then(async function () {
    if (KB.allowed.indexOf('servicecal') < 0) { notFound(); return; }
    var r = await KB.client.rpc('service_calendar', {p_branch:S.br[0], p_from:S.from, p_to:S.to});
    if (r.error || !r.data) { notFound(); return; }
    main.innerHTML = BODY;
    wire(); setTb();
    await load();
  });
})();
</script>
