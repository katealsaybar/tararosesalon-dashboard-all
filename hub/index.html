<script>
  // The dashboard's theme setting, before the first paint.
  try { var t = localStorage.getItem('trs-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}

<body class="kb-wait">
<div class="wrap">
  <header class="kb-head" id="kbHead" data-title="Team Home"></header>
  <script>
    // Kate, 30 Oct 2026 (adult-learning audit ALAD-5): on a door (?door=kb or ?door=tools) the small label says where you are
    // (Team Home) and the big title says which door, so nobody is told they are in the Knowledge Base on the Tools door.
    (function () {
      var d = new URLSearchParams(location.search).get('door'), T = { kb: 'Knowledge Base', tools: 'Tools', dashboard: 'Dashboard' }, h = document.getElementById('kbHead');
      if (T[d] && h) { h.dataset.title = T[d]; h.dataset.eyebrow = 'Team Home'; }
    })();
  </script>
  <main>
    <p class="kb-hello" id="kbHello"></p>
    <a class="kb-mylink" id="kbMyLink" hidden>My numbers &amp; payslip <span aria-hidden="true">→</span></a>
    <p class="kb-intro" id="kbIntro">Everything we do, written down in one place. Open a section, or search for a treatment.</p>
    <div id="kbGrid"></div>
  </main>
  <footer class="kb-foot">For the Tara Rose Salons team only. <a href="/privacy/">Privacy</a></footer>
</div>

<script src="/assets/theme-fade.js"></script>
<script src="/js/nav-layout.js?v=14cd1d3a"></script>
<script src="/hub/hub.js?v=9bf328c3"></script>
<script src="/js/visits.js?v=e33b3a0d"></script>
<script>
KB.ready.then(async function () {
  var esc = KB.esc;
  var first = (KB.name || '').split(/[\s(]/)[0];
  document.getElementById('kbHello').textContent = first ? 'Hello, ' + first : 'Hello';
  if (KB.isStaff) document.getElementById('kbIntro').textContent =
    'Your SOPs and your induction, in one place. Open a section, or search for a treatment.';

  // How many pages each section has. A row comes back only for sections this person may read.
  var r = await KB.client.from('kb_pages').select('section,slug,note');
  var counts = {}, checks = {};
  // Kate, 6 Oct 2026: pages with a "being confirmed" note are counted per section and
  // shown on its row as "N to check", so what still needs Tara's or HR's yes is visible
  // from Team Home (Level 2 and up). HR Forms count from kb_files.note the same way.
  var toCheck = function (n) { return !!n && /confirm|approv|review/i.test(n); };
  (r.data || []).forEach(function (x) {
    if (!KB.shows(x.slug)) return;
    counts[x.section] = (counts[x.section] || 0) + 1;
    if (toCheck(x.note)) checks[x.section] = (checks[x.section] || 0) + 1;
  });
  if (KB.allowed.indexOf('hr-forms') >= 0) {
    var hf = await KB.client.from('kb_files').select('code,note').eq('section', 'hr-forms');
    (hf.data || []).forEach(function (x) { if (toCheck(x.note)) checks['hr-forms'] = (checks['hr-forms'] || 0) + 1; });
  }

  // Only what kb_access() opened to this person; the database refuses the rest anyway.
  var shown = KB.SECTIONS.filter(KB.opens);
  // A stylist's own My Numbers link, as a card of its own (Kate, 1 Oct 2026).
  // Kate, 1 Oct 2026: a stylist's link sits right under the greeting as well, so it is
  // the first thing she sees, not a card she has to find.
  if (KB.myLink) { var ml = document.getElementById('kbMyLink'); ml.href = KB.myLink; ml.hidden = false; }
  // Kate, 2 Oct 2026: "& payslip", since the payslip button is on that page too.
  if (KB.myLink) shown.unshift({ key: 'my-numbers', dept: 'Me', title: 'My numbers & payslip', href: KB.myLink, live: true,
    rule: 'var(--accent-mint)', blurb: 'Your month, your year, your next step up, and your payslip. Only you can see it.' });
  // "View as" a stylist: the same card as a sample, not a link, so nobody's numbers show.
  else if (KB.viewAs && KB.viewAs.level === 1 && KB.viewAs.dept === 'Beauty')
    shown.unshift({ key: 'my-numbers', dept: 'Me', title: 'My numbers & payslip', sample: true, rule: 'var(--accent-mint)',
      blurb: 'Each stylist sees their own here: their month, year, next step up and payslip.' });
  // Kate, 5 Oct 2026: the suggestions box, for every level. Level 3 and up also read
  // what came in on the same page (kb_suggestions() decides that, not this card).
  shown.push({ key: 'suggestions', dept: 'Me', title: 'Suggestions Box', href: '/hub/suggestions', live: true, rule: 'var(--accent-butter)',
    blurb: KB.level >= 3 ? 'Send an idea, and read what the team has sent in.' : 'An idea for our clients, the team or the salon? Send it in, with or without your name.' });

  // Favourites (Kate, 1 Oct 2026): a star on any card, kept per person in kb_favourites.
  var favs = await KB.loadFavs();
  // Starred pages ('p:' + slug): their titles and sections, for cards of their own.
  var pageFavs = [];
  var slugs = Object.keys(favs).filter(function (k) { return k.indexOf('p:') === 0; }).map(function (k) { return k.slice(2); });
  if (slugs.length) {
    var pr = await KB.client.from('kb_pages').select('slug,title,section,group_name').in('slug', slugs);
    pageFavs = (pr.data || []).filter(function (p) { return KB.shows(p.slug); }).map(function (p) {
      var sec = KB.SECTIONS.find(function (s) { return s.key === p.section; }) || {};
      return { key: 'p:' + p.slug, title: p.title, href: '/hub/kb.html?p=' + encodeURIComponent(p.slug), live: true,
        rule: sec.rule || 'var(--accent-mint)', ic: sec.key, blurb: (sec.title || '') + (p.group_name ? ' · ' + p.group_name : '') };
    });
  }

  // Dashboard pages starred from the dashboard's sidebar (nav-stars.js, 2 Oct 2026),
  // 'd:' + the view. Titles from here, so a page renamed there needs its line here.
  var DASH_PAGES = trsPageTitles();   // pages.js
  var dashFavs = Object.keys(favs).filter(function (k) { return k.indexOf('d:') === 0 && DASH_PAGES[k.slice(2)] && trsPageOpen(k.slice(2), KB.level, KB.extra); })
    .map(function (k) { var v = k.slice(2);
      return { key: k, title: DASH_PAGES[v], href: '/?view=' + v, live: true, rule: 'var(--accent-lavender)', blurb: 'Dashboards',
        ic: (trsPage(v) || {}).ic === 'lost-clients' ? 'lost-clients' : 'dashboards' }; });

  // Kate, 30 Oct 2026: the front door's Knowledge Base and Tools doors (/search/) open Team Home on that place only (?door=kb, ?door=tools),
  // not the whole of Team Home. Team Home itself (no ?door) is unchanged.
  var DOORS = {
    kb: { title: 'Knowledge Base', blurb: 'Read and learn: the Tara Rose Way, SOPs, inductions, onboarding, scripts, and the guides and forms we use.',
      lists: [{ title: 'The Tara Rose Way', dept: 'The Tara Rose Way' }, { title: 'Learn', dept: 'Learn' },
        { title: 'Guides and forms', keys: ['price-list', 'client-matching', 'marketing-optout', 'hr-forms', 'magazines'] }] },
    // Kate, 30 Oct 2026 (ALAD-5): the intro asks the question a person arrives with and promises nothing the rows do not do.
    tools: { title: 'Tools', blurb: 'What do you need to do? Pick the job and it opens the right page.',
      // Kate, 30 Oct 2026: "i divide mo tong tools na lang by dept": Marketing, Accounts, Operations; Backend (Staff Roster & Access, Page Access, and from 3 Nov Hide Pages & Under Construction) added the same day. A department with nothing for the person is not shown.
      lists: [{ title: 'Marketing', keys: ['campaign-blasts', 'nov-blasts', 'landing-review', 'staff-campaign', 'content-calendar'] },
        { title: 'Accounts', keys: ['uploads', 'payslips', 'team-roster', 'staff-wa', 'stripe-deposits'] },
        { title: 'Operations', keys: ['log-complaint', 'complaints-pipeline', 'targets-calc', 'targets-how', 'recruitment'] },
        { title: 'Backend', keys: ['access', 'page-access', 'page-status', 'menu-mover'] }] },
    // Kate, 9 Nov 2026: the Dashboard door, in cards like the other two (lists are filled by dashDoor() below, from the dashboard's own menu). The full dashboard is one link away.
    dashboard: { title: 'Dashboard', blurb: 'Pick a report and it opens. Prefer everything on one screen? Open the full dashboard.', lists: [] }
  };
  // Kate, 9 Nov 2026: a Tools row that is in none of the lists above (a page added later) goes under "More", so nothing is left off the door.
  (function () {
    var named = {};
    DOORS.tools.lists.forEach(function (l) { (l.keys || []).forEach(function (k) { named[k] = 1; }); });
    var extra = KB.SECTIONS.filter(function (s) { return s.dept === 'Tools' && !named[s.key]; }).map(function (s) { return s.key; });
    if (extra.length) DOORS.tools.lists.push({ title: 'More', keys: extra });
  })();
  var door = DOORS[new URLSearchParams(location.search).get('door')] || null;
  if (door) {
    document.title = door.title + ' · Team Home';
    document.getElementById('kbIntro').textContent = door.blurb;
    document.getElementById('kbMyLink').hidden = true;
  }
  // Kate, 9 Nov 2026: the List / Grid toggle (KB.view, hub.js). A door's rows start as a list, Team Home's squares as a grid, until she picks.
  KB.view.init(door ? 'list' : 'grid');
  var viewBtn = function () { return KB.view.html(); };
  var isLive = function (s) { return !!(s.live || s.via || counts[s.key]); };
  // Kate, 5 Oct 2026: each department is one panel of rows (icon, title, one line,
  // page count, star), the panels flowing in two columns on a desktop and one on a
  // phone; favourites are pills along the top. Replaces the card grid, which left
  // holes beside one-card departments and ran about 3,400px long on a phone.
  function initials(t) {
    return t.replace(/&/g, ' ').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
  }
  function icon(s) {
    return KB.ICONS[s.ic || s.key] ? KB.icon(s.ic || s.key, s.rule)
      : '<span class="kb-ic" style="--c:' + s.rule + '" aria-hidden="true">' + esc(initials(s.title)) + '</span>';
  }
  function row(s) {
    var n = counts[s.key] || 0, live = isLive(s);
    var text = '<span class="kb-row-tx"><b>' + (live && !s.sample ? '<a class="kb-row-link" href="' + esc(s.href || '/hub/kb.html?s=' + s.key) + '">' + esc(s.title) + '</a>' : esc(s.title)) +
      '</b><span>' + esc(s.blurb) + '</span></span>';
    if (s.sample) return '<div class="kb-row soon">' + icon(s) + text + '<span class="kb-tag">Sample</span></div>';
    if (!live) return '<div class="kb-row soon" aria-disabled="true">' + icon(s) + text + '<span class="kb-tag">Soon</span></div>';
    var k = KB.level >= 2 ? checks[s.key] || 0 : 0;   // Level 1 reads the notes on the pages, without the counts
    return '<div class="kb-row">' + icon(s) + text +
      (k ? '<a class="kb-check" href="' + esc(s.href ? s.href + '?check=1' : '/hub/kb.html?s=' + s.key + '&check=1') + '" title="Pages with something still being confirmed">' + k + ' to check</a>' : '') +
      (n && !s.href ? '<span class="kb-row-n">' + n + (n === 1 ? ' page' : ' pages') + '</span>' : '') +
      KB.starBtn(s.key, s.title) + '<span class="kb-go" aria-hidden="true">›</span></div>';
  }
  function group(title, list) {
    if (!list.length) return '';
    // Live first, then the ones still to come, each in KB.SECTIONS' order.
    list = list.filter(isLive).concat(list.filter(function (s) { return !isLive(s); }));
    return '<section class="kb-dept">' + (title ? '<h2 class="kb-dept-h">' + esc(title) + '</h2>' : '') + list.map(row).join('') + '</section>';
  }
  // Kate, 22 Oct 2026: "yung favorites gawin mo na ring boxes": a favourite is a square like the section squares, same size and same lift on hover,
  // with the section it belongs to underneath its name.
  function pill(s) {
    return '<div class="kb-fvwrap"><a class="kb-gtile kb-fvbox" href="' + esc(s.href || '/hub/kb.html?s=' + s.key) + '"' + (s.blurb ? ' title="' + esc(s.blurb) + '"' : '') + '>' +
      icon(s) + '<span class="kb-gt-tx"><b>' + esc(s.title) + '</b>' + (function (sub) { return sub ? '<span>' + esc(sub) + '</span>' : ''; })(s.dept || (s.key.indexOf('p:') === 0 ? s.blurb : '') || (/^\/\?view=/.test(s.href || '') ? 'Dashboard' : '')) + '</span></a>' + KB.starBtn(s.key, s.title) + '</div>';
  }
  function paintDoor() {
    var html = '<p class="kb-crumbs"><a href="/search/">← Back to the front door</a><span class="kb-crumbs-r">' + (door.title === 'Dashboard' ? '<a href="/?view=dashboard">Open the full dashboard →</a>' : '') + viewBtn() + '</span></p>', any = false;   // Kate, 10 Nov 2026: no stray dot in the middle; the full-dashboard link sits right beside the layout toggle
    door.lists.forEach(function (l) {
      var list = shown.filter(function (s) { return l.keys ? l.keys.indexOf(s.key) >= 0 : s.dept === l.dept; });
      if (l.order) list.sort(function (a, b) {   // named rows first, in that order; any other row after them, as before
        var x = l.order.indexOf(a.key), y = l.order.indexOf(b.key);
        return (x < 0 ? 99 : x) - (y < 0 ? 99 : y);
      });
      if (list.length) { any = true; html += '<div class="kb-depts kb-depts-one kb-door-list">' + group(l.title, list) + '</div>'; }
    });
    // Kate, 30 Oct 2026 (ALAD-5): an empty door says why and where to go, not just "nothing".
    var none = door.title === 'Tools'
      ? 'Nothing here for you yet. Tools are the pages leadership and executives use to log, follow up and approve things. Your own pages are on <a href="/hub/">Team Home</a>' +
        (KB.myLink ? ', including <a href="' + esc(KB.myLink) + '">My numbers &amp; payslip</a>' : '') + ' and the <a href="/hub/suggestions">Suggestions Box</a>.'
      : 'Nothing here for you yet. Your own pages are on <a href="/hub/">Team Home</a>.';
    document.getElementById('kbGrid').innerHTML = any ? html : html + '<p class="kb-msg">' + none + ' <a href="/search/">Back to the front door</a></p>';
  }
  function paint() {
    if (door) { paintDoor(); return; }
    var starred = shown.filter(function (s) { return favs[s.key] && isLive(s) && !s.sample; })
      .concat(pageFavs.filter(function (p) { return favs[p.key]; }))
      .concat(dashFavs.filter(function (p) { return favs[p.key]; }));
    var html = starred.length
      ? '<h2 class="kb-section-title kb-fv-h">Your favourites</h2><div class="kb-gtiles">' + starred.map(pill).join('') + '</div>'
      : '<p class="kb-fav-hint">Tap the star on any section to keep it at the top.</p>';
    // Kate, 30 Oct 2026: "hub still shows almost everything tho?" The Hub is the front door's fourth door now, so it holds only what is yours: your favourites,
    // and one shortcut to each of the other three doors (Dashboard, Knowledge Base, Tools). The full lists live behind those doors, once.
    function countDoor(d) {
      var seen = {};
      d.lists.forEach(function (l) { shown.forEach(function (x) { if (l.keys ? l.keys.indexOf(x.key) >= 0 : x.dept === l.dept) seen[x.key] = 1; }); });
      return Object.keys(seen).length;
    }
    function doorTile(href, title, n, ic, color) {
      return '<a class="kb-gtile" href="' + esc(href) + '">' + KB.icon(ic, color) +
        '<span class="kb-gt-tx"><b>' + esc(title) + '</b><span>' + n + (n === 1 ? ' item' : ' items') + '</span></span></a>';
    }
    var dashN = shown.filter(function (x) { return ['Numbers', 'Clients', 'Targets', 'Campaigns', 'Content', 'People'].indexOf(x.dept) >= 0; }).length;
    var kbN = countDoor(DOORS.kb), toolsN = countDoor(DOORS.tools);
    var tiles = (dashN ? doorTile('/hub/?door=dashboard', 'Dashboard', dashN, 'dashboards', 'var(--accent-lavender)') : '') +
      (kbN ? doorTile('/hub/?door=kb', 'Knowledge Base', kbN, 'full-loop', 'var(--accent-mint)') : '') +
      (toolsN ? doorTile('/hub/?door=tools', 'Tools', toolsN, 'approvals', 'var(--accent-butter)') : '');
    html = '<p class="kb-crumbs"><a href="/search/">← Back to the front door</a>' + viewBtn() + '</p>' + html +
      (tiles ? '<h2 class="kb-section-title" style="margin:20px 0 10px">Where to next</h2><div class="kb-gtiles">' + tiles + '</div>' : '');
    document.getElementById('kbGrid').innerHTML = html;
  }
  var GROUP_IC = { 'The Tara Rose Way': 'full-loop', 'Me': 'my-numbers', 'Learn': 'hair-induction', 'Numbers': 'dashboards', 'Clients': 'lost-clients', 'Targets': 'today',
    'Campaigns': 'campaigns', 'Content': 'marketing', 'People': 'access', 'Tools': 'approvals', 'Admin': 'uploads' };
  var GROUP_COLOR = { 'The Tara Rose Way': 'var(--accent-mint)', 'Me': 'var(--accent-mint)', 'Learn': 'var(--accent-butter)', 'Numbers': 'var(--accent-lavender)', 'Clients': 'var(--accent-lavender)',
    'Targets': 'var(--accent-coral)', 'Campaigns': 'var(--accent-coral)', 'Content': 'var(--accent-coral)', 'People': 'var(--accent-mint)', 'Tools': 'var(--accent-butter)', 'Admin': 'var(--accent-mint)' };
  var openG = null;
  try { var hm = /^#g=(.+)$/.exec(location.hash); if (hm) openG = decodeURIComponent(hm[1]); } catch (e) {}
  // Kate, 9 Nov 2026: "changes in here must appear on here as well". When Kate has saved her own menu (Rearrange Menu), the Tools door follows it: its Tools section is the door,
  // its sub-sections are the door's lists, in her order, and a page she moved into Tools gets a row here (and one she moved out loses it). The menu is read the way Rearrange Menu reads it
  // (the dashboard's own sidebar plus her saved layout), so a page added later appears too. Everyone else, and Kate before she saves anything, keeps the standard lists.
  async function menuDoor() {
    if (!door || door.title !== 'Tools' || KB.realLevel !== 5 || KB.viewAs || !window.trsNav) return;
    try {
      var lr = await KB.client.rpc('nav_layout_get');
      if (lr.error || !lr.data || !lr.data.groups) return;
      var side = new DOMParser().parseFromString(await (await fetch('/', { credentials: 'same-origin' })).text(), 'text/html').querySelector('aside.sidebar');
      if (!side) return;
      var ext = window.trsNav.extract(side), tree = window.trsNav.merge(ext.tree, lr.data);
      var tg = tree.filter(function (g) { return g.n === 'Tools'; })[0];
      if (!tg) return;
      var norm = function (h) {
        h = String(h || '').replace(/^https?:\/\/trk-salon-os\.com/, '');
        var m = /^\/?\?view=([A-Za-z0-9_-]+)/.exec(h);
        return m ? 'v:' + window.trsViewOfSlug(m[1]) : h.replace(/\/$/, '');
      };
      var byHref = {};
      KB.SECTIONS.forEach(function (c) { if (c.href && !byHref[norm(c.href)]) byHref[norm(c.href)] = c; });
      var cardFor = function (k) {
        var u = ext.units[k]; if (!u) return null;
        var h = u.els[0].getAttribute('href') || '', c = byHref[norm(h)];
        if (c) return c;
        var vm = /[?&]view=([A-Za-z0-9_-]+)/.exec(h), pg = vm && trsPage(window.trsViewOfSlug(vm[1]));
        c = { key: 'lay-' + k, dept: 'Tools', title: u.label, href: h, live: true, ic: (pg && pg.ic) || 'dashboards', rule: 'var(--accent-lavender)', blurb: 'Opens the ' + u.label + ' page.' };
        KB.SECTIONS.push(c); shown.push(c);
        return c;
      };
      var lists = [], put = function (title, keys) {
        var cs = keys.map(cardFor).filter(function (c) { return c && shown.indexOf(c) >= 0; });
        if (cs.length) lists.push({ title: title, keys: cs.map(function (c) { return c.key; }) });
      };
      put('More', tg.loose);
      tg.subs.forEach(function (sb) { put(sb.l || sb.n, sb.p); });
      // A row the standard door has that the sidebar has no row for at all (Staff Roster & Access, Page Access) stays where the standard door puts it.
      var onSide = {};
      Object.keys(ext.units).forEach(function (k) { onSide[norm(ext.units[k].els[0].getAttribute('href'))] = 1; });
      DOORS.tools.lists.forEach(function (sl) {
        var keep = shown.filter(function (c) { return (sl.keys || []).indexOf(c.key) >= 0 && c.href && !onSide[norm(c.href)]; }).map(function (c) { return c.key; });
        if (!keep.length) return;
        var tl = lists.filter(function (l) { return l.title === sl.title; })[0];
        if (tl) tl.keys = tl.keys.concat(keep); else lists.push({ title: sl.title, keys: keep });
      });
      lists.forEach(function (l) { l.order = l.keys.slice(); });   // the order inside each list is her menu's order, not the order the rows are written in hub.js
      if (lists.length) { DOORS.tools.lists = lists; }
    } catch (e) { /* the standard lists stay */ }
  }
  // Kate, 9 Nov 2026: the Dashboard door. Its lists are the dashboard's own menu (every group but Tools, which has its own door): each group is a list, each sub-section its own list,
  // in Kate's saved order if she has one, and a row shows only when that person may open the page (trsPageOpen). Everyone can go back to the full dashboard from the top of the page.
  async function dashDoor() {
    if (!door || door.title !== 'Dashboard' || !window.trsNav) return;
    var lists = [], COL = { Numbers: 'var(--accent-lavender)', Campaigns: 'var(--accent-coral)', Content: 'var(--accent-coral)', People: 'var(--accent-mint)' };
    try {
      if (KB.allowed.indexOf('dashboards') < 0) { door.lists = []; return; }
      var side = new DOMParser().parseFromString(await (await fetch('/', { credentials: 'same-origin' })).text(), 'text/html').querySelector('aside.sidebar');
      if (!side) throw new Error('menu');
      var ext = window.trsNav.extract(side), tree = ext.tree;
      if (KB.realLevel === 5 && !KB.viewAs) {
        var lr = await KB.client.rpc('nav_layout_get');
        if (!lr.error && lr.data && lr.data.groups) tree = window.trsNav.merge(ext.tree, lr.data);
      }
      var byView = {};
      KB.SECTIONS.forEach(function (c) { var m = /^\/?\?view=([A-Za-z0-9_-]+)/.exec(c.href || ''); if (m && !byView[window.trsViewOfSlug(m[1])]) byView[window.trsViewOfSlug(m[1])] = c; });
      tree.forEach(function (g) {
        if (g.n === 'Tools') return;
        var mk = function (title, keys, path) {
          var cs = [];
          keys.forEach(function (k) {
            var u = ext.units[k]; if (!u) return;
            var el = u.els[0], h = el.getAttribute('href') || '', vm = /^\/?\?view=([A-Za-z0-9_-]+)/.exec(h), id = vm && window.trsViewOfSlug(vm[1]);
            if (id ? !window.trsPageOpen(id, KB.level, KB.extra) : KB.level < Number(el.getAttribute('data-tool-min') || 1)) return;
            var base = id && byView[id], pg = id && window.trsPage(id);
            var c = { key: 'dash-' + k, dept: 'Dashboard', title: u.label, href: h, live: true, ic: (base && base.ic) || (pg && pg.ic) || 'dashboards',
              rule: COL[g.n] || 'var(--accent-lavender)', blurb: (base && base.blurb) || path };
            KB.SECTIONS.push(c); shown.push(c); cs.push(c.key);
          });
          if (cs.length) lists.push({ title: title, keys: cs, order: cs.slice() });
        };
        mk(g.l || g.n, g.loose, g.l || g.n);
        g.subs.forEach(function (sb) { mk((g.l || g.n) + ' · ' + (sb.l || sb.n), sb.p, (g.l || g.n) + ' · ' + (sb.l || sb.n)); });
      });
    } catch (e) { lists = []; }
    if (!lists.length) lists = ['Numbers', 'Clients', 'Targets', 'Campaigns', 'Content', 'People'].map(function (d) { return { title: d, dept: d }; });
    door.lists = lists;
  }
  await menuDoor();
  await dashDoor();
  paint();

  document.getElementById('kbGrid').addEventListener('click', async function (e) {
    var t = e.target.closest('.kb-gtile');
    if (t) {
      openG = t.dataset.g === openG ? null : t.dataset.g;
      try { history.replaceState(null, '', openG ? '#g=' + encodeURIComponent(openG) : location.pathname + location.search); } catch (er) {}
      paint();
      var pn = document.getElementById('kbOpenG');
      if (pn) pn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
    var b = e.target.closest('.kb-star');
    if (!b) return;
    e.preventDefault();
    KB.toggleFav(b.dataset.k, paint);
  });
});
