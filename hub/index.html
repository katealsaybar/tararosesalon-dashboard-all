<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team Home · Tara Rose Salons</title>
<script>
  // The dashboard's theme setting, before the first paint.
  try { var t = localStorage.getItem('trs-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-96x96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon-96x96.png">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2D2E37" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub/hub.css?v=b39847fc">
<link rel="stylesheet" href="/scrollbars.css?v=a903788b">
</head>
<body class="kb-wait">
<div class="wrap">
  <header class="kb-head" id="kbHead" data-title="Team Home"></header>
  <main>
    <p class="kb-hello" id="kbHello"></p>
    <a class="kb-mylink" id="kbMyLink" hidden>My numbers &amp; payslip <span aria-hidden="true">→</span></a>
    <p class="kb-intro" id="kbIntro">Everything we do, written down in one place. Open a section, or search for a treatment.</p>
    <div id="kbGrid"></div>
  </main>
  <footer class="kb-foot">For the Tara Rose Salons team only. <a href="/privacy/">Privacy</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=3823f956"></script>
<script src="/pages.js?v=22a14d3b"></script>
<script src="/assets/theme-fade.js"></script>
<script src="/hub/hub.js?v=44f54102"></script>
<script src="/visits.js?v=1176426c"></script>
<script>
KB.ready.then(async function () {
  var esc = KB.esc;
  var first = (KB.name || '').split(/[\s(]/)[0];
  document.getElementById('kbHello').textContent = first ? 'Hello, ' + first : 'Hello';
  if (KB.isStaff) document.getElementById('kbIntro').textContent =
    'Your SOPs and your induction, in one place. Open a section, or search for a treatment.';

  // How many pages each section has. A row comes back only for sections this person may read.
  var r = await KB.client.from('kb_pages').select('section,slug,note');
  var counts = {}, checks = {};
  // Kate, 6 Oct 2026: pages with a "being confirmed" note are counted per section and
  // shown on its row as "N to check", so what still needs Tara's or HR's yes is visible
  // from Team Home (Level 2 and up). HR Forms count from kb_files.note the same way.
  var toCheck = function (n) { return !!n && /confirm|approv|review/i.test(n); };
  (r.data || []).forEach(function (x) {
    if (!KB.shows(x.slug)) return;
    counts[x.section] = (counts[x.section] || 0) + 1;
    if (toCheck(x.note)) checks[x.section] = (checks[x.section] || 0) + 1;
  });
  if (KB.allowed.indexOf('hr-forms') >= 0) {
    var hf = await KB.client.from('kb_files').select('code,note').eq('section', 'hr-forms');
    (hf.data || []).forEach(function (x) { if (toCheck(x.note)) checks['hr-forms'] = (checks['hr-forms'] || 0) + 1; });
  }

  // Only what kb_access() opened to this person; the database refuses the rest anyway.
  var shown = KB.SECTIONS.filter(KB.opens);
  // A stylist's own My Numbers link, as a card of its own (Kate, 1 Oct 2026).
  // Kate, 1 Oct 2026: a stylist's link sits right under the greeting as well, so it is
  // the first thing she sees, not a card she has to find.
  if (KB.myLink) { var ml = document.getElementById('kbMyLink'); ml.href = KB.myLink; ml.hidden = false; }
  // Kate, 2 Oct 2026: "& payslip", since the payslip button is on that page too.
  if (KB.myLink) shown.unshift({ key: 'my-numbers', dept: 'Me', title: 'My numbers & payslip', href: KB.myLink, live: true,
    rule: 'var(--accent-mint)', blurb: 'Your month, your year, your next step up, and your payslip. Only you can see it.' });
  // "View as" a stylist: the same card as a sample, not a link, so nobody's numbers show.
  else if (KB.viewAs && KB.viewAs.level === 1 && KB.viewAs.dept === 'Beauty')
    shown.unshift({ key: 'my-numbers', dept: 'Me', title: 'My numbers & payslip', sample: true, rule: 'var(--accent-mint)',
      blurb: 'Each stylist sees their own here: their month, year, next step up and payslip.' });
  // Kate, 5 Oct 2026: the suggestions box, for every level. Level 3 and up also read
  // what came in on the same page (kb_suggestions() decides that, not this card).
  shown.push({ key: 'suggestions', dept: 'Me', title: 'Suggestions Box', href: '/hub/suggestions', live: true, rule: 'var(--accent-butter)',
    blurb: KB.level >= 3 ? 'Send an idea, and read what the team has sent in.' : 'An idea for our clients, the team or the salon? Send it in, with or without your name.' });

  // Favourites (Kate, 1 Oct 2026): a star on any card, kept per person in kb_favourites.
  var favs = await KB.loadFavs();
  // Starred pages ('p:' + slug): their titles and sections, for cards of their own.
  var pageFavs = [];
  var slugs = Object.keys(favs).filter(function (k) { return k.indexOf('p:') === 0; }).map(function (k) { return k.slice(2); });
  if (slugs.length) {
    var pr = await KB.client.from('kb_pages').select('slug,title,section,group_name').in('slug', slugs);
    pageFavs = (pr.data || []).filter(function (p) { return KB.shows(p.slug); }).map(function (p) {
      var sec = KB.SECTIONS.find(function (s) { return s.key === p.section; }) || {};
      return { key: 'p:' + p.slug, title: p.title, href: '/hub/kb.html?p=' + encodeURIComponent(p.slug), live: true,
        rule: sec.rule || 'var(--accent-mint)', ic: sec.key, blurb: (sec.title || '') + (p.group_name ? ' · ' + p.group_name : '') };
    });
  }

  // Dashboard pages starred from the dashboard's sidebar (nav-stars.js, 2 Oct 2026),
  // 'd:' + the view. Titles from here, so a page renamed there needs its line here.
  var DASH_PAGES = trsPageTitles();   // pages.js
  var dashFavs = Object.keys(favs).filter(function (k) { return k.indexOf('d:') === 0 && DASH_PAGES[k.slice(2)] && trsPageOpen(k.slice(2), KB.level, KB.extra); })
    .map(function (k) { var v = k.slice(2);
      return { key: k, title: DASH_PAGES[v], href: '/?view=' + v, live: true, rule: 'var(--accent-lavender)', blurb: 'Dashboards',
        ic: (trsPage(v) || {}).ic === 'lost-clients' ? 'lost-clients' : 'dashboards' }; });

  var isLive = function (s) { return !!(s.live || s.via || counts[s.key]); };
  // Kate, 5 Oct 2026: each department is one panel of rows (icon, title, one line,
  // page count, star), the panels flowing in two columns on a desktop and one on a
  // phone; favourites are pills along the top. Replaces the card grid, which left
  // holes beside one-card departments and ran about 3,400px long on a phone.
  function initials(t) {
    return t.replace(/&/g, ' ').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
  }
  function icon(s) {
    return KB.ICONS[s.ic || s.key] ? KB.icon(s.ic || s.key, s.rule)
      : '<span class="kb-ic" style="--c:' + s.rule + '" aria-hidden="true">' + esc(initials(s.title)) + '</span>';
  }
  function row(s) {
    var n = counts[s.key] || 0, live = isLive(s);
    var text = '<span class="kb-row-tx"><b>' + (live && !s.sample ? '<a class="kb-row-link" href="' + esc(s.href || '/hub/kb.html?s=' + s.key) + '">' + esc(s.title) + '</a>' : esc(s.title)) +
      '</b><span>' + esc(s.blurb) + '</span></span>';
    if (s.sample) return '<div class="kb-row soon">' + icon(s) + text + '<span class="kb-tag">Sample</span></div>';
    if (!live) return '<div class="kb-row soon" aria-disabled="true">' + icon(s) + text + '<span class="kb-tag">Soon</span></div>';
    var k = KB.level >= 2 ? checks[s.key] || 0 : 0;   // Level 1 reads the notes on the pages, without the counts
    return '<div class="kb-row">' + icon(s) + text +
      (k ? '<a class="kb-check" href="' + esc(s.href ? s.href + '?check=1' : '/hub/kb.html?s=' + s.key + '&check=1') + '" title="Pages with something still being confirmed">' + k + ' to check</a>' : '') +
      (n && !s.href ? '<span class="kb-row-n">' + n + (n === 1 ? ' page' : ' pages') + '</span>' : '') +
      KB.starBtn(s.key, s.title) + '<span class="kb-go" aria-hidden="true">›</span></div>';
  }
  function group(title, list) {
    if (!list.length) return '';
    // Live first, then the ones still to come, each in KB.SECTIONS' order.
    list = list.filter(isLive).concat(list.filter(function (s) { return !isLive(s); }));
    return '<section class="kb-dept"><h2 class="kb-dept-h">' + esc(title) + '</h2>' + list.map(row).join('') + '</section>';
  }
  // Kate, 22 Oct 2026: "yung favorites gawin mo na ring boxes": a favourite is a square like the section squares, same size and same lift on hover,
  // with the section it belongs to underneath its name.
  function pill(s) {
    return '<div class="kb-fvwrap"><a class="kb-gtile kb-fvbox" href="' + esc(s.href || '/hub/kb.html?s=' + s.key) + '"' + (s.blurb ? ' title="' + esc(s.blurb) + '"' : '') + '>' +
      icon(s) + '<span class="kb-gt-tx"><b>' + esc(s.title) + '</b>' + (function (sub) { return sub ? '<span>' + esc(sub) + '</span>' : ''; })(s.dept || (s.key.indexOf('p:') === 0 ? s.blurb : '') || (/^\/\?view=/.test(s.href || '') ? 'Dashboard' : '')) + '</span></a>' + KB.starBtn(s.key, s.title) + '</div>';
  }
  function paint() {
    var starred = shown.filter(function (s) { return favs[s.key] && isLive(s) && !s.sample; })
      .concat(pageFavs.filter(function (p) { return favs[p.key]; }))
      .concat(dashFavs.filter(function (p) { return favs[p.key]; }));
    var html = starred.length
      ? '<h2 class="kb-section-title kb-fv-h">Your favourites</h2><div class="kb-gtiles">' + starred.map(pill).join('') + '</div>'
      : '<p class="kb-fav-hint">Tap the star on any section to keep it at the top.</p>';
    // Staff have one department, so no headings beyond theirs; everyone else reads
    // Team Home by department.
    // Kate, 22 Oct 2026: "naka square square lang per main section", so it does not overwhelm: one square for each main section, and a
    // click opens everything inside it (one section open at a time, kept in the address as #g=Learn). A person with only one section
    // sees it open already.
    var present = KB.GROUPS.filter(function (g) { return shown.some(function (s) { return s.dept === g; }); });
    if (openG && present.indexOf(openG) < 0) openG = null;
    if (!openG && present.length === 1) openG = present[0];
    // Kate, 22 Oct 2026: "di mo naman hiniwalay yung informational sa dashboard stuff". What you read and learn from (the Tara Rose Way, Me, Learn)
    // is one block of squares and the dashboard shortcuts and tools (Numbers, Clients, Targets, Campaigns, Content, People, Admin) another, each
    // with a small heading. A person who has only one kind sees no heading.
    var INFO_G = { 'The Tara Rose Way': 1, 'Me': 1, 'Learn': 1 };
    function tile(g) {
      var list = shown.filter(function (s) { return s.dept === g; }), n = list.filter(isLive).length;
      var on = g === openG;
      return '<button type="button" class="kb-gtile' + (on ? ' on' : '') + '" data-g="' + esc(g) + '" aria-expanded="' + on + '">' +
        KB.icon(GROUP_IC[g] || 'dashboards', GROUP_COLOR[g] || 'var(--accent-mint)') +
        '<span class="kb-gt-tx"><b>' + esc(g) + '</b><span>' + n + (n === 1 ? ' item' : ' items') + '</span></span></button>';
    }
    var infoG = present.filter(function (g) { return INFO_G[g]; }), dashG = present.filter(function (g) { return !INFO_G[g]; });
    var heads = infoG.length && dashG.length;
    function block(list, label) {
      // Kate, 22 Oct 2026: the rows of the open square appear right under its own block, not after the last block of squares.
      var opened = openG && list.indexOf(openG) >= 0 ? '<div class="kb-depts kb-depts-one" id="kbOpenG">' + group(openG, shown.filter(function (s) { return s.dept === openG; })) + '</div>' : '';
      return list.length ? (heads ? '<h2 class="kb-section-title" style="margin:20px 0 10px">' + label + '</h2>' : '') + '<div class="kb-gtiles">' + list.map(tile).join('') + '</div>' + opened : '';
    }
    html += block(infoG, 'Read and learn') + block(dashG, 'Dashboards and tools');
    document.getElementById('kbGrid').innerHTML = html;
  }
  var GROUP_IC = { 'The Tara Rose Way': 'full-loop', 'Me': 'my-numbers', 'Learn': 'hair-induction', 'Numbers': 'dashboards', 'Clients': 'lost-clients', 'Targets': 'today',
    'Campaigns': 'campaigns', 'Content': 'marketing', 'People': 'access', 'Admin': 'uploads' };
  var GROUP_COLOR = { 'The Tara Rose Way': 'var(--accent-mint)', 'Me': 'var(--accent-mint)', 'Learn': 'var(--accent-butter)', 'Numbers': 'var(--accent-lavender)', 'Clients': 'var(--accent-lavender)',
    'Targets': 'var(--accent-coral)', 'Campaigns': 'var(--accent-coral)', 'Content': 'var(--accent-coral)', 'People': 'var(--accent-mint)', 'Admin': 'var(--accent-mint)' };
  var openG = null;
  try { var hm = /^#g=(.+)$/.exec(location.hash); if (hm) openG = decodeURIComponent(hm[1]); } catch (e) {}
  paint();

  document.getElementById('kbGrid').addEventListener('click', async function (e) {
    var t = e.target.closest('.kb-gtile');
    if (t) {
      openG = t.dataset.g === openG ? null : t.dataset.g;
      try { history.replaceState(null, '', openG ? '#g=' + encodeURIComponent(openG) : location.pathname + location.search); } catch (er) {}
      paint();
      var pn = document.getElementById('kbOpenG');
      if (pn) pn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
    var b = e.target.closest('.kb-star');
    if (!b) return;
    e.preventDefault();
    KB.toggleFav(b.dataset.k, paint);
  });
});
</script>
</body>
</html>
