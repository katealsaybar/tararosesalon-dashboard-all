<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page Access · Team Home</title>
<script>
  try { var t = localStorage.getItem('trs-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-96x96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon-96x96.png">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2D2E37" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/scrollbars.css?v=a903788b">
<style>
/* Kate, 28 Oct 2026: Page Access, Level 5 only. One row per dashboard page, one tick box per level; the boxes start ticked from pages.js and a
   change is saved the moment it is clicked (public.page_access). */
.pa-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 8px}
.pa-bar .kb-search{flex:1 1 260px;max-width:420px}
.pa-btn{font:inherit;font-size:13px;font-weight:600;padding:8px 16px;min-height:40px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.pa-btn:hover{border-color:var(--text)}
.pa-btn:disabled{opacity:.5;cursor:default}
.pa-status{min-height:22px;font-size:13px;color:var(--muted);margin:2px 0 10px}
.pa-status.err{color:#B3402A;font-weight:600}
.pa-wrap{border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.pa-col{max-width:880px;margin:0 auto}
.pa-short,.pa-legend{display:none}
.pa-tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:560px}
.pa-tbl th,.pa-tbl td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:center;font-size:14px}
.pa-tbl th:first-child,.pa-tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.pa-tbl thead th{position:sticky;top:calc(var(--pa-top,100px) - 1px);background:var(--surface);z-index:2;font-size:12.5px;font-weight:700;vertical-align:bottom;line-height:1.25}
.pa-tbl thead th:first-child{z-index:3;border-top-left-radius:13px}
.pa-tbl thead th:last-child{border-top-right-radius:13px}
.pa-tbl th small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.pa-tbl tr.pa-grp td{background:var(--bg);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding-top:14px;cursor:pointer;user-select:none}
.pa-tbl tr.pa-grp:hover td{color:var(--text)}
.pa-tbl tr.pa-grp:focus-visible td{outline:2px solid var(--text);outline-offset:-2px}
.pa-chev{display:inline-block;width:14px;margin-right:8px;transition:transform .15s}
.pa-grp.pa-shut .pa-chev{transform:rotate(-90deg)}
.pa-grp .pa-n{font-weight:500;letter-spacing:0;text-transform:none;margin-left:8px}
.pa-tbl tr:last-child td{border-bottom:0}
.pa-name{font-weight:600}
.pa-note{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.pa-tbl td.pa-c,.pa-tbl thead th:not(:first-child){width:112px}
.pa-tbl tbody tr:not(.pa-grp):hover td{background:color-mix(in srgb,var(--text) 7%,var(--surface))}
.pa-tbl tbody tr:not(.pa-grp):hover td.pa-chg{background:rgba(214,158,46,.24)}
.pa-tbl input[type=checkbox]{width:22px;height:22px;accent-color:var(--text);cursor:pointer;vertical-align:middle}
.pa-tbl td.pa-chg{background:rgba(214,158,46,.14)}
.pa-tbl td.pa-chg::after{content:'changed';display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.pa-five{color:var(--muted);font-size:12.5px}
.pa-hint{font-size:13px;color:var(--muted);margin:10px 0 0;max-width:760px}
/* The heading row sticks under the site header while the page scrolls (--pa-top is that header's height, set below).
   Phones: no sideways scroll; the Level columns shrink to L1 to L4 (spelled out in the line above the table) and the page name wraps. */
@media(max-width:700px){
  .pa-tbl{min-width:0}
  .pa-tbl th,.pa-tbl td{padding:10px 2px}
  .pa-tbl th:first-child,.pa-tbl td:first-child{padding-left:12px;padding-right:6px}
  .pa-tbl td:first-child{position:static}
  .pa-tbl td.pa-c,.pa-tbl thead th:not(:first-child){width:54px}
  .pa-tbl th small{display:none}
  .pa-full{display:none}.pa-short{display:inline}
  .pa-tbl input[type=checkbox]{width:26px;height:26px}
  .pa-tbl tr.pa-grp td{padding-left:12px}
  .pa-five{font-size:10.5px;line-height:1.2}
  .pa-bar .kb-search{flex:1 1 100%;max-width:none}
  .pa-btn{flex:1 1 auto;padding:8px 12px}
  .pa-legend{display:block;font-size:12.5px;color:var(--muted);margin:0 0 10px}
}
</style>
</head>
<body class="kb-wait">
<header class="kb-head" id="kbHead" data-title="Team Home"></header>
<main id="kbMain"><p class="kb-msg">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=3823f956"></script>
<script src="/assets/theme-fade.js"></script>
<script src="/pages.js?v=5a4c6aff"></script>
<script src="/hub/hub.js?v=210e4d45"></script>
<script src="/visits.js?v=1176426c"></script>
<script>
(function () {
  var main = document.getElementById('kbMain');
  var LV = [1, 2, 3, 4];
  var NAMES = { 1: 'Team', 2: 'Leadership', 3: 'Executives & Marketing', 4: 'Accounts & Admin' };
  var q = '', statusTimer = null, shut = {}, DOCS = [];
  try { shut = JSON.parse(localStorage.getItem('trs-pa-shut') || '{}') || {}; } catch (e) { shut = {}; }
  function keepShut() { try { localStorage.setItem('trs-pa-shut', JSON.stringify(shut)); } catch (e) {} }
  function setTop() { var h = document.getElementById('kbHead'); document.documentElement.style.setProperty('--pa-top', (h ? Math.round(h.getBoundingClientRect().height) : 100) + 'px'); }
  window.addEventListener('resize', setTop);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function say(t, err) {
    var el = document.getElementById('paStatus'); if (!el) return;
    el.textContent = t; el.className = 'pa-status' + (err ? ' err' : '');
    clearTimeout(statusTimer);
    if (!err) statusTimer = setTimeout(function () { el.textContent = ''; }, 4000);
  }
  // A saved tick, if there is one, else the built-in default (the box that is checked from the start).
  function saved(id, l) { var o = window.TRS_ACCESS && window.TRS_ACCESS[id]; return (o && o[l] !== undefined && o[l] !== null) ? !!o[l] : null; }
  // Documents are the Team Home sections (SOPs, induction, front desk, HR forms ...): id 'kb:<section key>', Levels 2 to 4 only (Level 1 staff
  // are opened team by team, not from here). Their starting ticks come from kb_sections (kb_section_defaults), a saved tick wins over them.
  function dflt(id, l) {
    if (String(id).indexOf('kb:') !== 0) return trsPageDefault(id, l);
    var d = DOCS.filter(function (x) { return 'kb:' + x.key === id; })[0];
    return !!d && d.min <= l && (d.skip || []).indexOf(l) < 0;
  }
  function eff(id, l) { var s = saved(id, l); return s === null ? dflt(id, l) : s; }
  function pages() {
    var docs = DOCS.map(function (d) {
      var sec = (window.KB && KB.SECTIONS || []).filter(function (x) { return x.key === d.key; })[0];
      return { id: 'kb:' + d.key, label: sec ? sec.title : d.key, group: 'Documents: ' + d.dept, doc: true };
    });
    return TRS_PAGES.filter(function (p) { return !p.retired; }).concat(docs);
  }
  function lvOf(p) { return p.doc ? [2, 3, 4] : LV; }
  function nameOf(id) { var p = pages().filter(function (x) { return x.id === id; })[0]; return p ? p.label : trsPageLabel(id); }
  function table() {
    var list = pages(), groups = [], by = {};
    var needle = q.trim().toLowerCase();
    list.forEach(function (p) {
      if (needle && (p.label + ' ' + (p.group || '') + ' ' + (p.sub || '')).toLowerCase().indexOf(needle) < 0) return;
      var g = p.group || 'Other';
      if (!by[g]) { by[g] = []; groups.push(g); }
      by[g].push(p);
    });
    if (!groups.length) return '<tr><td colspan="' + (LV.length + 1) + '" style="text-align:left">Nothing matches that search.</td></tr>';
    var out = [];
    groups.forEach(function (g) {
      var closed = !!shut[g] && !needle;   // a search always shows what it found
      out.push('<tr class="pa-grp' + (closed ? ' pa-shut' : '') + '" data-g="' + esc(g) + '" tabindex="0" role="button" aria-expanded="' + (closed ? 'false' : 'true') + '"><td colspan="' + (LV.length + 1) + '">' +
        '<span class="pa-chev" aria-hidden="true">&#9662;</span>' + esc(g) + '<span class="pa-n">' + by[g].length + ' page' + (by[g].length > 1 ? 's' : '') + '</span></td></tr>');
      if (closed) return;
      by[g].forEach(function (p) {
        out.push('<tr data-id="' + esc(p.id) + '"><td><span class="pa-name">' + esc(p.label) + '</span>' +
          (p.sub && g === 'Numbers' ? '<span class="pa-note">' + esc(p.sub) + '</span>' : '') +
          (p.inside ? '<span class="pa-note">Inside ' + esc(trsPageLabel(p.inside)) + '</span>' : '') + '</td>' +
          LV.map(function (l) {
            if (p.doc && l === 1) return '<td class="pa-c"><span class="pa-five">by team</span></td>';
            var chg = saved(p.id, l) !== null && saved(p.id, l) !== dflt(p.id, l);
            return '<td class="pa-c' + (chg ? ' pa-chg' : '') + '"><input type="checkbox" data-l="' + l + '"' + (eff(p.id, l) ? ' checked' : '') +
              ' aria-label="' + esc(p.label) + ', Level ' + l + ' ' + esc(NAMES[l]) + '"></td>';
          }).join('') + '</tr>');
      });
    });
    return out.join('');
  }
  function allGroups() { var g = [], seen = {}; pages().forEach(function (p) { var k = p.group || 'Other'; if (!seen[k]) { seen[k] = 1; g.push(k); } }); return g; }
  function paintFold() {
    var b = document.getElementById('paFold'); if (!b) return;
    var any = allGroups().some(function (g) { return !shut[g]; });
    b.textContent = any ? 'Collapse all sections' : 'Expand all sections';
  }
  function changedCount() {
    var n = 0;
    pages().forEach(function (p) { lvOf(p).forEach(function (l) { var s = saved(p.id, l); if (s !== null && s !== dflt(p.id, l)) n++; }); });
    return n;
  }
  function paintCount() {
    var b = document.getElementById('paReset'); if (!b) return;
    var n = changedCount();
    b.disabled = !n; b.textContent = n ? 'Reset ' + n + ' change' + (n > 1 ? 's' : '') + ' to the starting ticks' : 'Nothing changed from the starting ticks';
  }
  function draw() {
    document.getElementById('paBody').innerHTML = table();
    paintCount();
    paintFold();
  }
  async function save(id, l, val, box) {
    var def = dflt(id, l);
    var send = (val === def) ? null : val;   // back on the starting tick: remove the saved change instead of storing a copy of the default
    box.disabled = true;
    var r = await KB.client.rpc('page_access_set', { p_page: id, p_level: l, p_allowed: send });
    box.disabled = false;
    if (r.error) { box.checked = !val; say('Not saved: ' + (r.error.message || 'try again') + '.', true); return; }
    var o = window.TRS_ACCESS[id] || (window.TRS_ACCESS[id] = {});
    if (send === null) delete o[l]; else o[l] = send;
    var td = box.closest('td'); if (td) td.classList.toggle('pa-chg', send !== null);
    say('Saved: ' + nameOf(id) + ', Level ' + l + ' ' + NAMES[l] + ', ' + (val ? 'can open it' : 'cannot open it') + '.');
    paintCount();
  }
  async function resetAll() {
    var jobs = [];
    pages().forEach(function (p) { lvOf(p).forEach(function (l) { var s = saved(p.id, l); if (s !== null) jobs.push([p.id, l]); }); });
    if (!jobs.length) return;
    if (!confirm('Put every box back to how it started? ' + jobs.length + ' saved change' + (jobs.length > 1 ? 's' : '') + ' will be removed.')) return;
    var b = document.getElementById('paReset'); b.disabled = true;
    for (var i = 0; i < jobs.length; i++) {
      var r = await KB.client.rpc('page_access_set', { p_page: jobs[i][0], p_level: jobs[i][1], p_allowed: null });
      if (r.error) { say('Stopped at ' + nameOf(jobs[i][0]) + ': ' + (r.error.message || 'try again') + '.', true); draw(); return; }
      delete window.TRS_ACCESS[jobs[i][0]][jobs[i][1]];
    }
    say('Every box is back to how it started.');
    draw();
  }
  KB.ready.then(async function () {
    // Level 5 only, and not while "View as" is on: previewing another level must not let that level change its own pages.
    if (KB.realLevel !== 5 || KB.viewAs) {
      main.innerHTML = '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p><p class="kb-msg">This page is for Kate only' + (KB.viewAs ? ' (switch View as back to Level 5)' : '') + '.</p>';
      return;
    }
    try { var dr = await KB.client.rpc('kb_section_defaults'); DOCS = (!dr.error && Array.isArray(dr.data)) ? dr.data : []; } catch (e) { DOCS = []; }
    main.innerHTML =
      '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p>' +
      KB.titleIcon('access', 'Page Access') +
      '<p class="kb-meta">Tick the reports each level can open. The ticks you see now are where each page starts; a change is saved as soon as you click it and takes effect the next time that person opens or refreshes the dashboard.</p>' +
      '<div class="pa-col"><div class="pa-bar"><div class="kb-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
        '<input type="search" id="paFilter" placeholder="Search pages" autocomplete="off" aria-label="Search pages"></div>' +
        '<button type="button" class="pa-btn" id="paFold"></button><button type="button" class="pa-btn" id="paReset"></button></div>' +
      '<div class="pa-status" id="paStatus" role="status" aria-live="polite"></div>' +
      '<p class="pa-legend"><b>L1</b> Team · <b>L2</b> Leadership · <b>L3</b> Executives &amp; Marketing · <b>L4</b> Accounts &amp; Admin. You (Level 5) always open everything.</p>' +
      '<div class="pa-wrap"><table class="pa-tbl"><thead><tr><th>Page <small>Level 5 (you) always opens every page</small></th>' +
        LV.map(function (l) { return '<th><span class="pa-full">Level ' + l + '</span><span class="pa-short">L' + l + '</span><small>' + esc(NAMES[l]) + '</small></th>'; }).join('') + '</tr></thead><tbody id="paBody"></tbody></table></div>' +
      '<p class="pa-hint">This decides what each level sees: the menu, Team Home, search and direct links. The numbers themselves are still protected by the database. A page ticked for a level whose data asks for Level 3 will open and then say “Level 3 and above”, so tell Claude to open that data as well. Anyone given a page of their own on the Staff Roster keeps it whatever is ticked here. Documents (the sections under “Documents”) are guarded by the database itself, so a tick there really opens or closes the text for that level; Level 1 staff are opened team by team, and the dashboard door, Wellness Voucher approvals and the Upload Portal are not on this page.</p>' + '</div>';
    setTop();
    draw();
    document.getElementById('paFilter').addEventListener('input', function (e) { q = e.target.value; draw(); });
    document.getElementById('paReset').addEventListener('click', resetAll);
    document.getElementById('paFold').addEventListener('click', function () {
      var any = allGroups().some(function (g) { return !shut[g]; });
      allGroups().forEach(function (g) { if (any) shut[g] = 1; else delete shut[g]; });
      keepShut(); draw();
    });
    function flip(tr) {
      var g = tr.getAttribute('data-g'); if (shut[g]) delete shut[g]; else shut[g] = 1;
      keepShut(); draw();
      var back = document.querySelector('tr.pa-grp[data-g="' + g.replace(/"/g, '\\"') + '"]'); if (back) back.focus();
    }
    document.getElementById('paBody').addEventListener('click', function (e) { var tr = e.target.closest && e.target.closest('tr.pa-grp'); if (tr) flip(tr); });
    document.getElementById('paBody').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var tr = e.target.closest && e.target.closest('tr.pa-grp'); if (tr) { e.preventDefault(); flip(tr); }
    });
    document.getElementById('paBody').addEventListener('change', function (e) {
      var box = e.target; if (!box || box.type !== 'checkbox') return;
      var tr = box.closest('tr'); if (!tr) return;
      save(tr.getAttribute('data-id'), +box.getAttribute('data-l'), box.checked, box);
    });
  });
})();
</script>
</body>
</html>
