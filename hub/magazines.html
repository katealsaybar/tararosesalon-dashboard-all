<style>
  .mg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin:0 0 24px}
  .mg-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .mg-cover{display:block;width:100%;aspect-ratio:8.5/11;padding:0;border:0;background:var(--surface2);cursor:pointer;position:relative}
  .mg-cover img{display:block;width:100%;height:100%;object-fit:cover}
  .mg-cover:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
  .mg-body{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1}
  .mg-body h3{margin:0;font-family:'Playfair Display',serif;font-weight:500;font-size:18px;line-height:1.25}
  .mg-sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);font-weight:600}
  .mg-blurb{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0 0 8px;flex:1}
  .mg-meta{font-size:12.5px;color:var(--muted2)}
  .mg-acts{display:flex;gap:8px;flex-wrap:wrap}
  .mg-tools{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
  .mg-switch{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px;gap:3px;background:var(--surface);margin:0}
  .mg-switch button{font:inherit;font-size:13px;border:0;border-radius:999px;padding:5px 14px;min-height:32px;background:transparent;color:var(--muted);cursor:pointer}
  .mg-switch button[aria-pressed="true"]{background:var(--text);color:var(--bg);font-weight:600}
  @media (max-width:760px){.mg-switch button{min-height:36px}}
</style>

<body class="kb-wait">
<!-- ROSES Magazine (Kate, 14 Oct 2026): the 2021 to 2023 issues. The PDFs and covers live in the private
     Storage bucket kb-magazines (migrations/kb_magazines.sql), readable only by those who may open
     the magazines section (Level 2 and up); kb_files carries the paths. Nothing of them is in this
     repo, which is public. Covers use short-lived signed links; an issue is downloaded signed in and opened as a
     blob of this page, so the address bar stays on this domain. -->
<div class="wrap">
  <header class="kb-head" id="kbHead" data-title="Team Home"></header>
  <main id="kbMain"><p class="kb-msg">Loading…</p></main>
  <footer class="kb-foot">For the Tara Rose Salons team only. <a href="/privacy/">Privacy</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=3823f956"></script>
<script src="/assets/theme-fade.js"></script>
<script src="/hub/hub.js?v=400902d9"></script>
<script src="/visits.js?v=1176426c"></script>
<script>
(function () {
  var main = document.getElementById('kbMain'), esc = KB.esc;
  if (/\.html$/.test(location.pathname)) history.replaceState(null, '', location.pathname.replace(/\.html$/, '') + location.search + location.hash);
  function notFound() {
    main.innerHTML = '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p><p class="kb-msg">This page isn’t open to your account. <a href="/hub/">Back to Team Home</a></p>';
  }
  function size(b) { return b ? (b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB') : ''; }
  var BUCKET = 'kb-magazines', LINK_SECS = 3600, issues = [], blobs = {};

  // Kate, 14 Oct 2026: "naka supabase pa rin eh". The issue is fetched here, signed in, and opened as a
  // blob of this page, so the address bar says trk-salon-os.com (like HR Forms) and not supabase.co.
  async function blobUrl(f) {
    if (blobs[f.code]) return blobs[f.code];
    var r = await KB.client.storage.from(BUCKET).download(f.path);
    if (r.error || !r.data) throw new Error('not found');
    return (blobs[f.code] = URL.createObjectURL(new Blob([r.data], { type: 'application/pdf' })));
  }
  async function act(btn) {
    var f = issues.filter(function (x) { return x.code === btn.dataset.code; })[0];
    if (!f) return;
    var open = btn.dataset.act === 'open';
    var tab = open ? window.open('', '_blank') : null;   // opened on the click, so it isn't blocked
    // A cover button holds the cover picture, so it only dims; the text buttons say Loading….
    var cover = btn.classList.contains('mg-cover'), was = btn.textContent;
    btn.disabled = true;
    if (cover) btn.style.opacity = '.55'; else btn.textContent = 'Loading…';
    try {
      var u = await blobUrl(f);
      if (tab) tab.location.href = u;
      else {
        var a = document.createElement('a');
        a.href = u; a.download = f.filename;
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (e) {
      if (tab) tab.close();
      alert('That issue couldn’t be loaded. Try again, or tell Kate.');
    }
    btn.disabled = false;
    if (cover) btn.style.opacity = ''; else btn.textContent = was;
  }

  KB.ready.then(async function () {
    if (KB.allowed.indexOf('magazines') < 0) { notFound(); return; }   // also "View as" below Level 2
    var r = await KB.client.from('kb_files').select('code,grp,title,subtitle,blurb,filename,pages,bytes,sort,path,cover')
      .eq('section', 'magazines').order('sort');
    if (r.error || !r.data || !r.data.length) { notFound(); return; }
    issues = r.data;
    var groups = [], by = {};
    issues.forEach(function (f) { if (!by[f.grp]) { by[f.grp] = []; groups.push(f.grp); } by[f.grp].push(f); });
    var covers = {};   // cover path -> signed link, so a re-sort does not ask again
    // Kate, 16 Oct 2026: By year (a section per year) or By issue (one list), newest or oldest first.
    // The choice is remembered on this device.
    var view = 'year', order = 'new';
    try {
      view = localStorage.getItem('mg-view') === 'issue' ? 'issue' : 'year';
      order = localStorage.getItem('mg-order') === 'old' ? 'old' : 'new';
    } catch (e) {}
    function card(f) {
      return '<article class="mg-card">' +
        '<button type="button" class="mg-cover" data-act="open" data-code="' + esc(f.code) + '" aria-label="Read ' + esc(f.title) + '"><img alt="" data-cover="' + esc(f.cover || '') + '"></button>' +
        '<div class="mg-body"><h3>' + esc(f.title) + '</h3>' +
        (f.subtitle ? '<span class="mg-sub">' + esc(f.subtitle) + '</span>' : '') +
        '<p class="mg-blurb">' + esc(f.blurb || '') + '</p>' +
        '<span class="mg-meta">' + (f.pages || '') + ' pages · ' + size(f.bytes) + '</span>' +
        '<div class="mg-acts"><button type="button" class="fm-btn" data-act="open" data-code="' + esc(f.code) + '">Read</button>' +
        '<button type="button" class="fm-btn fm-dl" data-act="dl" data-code="' + esc(f.code) + '">Download</button></div></div></article>';
    }
    function section(h, list) {
      return '<section class="kb-dept"><h2 class="kb-dept-h">' + esc(h) + '</h2><div style="padding:6px 20px 4px"><div class="mg-grid">' +
        list.map(card).join('') + '</div></div></section>';
    }
    function sw(label, key, cur, opts) {
      return '<div class="mg-switch" role="group" aria-label="' + label + '">' + opts.map(function (o) {
        return '<button type="button" data-set="' + key + '" data-val="' + o[0] + '" aria-pressed="' + (cur === o[0]) + '">' + o[1] + '</button>';
      }).join('') + '</div>';
    }
    function paintCovers() {
      main.querySelectorAll('img[data-cover]').forEach(function (im) {
        var u = covers[im.dataset.cover];
        if (u) im.src = u;
      });
    }
    function render() {
      var flip = order === 'old';
      // issues arrive newest first (sort), so oldest first is the reverse
      var gs = flip ? groups.slice().reverse() : groups;
      var list = flip ? issues.slice().reverse() : issues;
      document.getElementById('mgTools').innerHTML =
        sw('Group the issues', 'view', view, [['year', 'By year'], ['issue', 'By issue']]) +
        sw('Order', 'order', order, [['new', 'Newest first'], ['old', 'Oldest first']]);
      document.getElementById('mgList').innerHTML = view === 'year'
        ? gs.map(function (g) { return section(g, flip ? by[g].slice().reverse() : by[g]); }).join('')
        : section('All issues', list);
      paintCovers();
    }
    main.innerHTML =
      '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p>' +
      KB.titleIcon('magazines', 'ROSES Magazine') +
      '<p class="kb-meta">' + issues.length + ' issues, ' + groups[groups.length - 1] + ' to ' + groups[0] + '. Read one in your browser or download it. Prices and offers in them are from when each issue came out.</p>' +
      '<div class="mg-tools" id="mgTools"></div><div id="mgList"></div>';
    render();
    main.addEventListener('click', function (e) {
      var t = e.target.closest('[data-set]');
      if (t) {
        if (t.dataset.set === 'view') view = t.dataset.val; else order = t.dataset.val;
        try { localStorage.setItem('mg-' + t.dataset.set, t.dataset.val); } catch (x) {}
        render();
        return;
      }
      var b = e.target.closest('[data-act]');
      if (b) act(b);
    });
    // Covers: one batch of signed links; a failed one just leaves the grey card.
    var paths = issues.map(function (f) { return f.cover; }).filter(Boolean);
    var s = await KB.client.storage.from(BUCKET).createSignedUrls(paths, LINK_SECS);
    if (s.data) s.data.forEach(function (x) { if (x.signedUrl) covers[x.path] = x.signedUrl; });
    paintCovers();
  });
})();
</script>

</body>
