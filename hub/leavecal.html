<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leave &amp; Holiday Calendar · Team Home</title>
<script>
  try { var t = localStorage.getItem('trs-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-96x96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon-96x96.png">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2D2E37" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub/hub.css?v=24715f8d">
<link rel="stylesheet" href="/css/scrollbars.css?v=a903788b">
<style>
/* Leave & Holiday Calendar (Kate, 16 Nov 2026). Tokens hub.css does not have; the rest (bg, surface, border, text, muted, accent) come from hub.css. */
:root{--hl:#FDE9A8;--hol:#1A1A1A;--hol-fg:#FBF7F0;--ok:#0F8A72;--wk:transparent;
  --c-SAA:#548235;--c-KCA:#2F5597;--c-MC:#ED7D31;--c-AQ:#7030A0;--c-X:#8A847C;--amber:#D9A400;--red:#C0392B;--green:#2E8B57;--blk:#9A948C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:rgba(242,193,78,.22);--hol:#99F6E4;--hol-fg:#2D2E37;--ok:#99F6E4}}
:root[data-theme="dark"]{--hl:rgba(242,193,78,.22);--hol:#99F6E4;--hol-fg:#2D2E37;--ok:#99F6E4}
.wrap{max-width:1400px}
body{overflow-x:hidden}
/* the filter bar sits under the Team Home header and stays there; --kbh is that header's height, --tb the bottom of the filter bar */
.topbar{position:sticky;top:var(--kbh,76px);z-index:19;background:var(--bg);margin:0 -2px;padding:0 2px}
.lc-rule{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 0;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2)}
.lc-rule b{font-weight:700;color:var(--text)}
.lc-rule .rl{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){
  .lc-rule{padding:6px 0;min-height:44px}
  .lc-rule .rl{display:none}
  .mast-acts{flex-wrap:nowrap;min-width:0;width:100%;justify-content:flex-start}
  .filters-wrap,#filtersBtn{display:none}
  .tglr{min-height:44px;padding:0 14px;font-size:12.5px;letter-spacing:.02em;text-transform:none;color:var(--text)}
  #fSheetBtn{display:inline-flex;align-items:center;gap:7px;max-width:100%;min-width:0}
  #fSheetSum{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar{border-bottom:1px solid var(--border)}
}
.side{top:calc(var(--tb,160px) + 10px)}
.filters{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 32px;padding:8px 0}
.f-row{display:flex;align-items:baseline;gap:12px;min-width:0}
.f-lbl{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);flex-shrink:0}
.chipset{display:flex;flex-wrap:wrap;align-items:baseline}
.gchip{border:0;background:none;padding:6px 0;font-size:14px;color:var(--muted2);cursor:pointer;white-space:nowrap;border-bottom:1px solid transparent;line-height:1.3}
.gchip:hover{color:var(--text)}
.gchip[aria-pressed="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.sep{color:var(--muted2);opacity:.4;font-size:14px;padding:0 8px;user-select:none}
.gseg{display:inline-flex;align-self:center;border:1px solid var(--border);border-radius:999px;padding:2px;gap:2px}
.gseg .gchip{padding:3px 12px;border:0;border-radius:999px;font-size:13px}
.gseg .gchip[aria-pressed="true"]{background:var(--text);color:var(--bg)}

.note{margin:14px 0;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px;line-height:1.5}
.note b{font-weight:700}
.why{margin:0 0 16px;padding:12px 16px;border:1px solid var(--border);border-left:3px solid var(--text);border-radius:10px;background:var(--surface);font-size:13.5px}
.why .wk{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-bottom:4px}
.why p{margin:3px 0;color:var(--muted)}
.why p b{color:var(--text)}
.why .try{margin-top:8px;padding-top:8px;border-top:1px solid var(--border2)}
h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);margin:26px 0 10px;font-weight:700}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;min-width:0}
.tile .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);font-weight:700}
.tile .v{font-size:26px;font-weight:600;line-height:1.2;margin-top:4px}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px}

.layers{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.lay{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);cursor:pointer}
.lay[aria-pressed="true"]{color:var(--text);border-color:var(--text)}
.lay[aria-pressed="false"] .sw{opacity:.35}
.lay small{color:var(--muted2);font-size:12px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;flex-shrink:0}
.sw.hol{background:var(--hol)}
.sw.app{background:var(--green)}
.sw.req{border:2px solid var(--amber);background:transparent}
.sw.inf{border:2px dotted var(--muted2);background:transparent}
.sw.plan{border:2px solid var(--muted2);background:var(--surface2)}
.chip.plan{background:transparent;border:1px solid var(--border);border-left-width:3px}
.badge.plan{border-style:solid}
.badge.app{border-color:var(--green);color:var(--green);font-weight:600}
.pill{display:inline-block;min-width:22px;padding:1px 6px;border-radius:999px;font-size:12px;font-weight:600;text-align:center}
.pill.sl{background:var(--hl);color:var(--text)}
.pill.ab{background:var(--red);color:#fff}
.sickT td.m{text-align:center;padding:6px 2px;min-width:30px}
.sickT th.m{text-align:center;padding:6px 2px}
/* sticky header: the page scrolls, not the table, so this one is not a horizontal scroller on wide screens */
.sickT{border-collapse:separate;border-spacing:0}
.sickT th{position:sticky;top:var(--tb,160px);z-index:6;background:var(--surface);border-bottom:1px solid var(--text)}
.sickT td{border-bottom:1px solid var(--border2)}
.tw.fix{overflow:visible}
.stf{display:flex;align-items:center;gap:8px;white-space:nowrap}
.stf-ph{height:30px;width:auto;max-width:30px;object-fit:contain;display:block}
.stf-ini{height:30px;width:26px;border-radius:6px;background:var(--surface2);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.sickT td.pos{color:var(--muted);font-size:12.5px;white-space:nowrap}
.sickT th:first-child,.sickT td:first-child,.sickT th:nth-child(2),.sickT td:nth-child(2),.sickT th:nth-child(3),.sickT td:nth-child(3){width:1%;white-space:nowrap}
.sickT td.sch{color:var(--muted);font-size:12.5px;white-space:nowrap;padding-right:14px}
.sickT td:first-child,.sickT th:first-child{padding-right:18px}
.sickT td:nth-child(2),.sickT th:nth-child(2){padding-right:14px}
@media (max-width:760px){.tw.fix{overflow-x:auto}}

.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.side{position:sticky;top:170px}
.side h3{margin:0 0 2px;font-size:16px}
.side .d{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.item{padding:9px 0;border-top:1px solid var(--border2);font-size:13.5px}
.item:first-of-type{border-top:0}
.item b{font-weight:600}
.item .m{color:var(--muted);font-size:12.5px}
.badge{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);margin-left:6px;white-space:nowrap}
.badge.req{border-color:var(--amber);color:var(--warn)}
.badge.inf{border-style:dotted}
.badge.hol{background:var(--hol);color:var(--hol-fg);border-color:var(--hol)}
.badge.off{border-color:var(--red);color:var(--red);font-weight:600}
.badge.on{border-color:var(--green);color:var(--green);font-weight:600}
.badge.tbc{border-style:dashed}
td .badge{margin-left:0}
.wkmark{font-size:20px;font-weight:700;text-align:center;width:90px}
.wkmark.ok{color:var(--green)}
.wkmark.x{color:var(--red)}
.wkmark.q{color:var(--muted2);font-weight:400}
.wkmark.pt{color:var(--amber)}
.badge.part{border-color:var(--amber);color:var(--warn);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--c-X)}
.empty{color:var(--muted2);font-size:13px;padding:6px 0}

/* year view */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px 16px}
.mo{min-width:0}
.mo h4{margin:0 0 4px;font-size:13px;font-weight:600;cursor:pointer}
.mo h4:hover{text-decoration:underline}
.g7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{font-size:9.5px;color:var(--muted2);text-align:center;letter-spacing:.04em}
.dc{position:relative;height:28px;border-radius:6px;font-size:11.5px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3px;cursor:pointer;border:1px solid transparent;background:transparent;min-width:0;overflow:hidden}
.dc.wk{background:var(--wk)}
.dc:hover{border-color:var(--muted2)}
.dc.today{border-color:var(--text);font-weight:700}
.dc.sel{outline:2px solid var(--text);outline-offset:-1px}
.dc.hol{background:var(--hol);color:var(--hol-fg);font-weight:700}
.dc.out{visibility:hidden}
.dots{position:absolute;left:0;right:0;bottom:2px;display:flex;gap:2px;justify-content:center;flex-wrap:nowrap;height:6px;overflow:hidden}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots i.req{background:transparent !important;border:1.5px solid currentColor}
.dots i.inf{opacity:.4}
.dots em{font-style:normal;font-size:8px;color:var(--muted);line-height:6px}

/* month view */
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mhead h3{margin:0;font-size:18px;flex:1}
.nav{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.nav:hover{color:var(--text);border-color:var(--text)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .wd{font-size:11px;padding:2px 0}
.mc{min-height:104px;border:1px solid var(--border2);border-radius:8px;padding:4px 5px;cursor:pointer;overflow:hidden;min-width:0}
.mc.wk{background:var(--wk)}
.mc:hover{border-color:var(--muted2)}
.mc.today{border-color:var(--text)}
.mc.sel{outline:2px solid var(--text);outline-offset:-1px}
.mc .n{font-size:12px;font-weight:600;color:var(--muted)}
.mc.today .n{color:var(--text)}
.mc.out{opacity:.35}
.chip{display:block;font-size:11.5px;line-height:1.3;padding:1px 6px;border-radius:5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c-X);background:var(--surface2)}
.chip.req{background:transparent;border:1px solid var(--amber);border-left-width:3px}
.chip.inf{background:transparent;border:1px dotted var(--muted2);border-left-width:3px;color:var(--muted)}
.chip.hol{background:var(--hol);color:var(--hol-fg);border-color:var(--hol);font-weight:600}
.more{font-size:11px;color:var(--muted2);margin-top:2px}

/* list view */
.lt{width:100%;border-collapse:collapse;font-size:13.5px}
.lt th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);padding:6px 8px;border-bottom:1px solid var(--text);font-weight:700}
.lt td{padding:8px;border-bottom:1px solid var(--border2);vertical-align:top}
.search{width:100%;max-width:320px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;margin-bottom:10px}
.tw{overflow-x:auto}

.foot{font-size:12.5px;color:var(--muted);margin-top:18px}

@media (max-width:1000px){
  .main{grid-template-columns:1fr}
  .side{position:static}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .filters{gap:0 20px}
  .year{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}
  .dc{height:24px;font-size:10.5px}
  .dots i{width:4px;height:4px}
  .mc{min-height:62px;padding:3px}
  .mc .chip{font-size:0;padding:0;height:6px;border-radius:3px;margin-top:3px}
  .mc .more{font-size:10px}
  .lt th:nth-child(n+6),.lt td:nth-child(n+6){display:none}
}

/* planner bars, the same idea as Jumera's sheets: one bar per leave, branch colour, name once */
.bar{height:18px;line-height:18px;padding:0 6px;border-radius:4px;font-size:11.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--bc,var(--c-X));cursor:default;min-width:0}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.bar.app::before{content:"\2713 "}
.bar.req{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--amber),inset 4px 0 0 var(--bc)}
.bar.inf{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--muted2),inset 4px 0 0 var(--bc);opacity:.85}
.bar.hol{background:var(--hol);color:var(--hol-fg);font-weight:600}
.bar.blk{background:var(--blk);color:#fff;font-style:italic}

/* the site's sticky header: Menu, hello, Hide filters, the rule that sums up the filters, the filter rows, and on a phone the filter sheet */
.mast-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.tglr{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:20px;padding:6px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;min-height:34px}
.tglr:hover{color:var(--text)}
#fSheetBtn{display:none}
.topbar.fclosed .filters-wrap{display:none}
.fscrim{display:none;position:fixed;inset:0;z-index:130;background:rgba(26,26,26,.38)}
.fsheet{display:none;flex-direction:column;position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:131;width:min(100%,390px);background:var(--bg);border-radius:18px 18px 0 0;padding:0 10px 18px;max-height:80vh;overflow:auto;box-shadow:var(--shadow)}
body.sheet-open .fscrim,body.sheet-open .fsheet{display:flex}
.fsheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.fsheet-head b{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.fsheet .filters{flex-direction:column;align-items:stretch;gap:14px;padding:12px 0 4px}
.fsheet .f-row{flex-direction:column;align-items:stretch;gap:8px}
.fsheet .f-lbl{font-size:12px}
.fsheet .chipset{gap:8px}
.fsheet .sep{display:none}
.fsheet .gchip{min-height:44px;padding:0 16px;border:1px solid var(--border);border-radius:999px;font-size:15px;background:var(--surface)}
.fsheet .gchip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.fsheet .gseg{display:flex;flex:1 0 100%;padding:3px;gap:3px;background:var(--surface)}
.fsheet .gseg .gchip{flex:1;border:0;background:none;color:var(--muted2)}
.fsheet .gseg .gchip[aria-pressed="true"]{background:var(--text);color:var(--bg)}

/* header filter menu, like Google Sheets (same as the Weekly Product Plan sheet) */
.sickbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 10px}
#sickInfo{display:inline-flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted)}
.rs{border:0;background:none;color:var(--ok);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
:root:not([data-theme="dark"]) .rs{color:#0F6B58}
.sickT .hd{display:flex;align-items:center;gap:2px}
.sickT th.m .hd{justify-content:center}
.sickT th.on{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.fi{flex:none;width:22px;height:22px;border:0;border-radius:6px;background:none;color:var(--muted2);cursor:pointer;display:grid;place-items:center;padding:0}
.fi:hover{background:var(--border);color:var(--text)}
.fi.on{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.fi svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sickT th.mcol{position:sticky}
.sickT th.mcol .hd{position:relative;justify-content:center}
.sickT th.mcol .fi{position:absolute;right:-4px;top:-5px;width:16px;height:16px;opacity:0;background:var(--surface)}
.sickT th.mcol:hover .fi,.sickT th.mcol .fi.on,.sickT th.mcol .fi:focus-visible{opacity:1}
.sickT th.mcol .fi svg{width:10px;height:10px}
.fm{position:fixed;z-index:150;width:288px;max-height:min(560px,calc(100vh - 20px));overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px 0;display:none;font-size:13.5px;font-family:Inter,system-ui,sans-serif}
.fm .it{display:flex;gap:10px;align-items:center;width:100%;padding:8px 14px;border:0;background:none;cursor:pointer;text-align:left;font-size:13.5px}
.fm .it:hover{background:var(--surface2)}
.fm .it.on{color:var(--ok);font-weight:600}
.fm hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.fm .sec{padding:2px 14px 6px}
.fm .sh{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:6px 0;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.fm select,.fm .fin{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface2);padding:6px 9px;font-size:13px;margin-top:4px}
.fm .row2{display:flex;gap:6px}
.fm .vact{display:flex;gap:12px;font-size:12px;margin:6px 0 4px;align-items:center}
.fm .vact button{border:0;background:none;color:var(--ok);cursor:pointer;padding:0;text-decoration:underline;font-size:12px}
:root:not([data-theme="dark"]) .fm .vact button{color:#0F6B58}
.fm .vact span{margin-left:auto;color:var(--muted2)}
.fm .vl{max-height:190px;overflow:auto;border:1px solid var(--border2);border-radius:8px;padding:4px 6px;margin-top:4px}
.fm .vl label{display:flex;gap:8px;align-items:center;padding:3px 2px;cursor:pointer}
.fm .vl label span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm .vl label em{font-style:normal;color:var(--muted2);font-size:11.5px}
.fm .btns{display:flex;justify-content:flex-end;gap:8px;padding:8px 14px 6px}
.fm .go{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer}
.fm .go.ghost{background:none;color:var(--text);border-color:var(--border)}
.fm button:focus-visible,.fm input:focus-visible,.fm select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* the roster table has to fit its card: position and works wrap, month columns stay slim; a narrower screen scrolls the table sideways instead */
.sickT th:nth-child(2),.sickT td:nth-child(2),.sickT th:nth-child(3),.sickT td:nth-child(3){width:auto;white-space:normal;max-width:190px}
.sickT td.pos,.sickT td.sch{white-space:normal;max-width:190px;line-height:1.35}
.sickT th.m{padding:6px 1px;font-size:11px;letter-spacing:.06em}
.sickT td.m{min-width:0}


/* the roster table is its own scroll area, like a sheet: the header stays on top, the names stay on the left, the months have room, soft lines tell them apart */
.card.tw.fix.sickw{padding:0;overflow:auto;max-height:calc(100vh - var(--tb,160px) - 24px);scrollbar-gutter:stable}

he real gaps.<\/p>\n  <p><b>Why now:<\/b> leave is now requested in Bayzat, and the National Day holidays start on 2 Dec.<\/p>\n  <p><b>If we do nothing:<\/b> a gap shows up on the day, with a client already booked.<\/p>\n  <div class=\"try\"><b>Try it first:<\/b> open 22 Nov. Who is off, and which bookings would you move? Then tell Kate what you noticed.<\/div>\n<\/div>\n\n<h2 id=\"sec-overview\">Overview<\/h2>\n<div class=\"tiles\" id=\"tiles\"><\/div>\n<div class=\"lc-sechead\"><h2 id=\"sec-cal\">Calendar<\/h2><span class=\"rex-bar\" role=\"group\" aria-label=\"Download this report\"><button type=\"button\" class=\"sc-btn rex-btn\" title=\"Download the leave list as an Excel file\" onclick=\"rexRun('lcExpLeave','xlsx',this)\">XLSX<\/button><button type=\"button\" class=\"sc-btn rex-btn\" title=\"Download the leave list as a CSV file\" onclick=\"rexRun('lcExpLeave','csv',this)\">CSV<\/button><\/span><\/div>\n<div class=\"layers\" id=\"layers\"><\/div>\n  <div class=\"blegend\"><span><i style=\"background:var(--c-KCA)\"><\/i>KCA<\/span><span><i style=\"background:var(--c-AQ)\"><\/i>AQ<\/span><span><i style=\"background:var(--c-SAA)\"><\/i>SAA<\/span><span><i style=\"background:var(--c-MC)\"><\/i>MC<\/span><span><i style=\"background:var(--c-X)\"><\/i>Branch not set<\/span><span><i style=\"background:#5CE0C8;width:3px;height:14px;border-radius:2px\"><\/i>Today<\/span><\/div>\n\n  <div class=\"main\">\n    <div class=\"card\" id=\"cal\"><\/div>\n    <div class=\"card side\" id=\"side\"><\/div>\n  <\/div>\n\n  <div class=\"lc-sechead\"><h2 id=\"sec-sick\">Sick leave and absences (counts per month, no dates)<\/h2><span class=\"rex-bar\" role=\"group\" aria-label=\"Download this report\"><button type=\"button\" class=\"sc-btn rex-btn\" title=\"Download sick leave and absences as an Excel file\" onclick=\"rexRun('lcExpSick','xlsx',this)\">XLSX<\/button><button type=\"button\" class=\"sc-btn rex-btn\" title=\"Download sick leave and absences as a CSV file\" onclick=\"rexRun('lcExpSick','csv',this)\">CSV<\/button><\/span><\/div>\n  <div class=\"foot\" style=\"margin:0 0 8px\"><span class=\"pill sl\">3<\/span> sick with a medical certificate (SL Monitoring). <span class=\"pill ab\">3<\/span> sick without one, marked absent. Follows the Branch filter, and anyone Phorest lists in several salons shows under each. The sheets give counts, not dates, so these cannot be drawn on the calendar days. From Jumera's notes.<\/div>\n  <div class=\"sickbar\"><div class=\"gseg\" id=\"sickMode\"><\/div><span id=\"sickInfo\"><\/span><\/div>\n  <div class=\"card tw fix sickw\"><table class=\"lt sickT\" id=\"sickT\"><\/table><\/div>\n\n  <div class=\"lc-sechead\"><h2 id=\"sec-off\">Usual day offs by branch (from Phorest rosters)<\/h2><span class=\"rex-bar\" role=\"group\" aria-label=\"Download this report\"><button type=\"button\" class=\"sc-btn rex-btn\" title=\"Download the usual day offs as an Excel file\" onclick=\"rexRun('lcExpOff','xlsx',this)\">XLSX<\/button><button type=\"button\" class=\"sc-btn rex-btn\" title=\"Download the usual day offs as a CSV file\" onclick=\"rexRun('lcExpOff','csv',this)\">CSV<\/button><\/span><\/div>\n  <div class=\"foot\" style=\"margin:0 0 8px\">Each cell is the share of weeks the person was rostered on that weekday in Phorest, 24 Aug to 15 Nov 2026 (12 weeks). <b>off<\/b> = rostered in 25% of weeks or fewer. Only weeks with at least two rostered days count, so a week of leave is not read as a week off. Phorest rosters hours, it does not hold approved leave, and a rota that moves every week shows as Rotating. The top table adds up the shares: the average number of people rostered on each day, the quietest day tinted.<\/div>\n  <div class=\"card tw fix\"><table class=\"lt covT\" id=\"covT\"><\/table><\/div>\n  <div class=\"sickbar\" style=\"margin-top:14px\"><span id=\"offInfo\"><\/span><\/div>\n  <div class=\"card tw fix sickw\"><table class=\"lt offT\" id=\"offT\"><\/table><\/div>\n\n  <div class=\"lc-sechead\"><h2 id=\"sec-hol\">Public holidays 2026 (expected)<\/h2><span class=\"rex-bar\" role=\"group\" aria-label=\"Download this report\"><button type=\"button\" class=\"sc-btn rex-btn\" title=\"Download the public holidays as an Excel file\" onclick=\"rexRun('lcExpHol','xlsx',this)\">XLSX<\/button><button type=\"button\" class=\"sc-btn rex-btn\" title=\"Download the public holidays as a CSV file\" onclick=\"rexRun('lcExpHol','csv',this)\">CSV<\/button><\/span><\/div>\n  <div class=\"foot\" style=\"margin:0 0 8px\">Working? is read from Phorest: &#10003; every branch shown had visits, &#10007; none did, &frac12; some did, ? no data yet. It shows what happened, not a rule for next year. Follows the Branch filter. Hover a mark for the visit counts.<\/div>\n  <div class=\"card tw\"><table class=\"lt\" id=\"holT\"><\/table><\/div>\n<div class=\"foot\">Colours are the branch, the same as the planner sheets: KCA blue, AQ purple, SAA green, MC orange. A solid bar = planned, with a tick = approved, amber outline = waiting for approval, grey hatched = blocked days (no leave), the solid dark block = public holiday. Leave and absences come from Jumera's notes.<\/div>\n<\/div>\n<\/div>\n<div class=\"fscrim\" id=\"fScrim\"><\/div>\n<div class=\"fsheet\" id=\"fSheet\" role=\"dialog\" aria-label=\"Filters\">\n  <div class=\"fsheet-head\"><b>Filters<\/b><button class=\"tglr\" type=\"button\" id=\"fDone\">Done<\/button><\/div>\n  <div id=\"fSheetBody\"><\/div>\n<\/div>\n";

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function brAll(){return S.br.length===4}
function brOK(b){return b==='X'?brAll():S.br.indexOf(b)>=0}
function isRes(n,b){var f=rfind(n,b);return !!(f&&f.res)}
function leaveShown(){return LV.filter(function(l){return S.layers[l.s]&&brOK(l.b)&&(S.res||!isRes(l.n,l.b))&&(!S.q||l.n.toLowerCase().indexOf(S.q)>-1)})}

function index(){
  var m={};
  function put(d,k,o){(m[d]=m[d]||{hol:[],lv:[]})[k].push(o)}
  if(S.layers.hol)HOL.forEach(function(h){for(var t=P(h.f);t<=P(h.t);t+=864e5)put(iso(t),'hol',h)});
  leaveShown().forEach(function(l){var to=l.open?TODAY:l.t;for(var t=P(l.f);t<=P(to);t+=864e5)put(iso(t),'lv',l)});
  return m;
}

function onGlobalChip(e){
  var b=e.target.closest('.gchip');if(!b)return;var v=b.getAttribute('data-v');if(!v)return;
  if(v==='__all')S.br=['SAA','KCA','MC','AQ'];
  else if(v.charAt(0)==='y'){S.y=+v.slice(1);if(S.sel.slice(0,4)!==String(S.y))S.sel=S.y+'-01-01'}
  else if(v.slice(0,2)==='v:')S.view=v.slice(2);
  else if(v==='r0'||v==='r1')S.res=(v==='r1');
  else{
    if(brAll())S.br=[v];
    else if(S.br.indexOf(v)>=0)S.br=S.br.filter(function(x){return x!==v});
    else S.br=S.br.concat(v);
    if(!S.br.length)S.br=['SAA','KCA','MC','AQ'];
  }
  draw();
}

function dotsFor(d){

  var seen={},k=0;
  d.lv.forEach(function(l){if(k>=4)return;var key=l.n;if(seen[key])return;seen[key]=1;k++;
    var i=el('i',l.s);i.style.background='var(--c-'+l.b+')';i.style.color='var(--c-'+l.b+')';w.appendChild(i)});
  if(d.lv.length>4)w.appendChild(el('em','','+'+(d.lv.length-4)));

function monthCells(y,m){
  var first=new Date(Date.UTC(y,m,1)),lead=(first.getUTCDay()+6)%7,days=new Date(Date.UTC(y,m+1,0)).getUTCDate(),out=[];
  for(var i=0;i<lead;i++)out.push(null);
  for(var d=1;d<=days;d++)out.push(iso(Date.UTC(y,m,d)));
  while(out.length%7)out.push(null);
  return out;
}
function isWk(s){var g=new Date(P(s)).getUTCDay();return g===0||g===6}

function isBlk(s){return BLK.some(function(b){return s>=b.f&&s<=b.t})}
function overlapBlk(l){return BLK.some(function(b){return l.f<=b.t&&l.t>=b.f})}

function rfind(name,b){
  var nm=ALIAS[name]||name;
  if(RBY[nm])return RBY[nm];
  var first=nm.split(' ')[0];
  var c=ROSTER.filter(function(r){return r.n.split(' ')[0]===first});
  if(c.length===1)return c[0];
  if(c.length>1){var m=c.filter(function(r){return r.b===b});if(m.length===1)return m[0]}
  return null;
}

function moveTip(ev){
  if(!tipEl)return;
  var x=ev.clientX+16,y=ev.clientY+16,r=tipEl.getBoundingClientRect();
  if(x+r.width>window.innerWidth-8)x=Math.max(8,ev.clientX-r.width-16);
  if(y+r.height>window.innerHeight-8)y=Math.max(8,ev.clientY-r.height-16);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';
}

  return out;

/* segments of the items that fall inside the row [a,b], packed into lanes so bars never overlap */
function lanesFor(its,a,b){
  var A=P(a),B=P(b),segs=[];
  its.forEach(function(it){
    var f=Math.max(P(it.f),A),t=Math.min(P(it.t),B);if(f>t)return;
    segs.push({it:it,s:Math.round((f-A)/864e5),e:Math.round((t-A)/864e5),cl:P(it.f)<A,cr:P(it.t)>B})});
  segs.sort(function(x,y){return x.s-y.s||(y.e-y.s)-(x.e-x.s)});
  var ends=[];
  segs.forEach(function(g){var i=0;while(ends[i]!==undefined&&ends[i]>=g.s)i++;g.lane=i;ends[i]=g.e});
  return {segs:segs,n:ends.length};
}
function barEl(g){
  var it=g.it,e=el('div','bar '+it.k+(g.cl?' cl':'')+(g.cr?' cr':''),it.label);
  e.style.gridColumn=(g.s+1)+' / span '+(g.e-g.s+1);e.style.gridRow=String(g.lane+1);
  e.style.setProperty('--bc','var(--c-'+it.b+')');
  e.addEventListener('mouseenter',function(ev){showTip(ev,it)});
  e.addEventListener('mousemove',moveTip);
  e.addEventListener('mouseleave',hideTip);
  e.addEventListener('click',function(ev){ev.stopPropagation();if(tipEl)hideTip();else showTip(ev,it)});
  return e;
}

/* on = every branch shown traded every day, off = none did, part = some did, tbc = no data yet */
function holWork(h){
  var brs=S.br.slice(),tot=0,open=0;
  for(var t=P(h.f);t<=P(h.t);t+=864e5){var d=PH[iso(t)];if(!d)continue;brs.forEach(function(b){tot++;if(d[b]>0)open++})}
  return !tot?'tbc':open===tot?'on':open===0?'off':'part';
}
function holVisits(h){
