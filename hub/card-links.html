<body class="kb-wait">
<!-- Staff Card Links (Kate, 14 Oct 2026): one link per stylist and beautician that opens her card on
     promo.tararosesalon.com/stylist--beautician-cards-page, split by branch and department, for the
     call centre to paste into WhatsApp. STAFF below is that page's own roster (branch, department,
     role, name) plus its ?staff= slug, which is slugify(name + "-" + singular role). A person who
     changes role or branch gets a new slug, so rebuild this list when the promo page changes.
     Public names and public links only, nothing private. -->
<div class="wrap">
  <header class="kb-head" id="kbHead" data-title="Team Home"></header>
  <main id="kbMain"><p class="kb-msg">Loading…</p></main>
  <footer class="kb-foot">For the Tara Rose Salons team only. <a href="/privacy/">Privacy</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=3823f956"></script>
<script src="/assets/theme-fade.js"></script>
<script src="/hub/hub.js?v=a5db97ee"></script>
<script src="/visits.js?v=1176426c"></script>
<script>
(function () {
  var main = document.getElementById('kbMain'), esc = KB.esc;
  if (/\.html$/.test(location.pathname)) history.replaceState(null, '', location.pathname.replace(/\.html$/, '') + location.search + location.hash);
  var BASE = 'https://promo.tararosesalon.com/stylist--beautician-cards-page?mode=dark';
  // [branch, department, role, name, slug, has card]
  var STAFF = [["Khalifa City","Hair","Style Directors","Kate","kate-style-director",1],["Khalifa City","Hair","Style Directors","Tegan","tegan-style-director",1],["Khalifa City","Hair","Senior Stylists","Nikki","nikki-senior-stylist",1],["Khalifa City","Hair","Senior Stylists","Kylie","kylie-senior-stylist",1],["Khalifa City","Hair","Senior Stylists","Katie","katie-senior-stylist",1],["Khalifa City","Hair","Senior Stylists","Olena","olena-senior-stylist",1],["Khalifa City","Hair","Stylists","Lizanie","lizanie-stylist",1],["Khalifa City","Hair","Stylists","Chalani","chalani-stylist",1],["Khalifa City","Hair","Junior Stylists","May","may-junior-stylist",1],["Khalifa City","Hair","Junior Stylists","Irlyn","irlyn-junior-stylist",1],["Khalifa City","Hair","Blow-Dry Specialists","Hazel Mae","hazel-mae-blow-dry-specialist",1],["Khalifa City","Hair","Blow-Dry Specialists","Mevil","mevil-blow-dry-specialist",1],["Mamsha Al Saadiyat","Hair","Style Directors","Emma","emma-style-director",1],["Mamsha Al Saadiyat","Hair","Style Directors","Jeida","jeida-style-director",1],["Mamsha Al Saadiyat","Hair","Senior Stylists","Holly","holly-senior-stylist",1],["Mamsha Al Saadiyat","Hair","Stylists","Tammy","tammy-stylist",1],["Mamsha Al Saadiyat","Hair","Stylists","Shelley","shelley-stylist",1],["Mamsha Al Saadiyat","Hair","Stylists","Bethany","bethany-stylist",1],["Mamsha Al Saadiyat","Hair","Stylists","April","april-stylist",1],["Mamsha Al Saadiyat","Hair","Stylists","Vicki","vicki-stylist",1],["Mamsha Al Saadiyat","Hair","Stylists","Virginia","virginia-stylist",1],["Mamsha Al Saadiyat","Hair","Junior Stylists","Eds","eds-junior-stylist",1],["Mamsha Al Saadiyat","Hair","Blow-Dry Specialists","Helen","helen-blow-dry-specialist",1],["Mamsha Al Saadiyat","Hair","Blow-Dry Specialists","Myra","myra-blow-dry-specialist",1],["Motor City","Hair","Style Directors","Ashleigh","ashleigh-style-director",1],["Motor City","Hair","Style Directors","Alan","alan-style-director",1],["Motor City","Hair","Style Directors","Lucy","lucy-style-director",1],["Motor City","Hair","Senior Stylists","Robyn","robyn-senior-stylist",1],["Motor City","Hair","Senior Stylists","Elise","elise-senior-stylist",1],["Motor City","Hair","Blow-Dry Specialists","Xyrhy","xyrhy-blow-dry-specialist",1],["Motor City","Hair","Blow-Dry Specialists","Clarissa","clarissa-blow-dry-specialist",1],["Al Quoz","Hair","Style Directors","Ruth","ruth-style-director",1],["Al Quoz","Hair","Senior Stylists","Ibrahim","ibrahim-senior-stylist",1],["Al Quoz","Hair","Senior Stylists","Simon","simon-senior-stylist",1],["Al Quoz","Hair","Stylists","Andrea","andrea-stylist",1],["Al Quoz","Hair","Junior Stylists","Areanne","areanne-junior-stylist",1],["Khalifa City","Beauty","Senior Beauty Therapist","Grace","grace-senior-beauty-therapist",1],["Khalifa City","Beauty","Senior Beauty Therapist","Mimi","mimi-senior-beauty-therapist",1],["Khalifa City","Beauty","Senior Beauty Therapist","Shila","shila-senior-beauty-therapist",1],["Khalifa City","Beauty","Senior Nail Technician","Kim","kim-senior-nail-technician",1],["Mamsha Al Saadiyat","Beauty","Senior Beauty Therapist","Mona","mona-senior-beauty-therapist",1],["Mamsha Al Saadiyat","Beauty","Senior Beauty Therapist","Sania","sania-senior-beauty-therapist",1],["Mamsha Al Saadiyat","Beauty","Senior Beauty Therapist","Reda","reda-senior-beauty-therapist",1],["Mamsha Al Saadiyat","Beauty","Nail Technician","Judy","judy-nail-technician",1],["Mamsha Al Saadiyat","Beauty","Nail Technician","Arni","arni-nail-technician",1],["Al Quoz","Beauty","Beauty Therapist","Shine","shine-beauty-therapist",1],["Al Quoz","Beauty","Nail Technician","MJ","mj-nail-technician",1]];
  var BRANCHES = ['Khalifa City', 'Mamsha Al Saadiyat', 'Motor City', 'Al Quoz'];
  var SHORT = { 'Khalifa City': 'Khalifa City', 'Mamsha Al Saadiyat': 'Saadiyat', 'Motor City': 'Motor City', 'Al Quoz': 'Al Quoz' };
  function link(s, view) { return BASE + '&staff=' + s[4] + '&view=' + view; }
  function notFound() {
    main.innerHTML = '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p><p class="kb-msg">This page isn’t open to your account. <a href="/hub/">Back to Team Home</a></p>';
  }
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (ok, no) {
      var t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy') ? ok() : no(); } catch (e) { no(e); }
      t.remove();
    });
  }
  KB.ready.then(function () {
    if (KB.allowed.indexOf('card-links') < 0) { notFound(); return; }
    var pick = 0;
    try { pick = +(new URLSearchParams(location.search).get('b') || localStorage.getItem('trs-cardlinks-tab') || 1) - 1; } catch (e) {}
    if (!(pick >= 0 && pick < BRANCHES.length)) pick = 0;
    function count(b) { return STAFF.filter(function (s) { return s[0] === b; }).length; }
    function rows(b, dept) {
      return STAFF.filter(function (s) { return s[0] === b && s[1] === dept; }).map(function (s) {
        return '<div class="kb-row fm-row"><span class="kb-row-tx"><b>' + esc(s[3]) + '</b><span>' + esc(s[2]) + '</span></span>' +
          '<span class="fm-acts">' +
          (s[5] ? '<button type="button" class="fm-btn fm-dl" data-copy="' + esc(link(s, 'card')) + '">Copy card link</button>' : '') +
          '<button type="button" class="fm-btn" data-copy="' + esc(link(s, 'photo')) + '">Copy photo link</button>' +
          '<a class="fm-btn" style="display:inline-flex;align-items:center;text-decoration:none" href="' + esc(link(s, s[5] ? 'card' : 'photo')) + '" target="_blank" rel="noopener">Open</a></span></div>';
      }).join('');
    }
    main.innerHTML =
      '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p>' +
      KB.titleIcon('card-links', 'Staff Card Links') +
      '<p class="kb-meta">One link per stylist and beautician. Copy it, paste it into WhatsApp, and the client lands straight on her card. The card link opens her card; the photo link opens her photo.</p>' +
      '<div class="fm-switch" role="group" aria-label="Which branch">' + BRANCHES.map(function (b, i) {
        return '<button type="button" data-i="' + i + '" aria-pressed="' + (i === pick) + '"><b>' + esc(SHORT[b]) + '</b><span>' + count(b) + '</span></button>';
      }).join('') + '</div>' +
      BRANCHES.map(function (b, i) {
        return '<section class="kb-dept fm-dept" data-i="' + i + '"' + (i === pick ? '' : ' hidden') + '>' +
          ['Hair', 'Beauty'].map(function (d) {
            var r = rows(b, d);
            return r ? '<h2 class="kb-dept-h">' + esc(SHORT[b]) + ' · ' + d + '</h2>' + r : '';
          }).join('') + '</section>';
      }).join('');
    main.addEventListener('click', function (e) {
      var c = e.target.closest('[data-copy]');
      if (c) {
        var was = c.textContent;
        copy(c.dataset.copy).then(function () { c.textContent = 'Copied'; }, function () { c.textContent = 'Press Ctrl+C'; });
        setTimeout(function () { c.textContent = was; }, 1600);
        return;
      }
      var s = e.target.closest('.fm-switch button');
      if (!s) return;
      var i = +s.dataset.i;
      main.querySelectorAll('.fm-switch button').forEach(function (x) { x.setAttribute('aria-pressed', String(+x.dataset.i === i)); });
      main.querySelectorAll('.fm-dept').forEach(function (d) { d.hidden = +d.dataset.i !== i; });
      try { localStorage.setItem('trs-cardlinks-tab', String(i + 1)); } catch (err) {}
      var u = new URL(location.href); u.searchParams.set('b', String(i + 1)); history.replaceState(null, '', u.pathname + u.search);
    });
  });
})();
</script>
</body>
</html>
