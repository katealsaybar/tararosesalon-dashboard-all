<style>
/* Kate, 20 Nov 2026: Rearrange Menu, Level 5 only, revamped for ADHD (few words, one section at a time). Your own dashboard menu: move pages between sections and sub-sections,
   and the sections themselves. Nothing here changes who may open a page, and nobody else's menu changes (public.nav_layout, one row per person; nav-layout.js draws it).
   Approved mockup: docs/mockups/menu-mover.html (cowork repo). Every class is scoped under .mm so hub.css is not touched. */
.mm{--mm-moved:#EEF3C7;--mm-moved-ink:#3b4310;--mm-pick:#d9f7f1;--mm-pick-ring:#0f766e}
:root[data-theme="dark"] .mm{--mm-moved:#4a4f2c;--mm-moved-ink:#EEF3C7;--mm-pick:#1f4b47;--mm-pick-ring:#99F6E4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mm{--mm-moved:#4a4f2c;--mm-moved-ink:#EEF3C7;--mm-pick:#1f4b47;--mm-pick-ring:#99F6E4}}
.mm,.mm *{box-sizing:border-box}
.mm{max-width:720px;margin:0 auto;padding-bottom:calc(var(--mm-dockh,92px) + 40px)}
.mm button{font:inherit;color:inherit}
.mm .kids{font-size:13px;color:var(--muted2);margin-left:6px;white-space:nowrap}
.mm .msg.err{color:#B3402A;font-weight:600}
.mm :focus-visible{outline:2px solid var(--mm-pick-ring);outline-offset:2px}
.mm .tb{position:sticky;top:var(--mm-top);z-index:15;background:var(--bg);box-shadow:0 -14px 0 var(--bg);padding:8px 0 4px}
.mm .search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:0 16px;min-height:42px;color:var(--muted)}
.mm .search:focus-within{border-color:var(--text);color:var(--text)}
.mm .search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--text);padding:8px 0}
.mm .tabsbar{position:sticky;top:calc(var(--mm-top) + var(--mm-tbh));z-index:14;background:var(--bg);display:flex;align-items:center;gap:4px;padding:4px 0 10px}
.mm .tabs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 28px 2px 0;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.mm .tabs::-webkit-scrollbar{display:none}
.mm .tab{flex:none;min-height:40px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.mm .tab .n{font-weight:400;color:var(--muted2);font-size:13px}
@media(hover:hover){
.mm .tab:hover{border-color:var(--text)}
}
.mm .tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.mm .tab[aria-selected="true"] .n{color:inherit;opacity:.8}
.mm .tab.plus{border-style:dashed;background:none;color:var(--muted);font-size:18px;padding:0 16px}
.mm .kebab{flex:none;width:40px;height:40px;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;letter-spacing:1px}
@media(hover:hover){
.mm .kebab:hover{background:var(--surface2)}
}
.mm.searching .tabsbar{display:none}
.mm .sec{display:none;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:6px 12px 12px}
.mm .sec.cur{display:block}
.mm.searching .sec{display:none}
.mm .addsub{display:flex;align-items:center;justify-content:center;width:100%;margin-top:12px;min-height:44px;border:1px dashed var(--border);background:none;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
@media(hover:hover){
.mm .addsub:hover{border-color:var(--text);color:var(--text)}
}
.mm.searching .addsub{display:none}
.mm.searching .sec.hit{display:block;margin-bottom:12px}
.mm .sec-h{display:none;font-size:16px;margin:10px 2px 0;font-weight:700}
.mm.searching .sec-h{display:block}
.mm .grp{margin-top:14px}
.mm .grp:first-of-type{margin-top:6px}
.mm .gh{display:flex;align-items:center;gap:6px;margin:0 0 4px 2px;min-height:32px}
.mm .gh h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;flex:1;font-weight:700}
.mm .gh .kebab{width:36px;height:36px}
.mm ul.lst{list-style:none;margin:0;padding:0}
.mm ul.lst.over{outline:2px dashed var(--mm-pick-ring);outline-offset:2px;border-radius:12px}
.mm .row{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:12px;background:var(--bg);min-height:44px;padding-right:4px;margin-bottom:6px;transition:border-color .12s,background .12s}
.mm .row[draggable=true]{cursor:grab}
.mm .row.drag{opacity:.4}
.mm .row .pk{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;cursor:pointer;padding:8px 6px 8px 10px;min-height:42px;border-radius:12px}
.mm .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:inline-flex;align-items:center;justify-content:center;color:transparent;font-size:13px;font-weight:700;transition:all .12s;background:var(--surface)}
@media(hover:hover){
.mm .row:hover{border-color:var(--text)}
.mm .row:hover .dot{border-color:var(--text)}
}
.mm .row.picked{background:var(--mm-pick);border-color:var(--mm-pick-ring)}
.mm .row.picked .dot{background:var(--mm-pick-ring);border-color:var(--mm-pick-ring);color:var(--surface)}
.mm .row.moved{background:var(--mm-moved);border-color:transparent;color:var(--mm-moved-ink)}
.mm .row.moved.picked{background:var(--mm-pick);color:var(--text);border-color:var(--mm-pick-ring)}
.mm .row .nm{flex:1;min-width:0;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.mm .tag{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--surface);color:var(--muted);white-space:nowrap;flex:none}
.mm .row.moved .tag{background:rgba(255,255,255,.55);color:var(--mm-moved-ink)}
:root[data-theme="dark"] .mm .row.moved .tag{background:rgba(0,0,0,.25)}
.mm .nudge{display:none;gap:4px;flex:none}
.mm .row.picked.solo .nudge{display:inline-flex}
.mm .row.picked.solo .open{display:none}
.mm .ib{flex:none;width:36px;height:36px;border:1px solid var(--border);background:var(--surface);border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--text);text-decoration:none}
.mm .ib:disabled{opacity:.3;cursor:default}
.mm .ib[data-act="first"]{font-size:13px;font-weight:600}
@media(hover:hover){
.mm .ib:not(:disabled):hover{border-color:var(--text)}
}
.mm .row .open{border-color:transparent;background:none;color:var(--muted)}
.mm .row.flash{animation:fl 1.8s ease-out}
@keyframes fl{0%,35%{box-shadow:0 0 0 3px var(--mm-pick-ring)}100%{box-shadow:0 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){
.mm .row.flash{animation:none;box-shadow:0 0 0 3px var(--mm-pick-ring)}
}
.mm .put{display:none;width:100%;min-height:44px;border:1px dashed var(--mm-pick-ring);background:color-mix(in srgb,var(--mm-pick) 55%,transparent);border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;color:var(--mm-pick-ring)}
:root[data-theme="dark"] .mm .put{color:var(--accent-mint)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]) .mm .put{color:var(--accent-mint)}
}
.mm.carry .put{display:block}
@media(hover:hover){
.mm.carry .put:hover{background:var(--mm-pick);border-style:solid}
}
.mm .none{display:block;font-size:14px;color:var(--muted2);padding:10px 12px;border:1px dashed var(--border);border-radius:12px;margin-bottom:6px}
.mm.carry .none{display:none}
.mm .nomatch{font-size:15px;color:var(--muted);padding:18px 4px}
.mm .hide{display:none!important}
.mm .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -8px 24px -12px rgba(0,0,0,.25);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.mm .dock-in{max-width:720px;margin:0 auto}
.mm .tray{display:none;flex-wrap:wrap;gap:8px;align-items:center}
.mm.carry .tray{display:flex}
.mm.carry .bar{display:none}
.mm .chips{display:flex;gap:6px;flex:1 1 100%;flex-wrap:wrap}
.mm .chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--mm-pick-ring);background:var(--mm-pick);border-radius:999px;padding:0 2px 0 12px;min-height:34px;font-size:14px}
.mm .chip button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1}
.mm .sendto{flex:1 1 0;min-width:0}
.mm .sendbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:0 16px;font-size:15px;font-weight:500;cursor:pointer;text-align:left}
@media(hover:hover){
.mm .sendbtn:hover{border-color:var(--text)}
}
.mm .sendbtn[aria-expanded="true"]{border-color:var(--text)}
.mm .sendpop{position:fixed;z-index:10000;display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:0 2px 4px rgba(26,26,26,.07),0 18px 40px -10px rgba(26,26,26,.22);overflow-y:auto;overscroll-behavior:contain}
.mm .sendpop button{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:transparent;color:inherit;text-align:left;font-size:15px;font-weight:500;padding:0 16px;min-height:42px;border-radius:999px;cursor:pointer;flex:none}
@media(hover:hover){
.mm .sendpop button:hover{background:var(--surface2)}
}
.mm .sendpop .sp-r{display:inline-flex;align-items:center;gap:10px;color:var(--muted2)}
.mm .sendpop .n{font-size:13px}
.mm .sendpop .chv{font-size:20px;line-height:1}
.mm .sendpop .sp-new{justify-content:center;border:1px dashed var(--border);margin-top:6px;color:var(--muted);font-weight:600}
.mm .sendpop .sp-back{background:var(--surface2);font-weight:700;justify-content:flex-start;margin-bottom:4px}
.mm .bar{display:flex;gap:8px;align-items:center}
.mm .msg{flex:1;font-size:14px;min-width:0;color:var(--muted)}
.mm .btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:0 18px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.mm .btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.mm .btn:disabled{opacity:.4;cursor:default}
@media(hover:hover){
.mm .btn:not(:disabled):hover{border-color:var(--text)}
}
.mm .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--mm-dockh) + 12px);z-index:35;background:var(--accent);color:var(--accent-fg);padding:6px 8px 6px 18px;border-radius:999px;font-size:14px;display:none;align-items:center;gap:10px;max-width:calc(100vw - 20px);box-shadow:var(--shadow)}
.mm .toast.on{display:flex}
.mm .toast button{border:1px solid currentColor;background:none;border-radius:999px;min-height:34px;padding:0 16px;cursor:pointer;font-weight:600;font-size:14px}
.mm .pop{position:fixed;z-index:10000;display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:0 2px 4px rgba(26,26,26,.07),0 18px 40px -10px rgba(26,26,26,.22);min-width:190px}
.mm .pop button{appearance:none;border:0;background:transparent;color:inherit;text-align:left;white-space:nowrap;font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer;min-height:38px}
@media(hover:hover){
.mm .pop button:not(:disabled):hover{background:var(--surface2)}
}
.mm .pop button:disabled{opacity:.4;cursor:default}
.mm .pop .sep{height:1px;background:var(--border2);margin:3px 8px}
.mm dialog{border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);padding:20px;width:min(380px,92vw);box-shadow:var(--shadow)}
.mm dialog::backdrop{background:rgba(0,0,0,.4)}
.mm dialog h4{margin:0 0 10px;font-size:17px}
.mm dialog p{margin:0 0 12px;color:var(--muted);font-size:14px}
.mm dialog input{width:100%;min-height:44px;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--text);padding:0 16px;font:inherit}
.mm dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:760px){
.mm .row{min-height:48px}
.mm .row .pk{min-height:46px}
.mm .ib{width:44px;height:44px}
.mm .btn{min-height:44px}
.mm .search{min-height:44px}
.mm .tab{min-height:44px}
.mm .kebab,
.mm .gh .kebab{width:44px;height:44px}
.mm .sec{padding:4px 8px 10px}
.mm .chip{min-height:44px}
.mm .chip button{width:44px;height:44px}
.mm .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.mm .chips::-webkit-scrollbar{display:none}
.mm .chip{flex:none}
.mm .dock{padding-left:10px;padding-right:10px}
.mm .bar .btn{padding:0 14px}
.mm .sendbtn{min-height:44px}
.mm .sendpop button{min-height:46px}
}
@media(max-width:760px){
.mm .tag{display:none}
}
</style>

<script>
(function () {
  var main = document.getElementById('kbMain');
  KB.ready.then(async function () {
    // Level 5 only, and not while "View as" is on: previewing another level must not let that level change a menu.
    if (KB.realLevel !== 5 || KB.viewAs) {
      main.innerHTML = '<p class="kb-msg">This page is for Kate only' + (KB.viewAs ? ' (switch View as back to Level 6)' : '') + '.</p>';
      return;
    }
    main.innerHTML = KB.titleIcon('menu-mover', 'Rearrange Menu') + '<p class="kb-meta">Tap a page, then tap where it goes.</p>' +
    '<div class="mm" id="mmRoot">' +
      '<div class="tb" id="mmTb"><label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="mmQ" placeholder="Find a page" autocomplete="off" aria-label="Find a page"></label></div>' +
      '<div class="tabsbar" id="mmTabsbar"><div class="tabs" id="mmTabs" role="tablist"></div><button type="button" class="kebab" id="mmGk" aria-label="Section options" aria-haspopup="menu">&#8943;</button></div>' +
      '<div id="mmApp"></div>' +
      '<div class="toast" id="mmToast" role="status" aria-live="polite"><span id="mmToastT"></span><button type="button" id="mmToastU">Undo</button></div>' +
      '<div class="dock" id="mmDock"><div class="dock-in">' +
        '<div class="tray" id="mmTray"><div class="chips" id="mmChips"></div><div class="sendto"><button type="button" class="sendbtn" id="mmSendbtn" aria-haspopup="menu" aria-expanded="false"><span>Send to&hellip;</span><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M1.5 6.5 5 3l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><button type="button" class="btn" id="mmCancel">Cancel</button></div>' +
        '<div class="bar"><div class="msg" id="mmMsg" role="status" aria-live="polite">Loading&hellip;</div><button type="button" class="btn" id="mmUndo">Undo</button><button type="button" class="btn" id="mmMore" aria-haspopup="menu">More</button><button type="button" class="btn pri" id="mmSave">Save</button></div>' +
      '</div></div>' +
      '<dialog class="dlg" id="mmDlg"><h4 id="mmDT"></h4><p id="mmDP"></p><input id="mmDI" type="text" maxlength="40" autocomplete="off"><div class="acts"><button type="button" class="btn" id="mmDNo">Cancel</button><button type="button" class="btn pri" id="mmDYes">OK</button></div></dialog>' +
    '</div>';

    var ROOT = document.getElementById('mmRoot');

  var TRUEDEF = [], UNITS = {};
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(s) { return document.querySelector(s); }
  function cssq(k) { return window.CSS && CSS.escape ? CSS.escape(k) : k; }
  function gl(g) { return g.l || g.n; }
  function sl(s) { return s.l || s.n; }
  var BASE = null, DEF = [], SAVED = [], CUR = [], UNDO = [], picked = [], cur = '', Q = '', dragSolo = false, dropped = false, flashKeys = [], tabT = null;

  function place(t) {
    var m = {};
    t.forEach(function (g) { g.loose.forEach(function (k) { m[k] = g.n + '|'; }); g.subs.forEach(function (s) { s.p.forEach(function (k) { m[k] = g.n + '|' + s.n; }); }); });
    return m;
  }
  var PLACE = {};
  function canonTree(tr) { return trsNav.canon(trsNav.treeToLayout(tr)); }
  function label(k) { return UNITS[k] ? UNITS[k].label : k; }
  function hrefOf(k) { return UNITS[k] && UNITS[k].els[0] && UNITS[k].els[0].getAttribute('href'); }
  function where(k) { var a = k.split('|'); return a[1] ? a[0] + ' › ' + a[1] : a[0]; }
  function group(n) { return CUR.filter(function (g) { return g.n === n; })[0]; }
  function listOf(gn, sn) { var g = group(gn); if (!g) return null; if (!sn) return g.loose; var s = g.subs.filter(function (x) { return x.n === sn; })[0]; return s ? s.p : null; }
  function total(g) { return g.loose.length + g.subs.reduce(function (a, s) { return a + s.p.length; }, 0); }
  function snap() { UNDO.push(JSON.stringify(CUR)); if (UNDO.length > 50) UNDO.shift(); }
  function groupTaken(n, except) { var q = n.toLowerCase(); return CUR.some(function (g) { return g !== except && (g.n.toLowerCase() === q || gl(g).toLowerCase() === q); }); }
  function subTaken(g, n, except) { var q = n.toLowerCase(); return g.subs.some(function (s) { return s !== except && (s.n.toLowerCase() === q || sl(s).toLowerCase() === q); }); }

  /* ---------- drawing ---------- */
  function rowHtml(k, here) {
    var mv = here !== PLACE[k], kids = UNITS[k] ? UNITS[k].els.length - 1 : 0, h = hrefOf(k), nm = label(k);
    return '<li class="row' + (mv ? ' moved' : '') + '" draggable="true" data-k="' + esc(k) + '">' +
      '<button type="button" class="pk" role="checkbox" aria-checked="false" data-act="pick" data-k="' + esc(k) + '"><span class="dot" aria-hidden="true">\u2713</span><span class="nm">' + esc(nm) + (kids ? ' <span class="kids">+' + kids + ' inside</span>' : '') + '</span></button>' +
      (mv ? '<span class="tag">was ' + esc(where(PLACE[k] || '')) + '</span>' : '') +
      '<span class="nudge"><button type="button" class="ib" data-act="first" data-k="' + esc(k) + '" aria-label="Put ' + esc(nm) + ' first" title="Put first">Top</button><button type="button" class="ib" data-act="up" data-k="' + esc(k) + '" aria-label="Move ' + esc(nm) + ' up">\u25B2</button><button type="button" class="ib" data-act="dn" data-k="' + esc(k) + '" aria-label="Move ' + esc(nm) + ' down">\u25BC</button></span>' +
      (h ? '<a class="ib open" href="' + esc(h) + '" target="_blank" rel="noopener" title="Open in a new tab" aria-label="Open ' + esc(nm) + ' in a new tab" draggable="false">\u2197</a>' : '') + '</li>';
  }
