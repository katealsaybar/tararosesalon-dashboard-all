<style>
/* Kate, 9 Nov 2026: Rearrange Menu, Level 5 only. Your own dashboard menu: move pages between sections and sub-sections, and move the sections and sub-sections themselves.
   Nothing here changes who may open a page, and nobody else's menu changes (public.nav_layout, one row per person; nav-layout.js draws it). Approved mockup: docs/mockups/menu-mover.html. */
.mm-col{max-width:760px;margin:0 auto;padding-bottom:110px}
.mm-how{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px;flex:1 1 280px}
/* Kate, 9 Nov 2026: the how-to line and the Expand all / Collapse all toggle stay put under the page header while you scroll (--mm-top is the header's height, set in the script). */
.mm-top{position:sticky;top:var(--mm-top,0px);z-index:15;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 0;margin:0 0 6px}
.mm-how b{color:var(--text)}
.mm-sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden}
.mm-sh{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none}
.mm-sh h2{font-size:16px;margin:0;flex:1;font-family:inherit;font-weight:700}
.mm-cnt{font-size:12px;color:var(--muted)}
.mm-chev{width:16px;color:var(--muted);transition:transform .15s;display:inline-block;text-align:center}
.mm-sec.open .mm-chev{transform:rotate(90deg)}
.mm-body{display:none;border-top:1px solid var(--border);padding:6px 14px 14px}
.mm-sec.open .mm-body{display:block}
.mm-mini{font:inherit;font-size:12px;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:3px 9px;cursor:pointer;color:var(--muted);min-height:28px}
.mm-mini:hover:not(:disabled){border-color:var(--text);color:var(--text)}
.mm-mini:disabled{opacity:.35;cursor:default}
.mm-sub{margin-top:12px}
.mm-subh{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.mm-subh h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;flex:1;font-family:inherit;font-weight:700}
.mm-loose{font-size:12px;color:var(--muted);margin:10px 0 4px}
.mm-body ul{list-style:none;margin:0;padding:0;min-height:12px;border-radius:10px}
.mm-body ul.over{outline:2px dashed var(--text);outline-offset:2px;background:color-mix(in srgb,var(--text) 6%,transparent)}
.mm-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--bg);cursor:grab}
.mm-row.drag{opacity:.4}
.mm-grip{color:var(--muted);letter-spacing:-2px;font-size:14px}
.mm-nm{flex:1;min-width:0;font-size:14px}
/* Kate, 9 Nov 2026: a page's name is a real link: click opens it in a new tab, and right-click, Ctrl-click and middle-click work as on any link. Drag still moves the row. */
.mm-nm a{color:inherit;text-decoration:none}
.mm-nm a:hover{text-decoration:underline}
/* Kate, 9 Nov 2026: hover a page (mouse) or press and hold it (phone) and a pill floats over it: Open in a new tab. */
.mm-row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.mm-float{position:fixed;z-index:40;display:none;font:inherit;font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px;background:var(--text);color:var(--bg);text-decoration:none;white-space:nowrap;box-shadow:0 8px 20px -8px rgba(0,0,0,.45)}
.mm-float.on{display:block}
.mm-row.moved{background:color-mix(in srgb,var(--accent-butter) 30%,var(--surface));border-color:transparent}
.mm-tag{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--surface);color:var(--muted);white-space:nowrap}
.mm-empty{font-size:13px;color:var(--muted);padding:8px 10px;border:1px dashed var(--border);border-radius:10px;margin-bottom:6px}
.mm-add{margin-top:10px}
/* Kate, 9 Nov 2026: the List / Grid toggle from the Tools door (KB.view, hub.js; V flips it, one choice kept for every page that has it). List is the default here; Grid lays each list's pages out as tiles. */
body[data-kb-view="grid"] .mm-body ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
body[data-kb-view="grid"] .mm-body ul .mm-empty{grid-column:1/-1;margin:0}
body[data-kb-view="grid"] .mm-row{position:relative;flex-direction:column;align-items:flex-start;gap:8px;min-height:92px;margin:0;padding:12px 12px 10px}
body[data-kb-view="grid"] .mm-row .mm-grip{position:absolute;top:8px;right:10px}
body[data-kb-view="grid"] .mm-row .mm-nm{flex:none;width:100%;padding-right:22px;overflow-wrap:anywhere}
body[data-kb-view="grid"] .mm-row .mm-mini{margin-top:auto;align-self:flex-end}
.mm-top .kb-vt{flex:none}
/* Grid at the menu level too: each closed section is a tile (name, page count, arrows); an open one takes the full row and shows its pages as tiles. */
body[data-kb-view="grid"] .mm-col{max-width:1240px}
body[data-kb-view="grid"] #mmApp{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;align-items:start}
body[data-kb-view="grid"] .mm-sec{margin-bottom:0}
body[data-kb-view="grid"] .mm-sec.open{grid-column:1/-1}
body[data-kb-view="grid"] .mm-sec:not(.open){aspect-ratio:1/1}
body[data-kb-view="grid"] .mm-sec:not(.open) .mm-sh{flex-wrap:wrap;align-content:space-between;height:100%;box-sizing:border-box;padding:18px;gap:10px 8px}
body[data-kb-view="grid"] .mm-sec:not(.open) .mm-chev{display:none}
body[data-kb-view="grid"] .mm-sec:not(.open) .mm-sh h2{flex:1 1 100%;font-size:19px}
body[data-kb-view="grid"] .mm-sec:not(.open) .mm-sh .mm-cnt{flex:1}
body[data-kb-view="grid"] .mm-sec:not(.open):hover{border-color:var(--muted)}
body[data-kb-view="grid"] .mm-addsec{margin-top:0;aspect-ratio:1/1;width:100%;height:auto;border-radius:14px}
/* Kate, 9 Nov 2026: + New section, under the last section. A section you add is yours (c: 1 in the layout): it can be renamed, and removed while it is empty. */
.mm-addsec{display:block;width:100%;margin-top:4px;padding:12px;border:1px dashed var(--border);border-radius:14px;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.mm-addsec:hover{border-color:var(--text);color:var(--text)}
.mm-mine{font-size:11px;border-radius:999px;padding:1px 8px;background:color-mix(in srgb,var(--accent-butter) 30%,var(--surface));color:var(--text);white-space:nowrap}
.mm-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -8px 24px -12px rgba(0,0,0,.25);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.mm-bar-in{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.mm-msg{flex:1 1 200px;font-size:14px}
.mm-msg.err{color:#B3402A;font-weight:600}
.mm-btn{font:inherit;font-size:13px;font-weight:600;padding:8px 16px;min-height:40px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
.mm-btn:hover:not(:disabled){border-color:var(--text)}
.mm-btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.mm-btn:disabled{opacity:.4;cursor:default}
.mm-dlg{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);padding:20px;width:min(380px,92vw)}
.mm-dlg::backdrop{background:rgba(0,0,0,.4)}
.mm-dlg h4{margin:0 0 12px;font-size:16px}
.mm-dlg label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
/* Kate, 9 Nov 2026: the Section and Sub-section lists are the site's soft pill menu (assets/pill-select.js), not the browser's square list. The pill fills the box. */
.mm-dlg .ps{display:flex;width:100%}
.mm-dlg .ps-menu{max-height:260px}
.mm-dnew{margin-top:6px}
.mm-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
/* Kate, 12 Nov 2026: a search box in the bar under the page header. Type part of a page, section or sub-section name and only the matches stay; sections with a match open by themselves, the rest hide. */
.mm-search{flex:1 1 220px;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:0 14px;min-height:40px;color:var(--muted)}
.mm-search:focus-within{border-color:var(--text);color:var(--text)}
.mm-search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:14px;color:var(--text);padding:8px 0}
.mm-search input::-webkit-search-cancel-button{cursor:pointer}
.mm-hide{display:none!important}
.mm-sec.mm-force .mm-body{display:block}
.mm-sec.mm-force .mm-chev{transform:rotate(90deg)}
body[data-kb-view="grid"] .mm-sec.mm-force{grid-column:1/-1}
body[data-kb-view="grid"] .mm-sec.mm-force:not(.open){aspect-ratio:auto}
body[data-kb-view="grid"] .mm-sec.mm-force:not(.open) .mm-sh{height:auto;padding:12px 14px;flex-wrap:nowrap}
body[data-kb-view="grid"] .mm-sec.mm-force:not(.open) .mm-chev{display:inline-block}
body[data-kb-view="grid"] .mm-sec.mm-force:not(.open) .mm-sh h2{flex:1;font-size:16px}
.mm-nomatch{font-size:14px;color:var(--muted);padding:18px 4px}
@media(max-width:480px){.mm-tag{display:none}}
</style>
</head>
<body class="kb-wait">
<header class="kb-head" id="kbHead" data-title="Team Home"></header>
<main id="kbMain"><p class="kb-msg">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js?v=3823f956"></script>
<script src="/assets/theme-fade.js"></script>
<script src="/js/pages.js?v=1cb85cc2"></script>
<script src="/js/nav-layout.js?v=14cd1d3a"></script>
<script src="/hub/hub.js?v=9bf328c3"></script>
<script src="/js/visits.js?v=e33b3a0d"></script>
<script src="/assets/pill-select.js?v=7bd2fc3a"></script>
<script>
(function () {
  var main = document.getElementById('kbMain');
  // DEF is what "Original order" goes back to: the site's own menu (TRUEDEF), or, once Kate has pressed Make this the original, the arrangement she made it (BASE).
  var TRUEDEF = [], BASE = null, DEF = [], SAVED = [], CUR = [], UNITS = {}, PLACE = {}, open = {}, dragged = null, moving = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function canonTree(t) { return trsNav.canon(trsNav.treeToLayout(t)); }
  function place(t) {
    var m = {};
    t.forEach(function (g) { g.loose.forEach(function (k) { m[k] = g.n + '|'; }); g.subs.forEach(function (s) { s.p.forEach(function (k) { m[k] = g.n + '|' + s.n; }); }); });
    return m;
  }
  function where(k) { var a = k.split('|'); return a[1] ? a[0] + ' › ' + a[1] : a[0]; }
  function label(k) { return UNITS[k] ? UNITS[k].label : k; }
  function $(s) { return document.querySelector(s); }
  function group(n) { return CUR.filter(function (g) { return g.n === n; })[0]; }
  function subOf(g, n) { return g.subs.filter(function (s) { return s.n === n; })[0]; }
  // Kate, 12 Nov 2026: any section or sub-section can be renamed. `n` stays the original name (the key the layout matches on); `l` is the name shown.
  function gl(g) { return g.l || g.n; }
  function sl(s) { return s.l || s.n; }
  function swap(a, i, j) { var t = a[i]; a[i] = a[j]; a[j] = t; }
  function say(t, err) { var el = $('#mmMsg'); if (el) { el.textContent = t; el.className = 'mm-msg' + (err ? ' err' : ''); } }

  function nameLink(k) {
    var h = UNITS[k] && UNITS[k].els[0] && UNITS[k].els[0].getAttribute('href');
    return h ? '<a href="' + esc(h) + '" target="_blank" rel="noopener" draggable="false">' + esc(label(k)) + '</a>' : esc(label(k));
  }
  function row(k, cur) {
    var mv = cur !== PLACE[k], kids = UNITS[k] ? UNITS[k].els.length - 1 : 0;
    return '<li class="mm-row' + (mv ? ' moved' : '') + '" draggable="true" data-k="' + esc(k) + '"><span class="mm-grip" aria-hidden="true">⋮⋮</span><span class="mm-nm">' + nameLink(k) +
      (kids ? ' <span class="mm-cnt">(+' + kids + ' inside)</span>' : '') + '</span>' +
      (mv ? '<span class="mm-tag">was ' + esc(where(PLACE[k] || '')) + '</span>' : '') +
      '<button type="button" class="mm-mini" data-act="move" data-k="' + esc(k) + '" aria-label="Move ' + esc(label(k)) + '">Move</button></li>';
  }
  function list(arr, g, s) {
    var cur = g + '|' + (s || '');
    return '<ul data-g="' + esc(g) + '" data-s="' + esc(s || '') + '">' + (arr.length ? arr.map(function (k) { return row(k, cur); }).join('') : '<div class="mm-empty">Nothing here. Drop a page.</div>') + '</ul>';
  }
  function draw() {
    $('#mmApp').innerHTML = CUR.map(function (g, gi) {
      var total = g.loose.length + g.subs.reduce(function (a, s) { return a + s.p.length; }, 0);
      return '<section class="mm-sec' + (open[g.n] ? ' open' : '') + '" data-g="' + esc(g.n) + '">' +
        '<div class="mm-sh" data-act="toggle" data-g="' + esc(g.n) + '"><span class="mm-chev" aria-hidden="true">›</span><h2>' + esc(gl(g)) + '</h2><span class="mm-cnt">' + total + ' pages</span>' +
        (g.c ? '<span class="mm-mine">Yours</span>' : '') + '<button type="button" class="mm-mini" data-act="gren" data-i="' + gi + '">Rename</button>' + (g.c && !total ? '<button type="button" class="mm-mini" data-act="gdel" data-i="' + gi + '">Remove</button>' : '') +
        '<button type="button" class="mm-mini" data-act="gup" data-i="' + gi + '"' + (gi === 0 ? ' disabled' : '') + ' aria-label="Move ' + esc(gl(g)) + ' up">▲</button>' +
        '<button type="button" class="mm-mini" data-act="gdn" data-i="' + gi + '"' + (gi === CUR.length - 1 ? ' disabled' : '') + ' aria-label="Move ' + esc(gl(g)) + ' down">▼</button></div>' +
        '<div class="mm-body">' +
        (g.subs.length ? '<div class="mm-loose">Straight under ' + esc(gl(g)) + ' (no sub-section)</div>' : '') +
        list(g.loose, g.n, '') +
        g.subs.map(function (s, si) {
          return '<div class="mm-sub"><div class="mm-subh"><h3>' + esc(sl(s)) + '</h3>' +
            '<button type="button" class="mm-mini" data-act="sup" data-g="' + esc(g.n) + '" data-i="' + si + '"' + (si === 0 ? ' disabled' : '') + ' aria-label="Move ' + esc(sl(s)) + ' up">▲</button>' +
            '<button type="button" class="mm-mini" data-act="sdn" data-g="' + esc(g.n) + '" data-i="' + si + '"' + (si === g.subs.length - 1 ? ' disabled' : '') + ' aria-label="Move ' + esc(sl(s)) + ' down">▼</button>' +
            '<button type="button" class="mm-mini" data-act="sren" data-g="' + esc(g.n) + '" data-i="' + si + '">Rename</button>' +
            (s.p.length ? '' : '<button type="button" class="mm-mini" data-act="sdel" data-g="' + esc(g.n) + '" data-i="' + si + '">Remove</button>') +
            '</div>' + list(s.p, g.n, s.n) + '</div>';
        }).join('') +
        '<button type="button" class="mm-mini mm-add" data-act="sadd" data-g="' + esc(g.n) + '">+ New sub-section</button></div></section>';
    }).join('') + '<button type="button" class="mm-addsec" data-act="gadd">+ New section</button>';
    paintBar();
    var anyOpen = CUR.some(function (g) { return open[g.n]; }), ab = $('#mmAll');
    if (ab) ab.textContent = anyOpen ? 'Collapse all' : 'Expand all';
    applyFilter();
  }
  // Kate, 12 Nov 2026: search. Runs after every draw(). A section or sub-section whose own name matches shows all its pages; otherwise only the pages whose name matches stay.
  var Q = '';
  function applyFilter() {
    var q = Q.trim().toLowerCase(), app = $('#mmApp'); if (!app) return;
    var old = app.querySelector('.mm-nomatch'); if (old) old.remove();
    var all = app.querySelectorAll('.mm-hide'); Array.prototype.forEach.call(all, function (x) { x.classList.remove('mm-hide'); });
    Array.prototype.forEach.call(app.querySelectorAll('.mm-force'), function (x) { x.classList.remove('mm-force'); });
    if (!q) return;
    var any = false;
    Array.prototype.forEach.call(app.querySelectorAll('.mm-sec'), function (sec) {
      var gm = ((sec.querySelector('h2') || {}).textContent || sec.dataset.g).toLowerCase().indexOf(q) > -1, hits = 0;
      var loose = sec.querySelector('.mm-loose'), looseUl = sec.querySelector('.mm-body > ul');
      Array.prototype.forEach.call(sec.querySelectorAll('.mm-row'), function (r) {
        var ok = gm || label(r.dataset.k).toLowerCase().indexOf(q) > -1;
        r.classList.toggle('mm-hide', !ok); if (ok) hits++;
      });
      Array.prototype.forEach.call(sec.querySelectorAll('.mm-sub'), function (sub) {
        var sn = (sub.querySelector('h3').textContent || '').toLowerCase(), sm = sn.indexOf(q) > -1, n = 0;
        Array.prototype.forEach.call(sub.querySelectorAll('.mm-row'), function (r) { if (sm) r.classList.remove('mm-hide'); if (!r.classList.contains('mm-hide')) n++; });
        if (sm && !gm) hits += n;
        sub.classList.toggle('mm-hide', !n);
      });
      // empty-list notes, the add buttons and the "straight under" caption are noise while searching
      Array.prototype.forEach.call(sec.querySelectorAll('.mm-empty,.mm-add'), function (x) { x.classList.add('mm-hide'); });
      var looseVisible = looseUl && looseUl.querySelector('.mm-row:not(.mm-hide)');
      if (loose) loose.classList.toggle('mm-hide', !looseVisible);
      if (looseUl) looseUl.classList.toggle('mm-hide', !looseVisible);
      var show = hits > 0 || gm;
      sec.classList.toggle('mm-hide', !show);
      if (show) { any = true; sec.classList.add('mm-force'); }
    });
    var add = app.querySelector('.mm-addsec'); if (add) add.classList.add('mm-hide');
    if (!any) { var p = document.createElement('p'); p.className = 'mm-nomatch'; p.textContent = 'No page matches “' + Q.trim() + '”.'; app.appendChild(p); }
  }
  function paintBar(note) {
    var dirty = canonTree(CUR) !== canonTree(SAVED), cur = place(CUR), n = Object.keys(cur).filter(function (k) { return cur[k] !== PLACE[k]; }).length;
    var differs = canonTree(CUR) !== canonTree(DEF);
    $('#mmSave').disabled = !dirty;
    $('#mmUndo').disabled = !dirty;
    $('#mmOrig').disabled = !differs;
    $('#mmMake').disabled = !differs;
    $('#mmFactory').hidden = !BASE;
    if (note) return;
    say(dirty ? 'Not saved yet' + (n ? ': ' + n + ' page' + (n === 1 ? '' : 's') + ' in a new place' : '') : (differs ? 'Saved. ' + (n ? n + ' page' + (n === 1 ? ' sits' : 's sit') + ' somewhere new.' : 'Order changed.') : 'Your menu is the original.'));
  }
  function take(k) { CUR.forEach(function (g) { g.loose = g.loose.filter(function (x) { return x !== k; }); g.subs.forEach(function (s) { s.p = s.p.filter(function (x) { return x !== k; }); }); }); }
  function put(k, gn, sn, idx) {
    var g = group(gn), arr = sn ? subOf(g, sn).p : g.loose;
    arr.splice(idx == null ? arr.length : idx, 0, k);
  }
  function groupTaken(n, except) { var q = n.toLowerCase(); return CUR.some(function (g) { return g !== except && (g.n.toLowerCase() === q || gl(g).toLowerCase() === q); }); }
  function addSection() {
    var gv = prompt('Name of the new section');
    if (!gv || !gv.trim()) return null;
    gv = gv.trim().slice(0, 40);
    if (groupTaken(gv)) { alert('There is already a section called ' + gv + '.'); return null; }
    CUR.push({ n: gv, loose: [], subs: [], c: 1 }); open[gv] = true;
    return gv;
  }
  function nameTaken(g, n, except) { var q = n.toLowerCase(); return g.subs.some(function (s) { return s !== except && (s.n.toLowerCase() === q || sl(s).toLowerCase() === q); }); }

  function fillSubs() {
    var g = group($('#mmDsec').value);
    $('#mmDsub').innerHTML = '<option value="">None (straight under the section)</option>' + g.subs.map(function (s) { return '<option value="' + esc(s.n) + '">' + esc(sl(s)) + '</option>'; }).join('');
  }
  function openDlg(k) {
    moving = k;
    $('#mmDtitle').textContent = 'Move “' + label(k) + '”';
    $('#mmDsec').innerHTML = CUR.map(function (g) { return '<option value="' + esc(g.n) + '">' + esc(gl(g)) + '</option>'; }).join('');
    var c = place(CUR)[k].split('|');
    $('#mmDsec').value = c[0]; fillSubs(); $('#mmDsub').value = c[1] || '';
    $('#mmDlg').showModal();
  }

  async function save() {
    var btn = $('#mmSave'); btn.disabled = true;
    var isOriginal = !BASE && canonTree(CUR) === canonTree(TRUEDEF);
    var layout = isOriginal ? null : trsNav.treeToLayout(CUR);
    if (layout && BASE) layout.base = BASE;
    var r = await KB.client.rpc('nav_layout_set', { p_layout: layout });
    if (r.error) { say('Not saved: ' + (r.error.message || 'try again') + '.', true); btn.disabled = false; return; }
    try { if (layout) localStorage.setItem(trsNav.CACHE, trsNav.canon(layout)); else localStorage.removeItem(trsNav.CACHE); } catch (e) {}
    SAVED = clone(CUR);
    paintBar();
    say(isOriginal ? 'Saved. Your menu is back to the original.' : 'Saved. Open the dashboard and your menu is in this order.');
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act]');
    if (!b || !$('#mmApp') || !$('#mmApp').contains(b)) return;
    var a = b.dataset.act, i = +b.dataset.i, g = b.dataset.g && group(b.dataset.g);
    if (a === 'toggle') { if (e.target.closest('button')) return; open[b.dataset.g] = !open[b.dataset.g]; }
    else if (a === 'gup') swap(CUR, i, i - 1);
    else if (a === 'gdn') swap(CUR, i, i + 1);
    else if (a === 'gadd') {
      if (!addSection()) return;
    }
    else if (a === 'gren') {
      var cg = CUR[i], rv = prompt('Rename section' + (cg.c ? '' : ' (leave it empty to go back to “' + cg.n + '”)'), gl(cg));
      if (rv === null) return;
      rv = rv.trim().slice(0, 40);
      if (!rv || rv === cg.n) delete cg.l;
      else { if (groupTaken(rv, cg)) { alert('There is already a section called ' + rv + '.'); return; } cg.l = rv; }
    }
    else if (a === 'gdel') CUR.splice(i, 1);
    else if (a === 'sup') swap(g.subs, i, i - 1);
    else if (a === 'sdn') swap(g.subs, i, i + 1);
    else if (a === 'sren') {
      var cs = g.subs[i], v = prompt('Rename sub-section' + ' (leave it empty to go back to “' + cs.n + '”)', sl(cs));
      if (v === null) return;
      v = v.trim().slice(0, 40);
      if (!v || v === cs.n) delete cs.l;
      else { if (nameTaken(g, v, cs)) { alert('There is already a sub-section called ' + v + ' in ' + gl(g) + '.'); return; } cs.l = v; }
    }
    else if (a === 'sdel') g.subs.splice(i, 1);
    else if (a === 'sadd') {
      var nv = prompt('Name of the new sub-section');
      if (nv && nv.trim()) { nv = nv.trim().slice(0, 40); if (nameTaken(g, nv)) { alert('There is already a sub-section called ' + nv + ' in ' + gl(g) + '.'); return; } g.subs.push({ n: nv, p: [] }); open[g.n] = true; }
    }
    else if (a === 'move') { openDlg(b.dataset.k); return; }
    draw();
  });
  // The floating pill. A mouse hovering a page, or a finger held on it for half a second, shows "Open in a new tab" just above the row.
  var pill = null, pillT = null, lpT = null, longAt = 0;
  function hrefOf(k) { return UNITS[k] && UNITS[k].els[0] && UNITS[k].els[0].getAttribute('href'); }
  function hidePill() { clearTimeout(pillT); if (pill) pill.classList.remove('on'); }
  function hidePillSoon() { clearTimeout(pillT); pillT = setTimeout(hidePill, 220); }
  function showPill(r) {
    var h = hrefOf(r.dataset.k); if (!h) return;
    if (!pill) {
      pill = document.createElement('a'); pill.className = 'mm-float'; pill.target = '_blank'; pill.rel = 'noopener'; pill.textContent = 'Open in a new tab ↗';
      pill.addEventListener('mouseenter', function () { clearTimeout(pillT); });
      pill.addEventListener('mouseleave', hidePillSoon);
      pill.addEventListener('click', function () { setTimeout(hidePill, 50); });
      document.body.appendChild(pill);
    }
    clearTimeout(pillT);
    pill.href = h; pill.classList.add('on');
    var b = r.getBoundingClientRect();
    pill.style.left = Math.max(8, Math.min(b.left + 30, window.innerWidth - pill.offsetWidth - 8)) + 'px';
    pill.style.top = Math.max(8, b.top - pill.offsetHeight + 4) + 'px';
  }
  document.addEventListener('pointerover', function (e) {
    if (e.pointerType !== 'mouse' || dragged) return;
    var r = e.target.closest && e.target.closest('.mm-row'); if (r) showPill(r);
  });
  document.addEventListener('pointerout', function (e) {
    if (e.pointerType !== 'mouse') return;
    if (e.target.closest && e.target.closest('.mm-row')) hidePillSoon();
  });
  document.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse') return;
    clearTimeout(lpT);
    var r = e.target.closest && e.target.closest('.mm-row');
    if (r && !e.target.closest('button')) lpT = setTimeout(function () { longAt = Date.now(); showPill(r); }, 450);
    else if (!(pill && pill.contains(e.target))) hidePill();
  });
  ['pointerup', 'pointercancel', 'pointermove'].forEach(function (t) { document.addEventListener(t, function (e) { if (e.pointerType !== 'mouse' && (t !== 'pointermove' || Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0) > 8)) clearTimeout(lpT); }); });
  document.addEventListener('contextmenu', function (e) { if (Date.now() - longAt < 1500 && e.target.closest && e.target.closest('.mm-row')) e.preventDefault(); });
  window.addEventListener('scroll', hidePill, { passive: true });
  // Drag and drop (a mouse or trackpad; on a phone use the Move button). A closed section opens when a page is held over its title.
  document.addEventListener('dragstart', function (e) {
    var r = e.target.closest && e.target.closest('.mm-row'); if (!r) return;
    hidePill(); dragged = r.dataset.k; r.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragged);
  });
  document.addEventListener('dragend', function () { dragged = null; Array.prototype.forEach.call(document.querySelectorAll('.over,.drag'), function (x) { x.classList.remove('over', 'drag'); }); });
  document.addEventListener('dragover', function (e) {
    if (!dragged) return;
    var h = e.target.closest && e.target.closest('.mm-sh');
    if (h && !open[h.dataset.g]) { open[h.dataset.g] = true; h.parentElement.classList.add('open'); }
    var u = e.target.closest && e.target.closest('.mm-body ul');
    Array.prototype.forEach.call(document.querySelectorAll('ul.over'), function (x) { if (x !== u) x.classList.remove('over'); });
    if (u) { e.preventDefault(); u.classList.add('over'); }
  });
  document.addEventListener('drop', function (e) {
    var u = e.target.closest && e.target.closest('.mm-body ul'); if (!u || !dragged) return;
    e.preventDefault();
    var rows = Array.prototype.slice.call(u.querySelectorAll('.mm-row:not(.drag)')), idx = rows.length;
    for (var i = 0; i < rows.length; i++) { if (rows[i].classList.contains('mm-hide')) continue; var r = rows[i].getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { idx = i; break; } }
    var k = dragged; take(k); put(k, u.dataset.g, u.dataset.s || '', idx); draw();
  });

  KB.ready.then(async function () {
    // Level 5 only, and not while "View as" is on: previewing another level must not let that level change a menu.
    if (KB.realLevel !== 5 || KB.viewAs) {
      main.innerHTML = '<p class="kb-msg">This page is for Kate only' + (KB.viewAs ? ' (switch View as back to Level 6)' : '') + '.</p>';
      return;
    }
    main.innerHTML =
      KB.titleIcon('menu-mover', 'Rearrange Menu') +
      '<p class="kb-meta">Your dashboard menu, as it is now. Change where things sit, then save. Only your menu changes: nobody else sees it, and who may open each page stays exactly as it is.</p>' +
      '<div class="mm-col"><div class="mm-top"><div class="mm-how"><span><b>Drag</b> a page into another list</span><span><b>Move</b> button if the section is closed, or on a phone</span><span><b>▲ ▼</b> move a section or sub-section</span></div>' +
      '<label class="mm-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="mmSearch" placeholder="Search pages, sections…" autocomplete="off" aria-label="Search the menu"></label>' + (window.KB && KB.view ? KB.view.html() : '') + '<button type="button" class="mm-btn" id="mmAddSec">+ New section</button><button type="button" class="mm-btn" id="mmAll">Expand all</button></div>' +
      '<div id="mmApp"></div></div>' +
      '<div class="mm-bar"><div class="mm-bar-in"><div class="mm-msg" id="mmMsg" role="status" aria-live="polite">Loading…</div>' +
      '<button type="button" class="mm-btn" id="mmMake" title="Use this arrangement as your original: Original order will come back to it, and the was-tags start from it">Make this the original</button>' +
      '<button type="button" class="mm-btn" id="mmFactory" hidden title="Forget your own original and go back to the standard menu">Site menu</button>' +
      '<button type="button" class="mm-btn" id="mmOrig" title="Load the original menu into the editor, then Save">Original order</button>' +
      '<button type="button" class="mm-btn" id="mmUndo">Undo changes</button>' +
      '<button type="button" class="mm-btn pri" id="mmSave">Save</button></div></div>' +
      '<dialog class="mm-dlg" id="mmDlg"><h4 id="mmDtitle">Move</h4><label for="mmDsec">Section</label><select id="mmDsec"></select><button type="button" class="mm-mini mm-dnew" id="mmDnewSec">+ New section</button>' +
      '<label for="mmDsub">Sub-section</label><select id="mmDsub"></select><button type="button" class="mm-mini mm-dnew" id="mmDnewSub">+ New sub-section</button><div class="mm-acts"><button type="button" class="mm-btn" id="mmDno">Cancel</button><button type="button" class="mm-btn pri" id="mmDyes">Move</button></div></dialog>';
    if (KB.view) KB.view.init('list');
    ['mmSave', 'mmUndo', 'mmOrig', 'mmMake'].forEach(function (id) { document.getElementById(id).disabled = true; });
    try {
      // The original menu is whatever the dashboard's own page draws, read from it, so a page added to the menu later appears here by itself.
      var html = await (await fetch('/', { credentials: 'same-origin' })).text();
      var side = new DOMParser().parseFromString(html, 'text/html').querySelector('aside.sidebar');
      if (!side) throw new Error('menu not found');
      var ext = trsNav.extract(side);
      TRUEDEF = ext.tree; UNITS = ext.units;
      var r = await KB.client.rpc('nav_layout_get');
      if (r.error) throw r.error;
      BASE = r.data && r.data.base && r.data.base.groups ? { v: 1, groups: r.data.base.groups } : null;
      DEF = BASE ? trsNav.merge(clone(TRUEDEF), BASE) : clone(TRUEDEF); PLACE = place(DEF);
      SAVED = trsNav.merge(clone(TRUEDEF), r.data); CUR = clone(SAVED);
      open = {};   // Kate, 9 Nov 2026: every section starts closed; she opens what she wants
    } catch (err) {
      say('Could not load the menu: ' + ((err && err.message) || 'try again') + '.', true);
      return;
    }
    $('#mmDsec').addEventListener('change', fillSubs);
    $('#mmDno').addEventListener('click', function () { $('#mmDlg').close(); });
    $('#mmDyes').addEventListener('click', function () {
      take(moving); put(moving, $('#mmDsec').value, $('#mmDsub').value); open[$('#mmDsec').value] = true; $('#mmDlg').close(); draw();
    });
    $('#mmAddSec').addEventListener('click', function () { if (addSection()) { draw(); window.scrollTo(0, document.body.scrollHeight); } });
    // Inside the Move dialog too: make the section or sub-section you want, and it is chosen for you.
    function fillSecs(pick) {
      $('#mmDsec').innerHTML = CUR.map(function (g) { return '<option value="' + esc(g.n) + '">' + esc(gl(g)) + '</option>'; }).join('');
      $('#mmDsec').value = pick; fillSubs();
    }
    $('#mmDnewSec').addEventListener('click', function () { var n = addSection(); if (n) { draw(); fillSecs(n); } });
    $('#mmDnewSub').addEventListener('click', function () {
      var g = group($('#mmDsec').value), nv = prompt('Name of the new sub-section in ' + gl(g));
      if (!nv || !nv.trim()) return;
      nv = nv.trim().slice(0, 40);
      if (nameTaken(g, nv)) { alert('There is already a sub-section called ' + nv + ' in ' + gl(g) + '.'); return; }
      g.subs.push({ n: nv, p: [] }); open[g.n] = true; draw(); fillSubs(); $('#mmDsub').value = nv;
    });
    $('#mmAll').addEventListener('click', function () {
      var anyOpen = CUR.some(function (g) { return open[g.n]; });
      CUR.forEach(function (g) { open[g.n] = !anyOpen; });
      draw();
    });
    // The toggle bar sits just under the sticky page header, whatever height the header is (it condenses on scroll).
    var head = document.getElementById('kbHead');
    function stick() { document.documentElement.style.setProperty('--mm-top', (head ? head.offsetHeight : 0) + 'px'); }
    stick(); window.addEventListener('resize', stick); window.addEventListener('scroll', stick, { passive: true });
    $('#mmSearch').addEventListener('input', function () { Q = this.value; applyFilter(); });
    $('#mmSearch').addEventListener('keydown', function (e) { if (e.key === 'Escape') { this.value = ''; Q = ''; applyFilter(); } });
    $('#mmSave').addEventListener('click', save);
    $('#mmUndo').addEventListener('click', function () { CUR = clone(SAVED); draw(); });
    $('#mmOrig').addEventListener('click', function () { CUR = clone(DEF); draw(); });
    // Kate, 9 Nov 2026: "make new arrangement the original order". The arrangement on screen becomes the one Original order returns to (saved with the menu), and the was-tags count from it.
    $('#mmMake').addEventListener('click', async function () {
      if (!confirm('Make this arrangement your original order? Original order will come back to it. Your menu is saved now.')) return;
      BASE = trsNav.treeToLayout(CUR); DEF = trsNav.merge(clone(TRUEDEF), BASE); PLACE = place(DEF);
      await save(); draw(); say('Saved. This arrangement is now your original order.');
    });
    $('#mmFactory').addEventListener('click', function () {
      if (!confirm('Go back to the standard site menu? Your own original order is forgotten once you Save.')) return;
      BASE = null; DEF = clone(TRUEDEF); PLACE = place(DEF); CUR = clone(DEF); draw();
    });
    draw();
  });
})();
</script>
<!-- Kate, 9 Nov 2026: the notification bell, on every signed-in page. -->
<script src="/js/notifications.js?v=a52ed9df"></script>
