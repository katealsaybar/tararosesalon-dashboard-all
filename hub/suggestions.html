<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suggestions Box · Team Home</title>
<script>
  try { var t = localStorage.getItem('trs-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-96x96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon-96x96.png">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2D2E37" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub/hub.css?v=20261006hdr2">
</head>
<body class="kb-wait">
<!-- Suggestions box (Kate, 5 Oct 2026): everyone signed in can send one; Level 3 and up
     read them below the form. Saved and read through kb_suggest(), kb_suggestions() and
     kb_suggestion_mark() in Supabase (migrations/kb_suggestions.sql); the table itself
     answers to nobody. Without a name, nothing about the sender is saved.
     Replies (5 Oct 2026, migrations/kb_suggestion_replies.sql): kb_suggestion_reply()
     for Level 3+, read back through kb_my_suggestions(), by email or by private code.
     Attachments (5 Oct 2026, migrations/kb_suggestion_files.sql): private bucket
     kb-suggestion-files, Level 3+ opens them through signed links. -->
<div class="wrap">
  <header class="kb-head" id="kbHead" data-title="Team Home"></header>
  <main id="kbMain"><p class="kb-msg">Loading…</p></main>
  <footer class="kb-foot">For the Tara Rose Salons team only. <a href="/privacy/">Privacy</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=20261001kb"></script>
<script src="/hub/hub.js?v=20261006hdr"></script>
<script>
(function () {
  var main = document.getElementById('kbMain'), esc = KB.esc;
  if (/\.html$/.test(location.pathname)) history.replaceState(null, '', location.pathname.replace(/\.html$/, '') + location.search + location.hash);
  var TOPICS = ['Clients', 'Team', 'Salon & tools', 'Systems & admin', 'Other'];
  var STATUS = { 'new': 'New', seen: 'Seen', done: 'Done' };
  var list = [], f = { status: '', topic: '' };

  function when(ts) {
    try { return new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Dubai' }); }
    catch (e) { return ''; }
  }
  function opts(label, pairs) {
    return '<option value="">' + esc(label) + '</option>' + pairs.map(function (p) {
      return '<option value="' + esc(p[0]) + '">' + esc(p[1]) + '</option>';
    }).join('');
  }

  // ── The inbox, Level 3 and up (and not on "View as" below Level 3).
  function drawInbox() {
    var rows = list.filter(function (s) { return (!f.status || s.status === f.status) && (!f.topic || s.topic === f.topic); });
    var fresh = list.filter(function (s) { return s.status === 'new'; }).length;
    document.getElementById('sgCount').textContent = list.length + ' received' + (fresh ? ', ' + fresh + ' new' : '');
    document.getElementById('sgList').innerHTML = rows.length ? rows.map(function (s) {
      return '<li class="sg-item' + (s.status === 'new' ? ' is-new' : '') + '">' +
        '<div class="sg-top"><span class="sg-topic">' + esc(s.topic) + '</span>' +
          '<span class="sg-when">' + esc(when(s.created_at)) + '</span></div>' +
        '<p class="sg-body">' + esc(s.body) + '</p>' + filesBlock(s) +
        '<div class="sg-foot"><span class="sg-from">' + (s.sender_name ? 'From ' + esc(s.sender_name) : 'No name given') +
          (s.region === 'BAH' ? ', Bahrain' : '') + '</span>' +
          '<span class="sg-status" role="group" aria-label="Status">' +
          ['new', 'seen', 'done'].map(function (k) {
            return '<button type="button" data-id="' + s.id + '" data-s="' + k + '" aria-pressed="' + (s.status === k) + '">' + STATUS[k] + '</button>';
          }).join('') + '</span></div>' +
        (s.status !== 'new' && s.status_by ? '<div class="sg-by">' + STATUS[s.status] + ' by ' + esc(s.status_by) + ', ' + esc(when(s.status_at)) + '</div>' : '') +
        replyBlock(s) + '</li>';
    }).join('') : '<li class="sg-none">' + (list.length ? 'Nothing matches those filters.' : 'No suggestions yet.') + '</li>';
  }
  // Kate, 5 Oct 2026: Level 3+ answers here. The sender reads it on this page, under
  // "Your suggestions" (named) or with their private code (sent without a name).
  var editing = null;
  // Attachments (Kate, 5 Oct 2026): signed links from the private bucket, an hour each.
  var links = {};
  function filesBlock(s) {
    if (!s.files || !s.files.length) return '';
    return '<div class="sg-att">' + s.files.map(function (f, i) {
      var u = links[f];
      if (/\.pdf$/.test(f)) return u ? '<a class="sg-pdf" href="' + esc(u) + '" target="_blank" rel="noopener">PDF ' + (i + 1) + '</a>' : '<span class="sg-pdf">PDF ' + (i + 1) + '</span>';
      return u ? '<a class="sg-thumb" href="' + esc(u) + '" target="_blank" rel="noopener" aria-label="Photo ' + (i + 1) + '"><img src="' + esc(u) + '" alt="" loading="lazy"></a>'
               : '<span class="sg-thumb"></span>';
    }).join('') + '</div>';
  }
  async function signFiles() {
    var want = [];
    list.forEach(function (s) { (s.files || []).forEach(function (f) { if (!links[f]) want.push(f); }); });
    if (!want.length) return;
    var r = await KB.client.storage.from('kb-suggestion-files').createSignedUrls(want, 3600);
    (r.data || []).forEach(function (x) { if (x.signedUrl) links[x.path] = x.signedUrl; });
    drawInbox();
  }
  function replyBlock(s) {
    if (editing === s.id) return '<div class="sg-reply-edit"><label class="sg-label" for="sgR' + s.id + '">Your reply</label>' +
      '<textarea id="sgR' + s.id + '" rows="3" maxlength="2000" placeholder="What happens next? The sender reads this.">' + esc(s.reply || '') + '</textarea>' +
      '<div class="sg-actions"><button type="button" class="sg-send" data-save="' + s.id + '">Send reply</button>' +
      '<button type="button" class="sg-link" data-cancel="1">Cancel</button>' +
      (s.reply ? '<button type="button" class="sg-link" data-clear="' + s.id + '">Remove reply</button>' : '') + '</div></div>';
    if (s.reply) return '<div class="sg-reply"><span class="sg-reply-k">Reply from ' + esc(s.reply_by || 'the team') + ', ' + esc(when(s.reply_at)) + '</span>' +
      '<p>' + esc(s.reply) + '</p><button type="button" class="sg-link" data-edit="' + s.id + '">Edit reply</button></div>';
    return '<button type="button" class="sg-link sg-reply-btn" data-edit="' + s.id + '">Reply</button>' +
      (s.sender_name || s.has_code ? '' : '<span class="sg-hint-inline">The sender can’t see replies to this one.</span>');
  }
  async function loadInbox() {
    var r = await KB.client.rpc('kb_suggestions');
    if (r.error || !r.data) { document.getElementById('sgInbox').hidden = true; return; }
    list = r.data;
    drawInbox();
    signFiles();
  }

  KB.ready.then(function () {
    var reads = KB.level >= 3;
    main.innerHTML =
      '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p>' +
      KB.titleIcon('suggestions', 'Suggestions Box') +
      '<p class="kb-meta">An idea for our clients, the team or the salon? Tell us. Every suggestion is read by the management team.</p>' +
      '<form class="sg-form" id="sgForm">' +
        '<label class="sg-label" for="sgTopic">What is it about?</label>' +
        '<select id="sgTopic" aria-label="What is it about?">' + TOPICS.map(function (t) { return '<option value="' + esc(t) + '"' + (t === 'Other' ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select>' +
        '<label class="sg-label" for="sgBody">Your suggestion</label>' +
        '<textarea id="sgBody" rows="6" maxlength="2000" required placeholder="What would make it better, and why?"></textarea>' +
        '<div class="sg-files"><label class="sg-attach"><input type="file" id="sgFile" accept="image/*,application/pdf" multiple hidden>' +
          '<span>Attach photos or a PDF</span></label><span class="sg-hint-inline" id="sgFileHint">Up to 3 files.</span>' +
          '<ul class="sg-chosen" id="sgChosen"></ul></div>' +
        '<label class="sg-anon"><input type="checkbox" id="sgAnon"> Send without my name</label>' +
        '<p class="sg-hint" id="sgHint">Your name goes with it, so we can come back to you.</p>' +
        '<div class="sg-actions"><button type="submit" class="sg-send" id="sgSend">Send suggestion</button><span class="sg-msg" id="sgMsg" role="status"></span></div>' +
        '<div id="sgCodeShow" aria-live="polite"></div>' +
      '</form>' +
      '<section class="sg-mine"><h2 class="kb-section-title">Your suggestions</h2>' +
        '<ul class="sg-list" id="sgMine"><li class="sg-none">Loading…</li></ul>' +
        '<form class="sg-code" id="sgCodeForm"><label class="sg-label" for="sgCode">Sent one without your name? Enter its code to see the reply.</label>' +
          '<div class="sg-code-row"><input id="sgCode" autocomplete="off" spellcheck="false" placeholder="ABCDE-23456" maxlength="20">' +
          '<button type="submit" class="sg-send">Check</button></div><div id="sgCodeOut"></div></form></section>' +
      (reads ?
        '<section id="sgInbox" class="sg-inbox"><h2 class="kb-section-title">Suggestions received</h2>' +
          '<div class="rs-bar"><div class="rs-selects">' +
            '<select data-k="status" aria-label="Status">' + opts('Any status', [['new', 'New'], ['seen', 'Seen'], ['done', 'Done']]) + '</select>' +
            '<select data-k="topic" aria-label="Topic">' + opts('All topics', TOPICS.map(function (t) { return [t, t]; })) + '</select>' +
          '</div></div>' +
          '<div class="rs-status"><span id="sgCount"></span></div>' +
          '<ul class="sg-list" id="sgList"><li class="sg-none">Loading…</li></ul></section>' : '');

    KB.pillDD(document.getElementById('sgTopic'));
    var anon = document.getElementById('sgAnon'), hint = document.getElementById('sgHint');
    anon.addEventListener('change', function () {
      hint.textContent = anon.checked
        ? 'No name, email or account is saved with it, so nobody can tell who sent it. You get a private code instead, to read our reply here.'
        : 'Your name goes with it, so we can come back to you.';
    });
    // Chosen files. Photos are shrunk to 1600px and redrawn as a new JPEG, which drops
    // what the phone hid inside them (model, location). Without a name, photos only.
    var chosen = [], fileHint = document.getElementById('sgFileHint');
    function drawChosen() {
      document.getElementById('sgChosen').innerHTML = chosen.map(function (f, i) {
        return '<li><span>' + esc(f.name) + '</span><button type="button" class="sg-link" data-rm="' + i + '" aria-label="Remove ' + esc(f.name) + '">Remove</button></li>';
      }).join('');
      fileHint.textContent = anon.checked ? 'Up to 3 photos. PDFs can carry your name inside, so they go with named suggestions only.' : 'Up to 3 files.';
    }
    document.getElementById('sgFile').addEventListener('change', function (e) {
      var msg = document.getElementById('sgMsg'); msg.textContent = '';
      [].forEach.call(e.target.files, function (f) {
        var pdf = f.type === 'application/pdf', img = /^image\//.test(f.type);
        if (chosen.length >= 3) msg.textContent = 'Three files at most.';
        else if (!pdf && !img) msg.textContent = f.name + ' isn’t a photo or a PDF.';
        else if (pdf && f.size > 10485760) msg.textContent = f.name + ' is over 10 MB.';
        else if (img && f.size > 26214400) msg.textContent = f.name + ' is too big.';
        else chosen.push(f);
      });
      e.target.value = '';
      drawChosen();
    });
    document.getElementById('sgChosen').addEventListener('click', function (e) {
      var b = e.target.closest('[data-rm]');
      if (b) { chosen.splice(+b.dataset.rm, 1); drawChosen(); }
    });
    anon.addEventListener('change', drawChosen);
    async function toJpeg(f) {
      var bmp = await createImageBitmap(f, { imageOrientation: 'from-image' });
      var k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      var c = document.createElement('canvas');
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return new Promise(function (ok, no) { c.toBlob(function (b) { b ? ok(b) : no(new Error('jpeg')); }, 'image/jpeg', 0.82); });
    }
    async function upload() {
      var dir = 's/' + crypto.randomUUID() + '/', paths = [];
      for (var i = 0; i < chosen.length; i++) {
        var f = chosen[i], pdf = f.type === 'application/pdf';
        var blob = pdf ? f : await toJpeg(f), path = dir + (i + 1) + (pdf ? '.pdf' : '.jpg');
        var r = await KB.client.storage.from('kb-suggestion-files').upload(path, blob, { contentType: pdf ? 'application/pdf' : 'image/jpeg', upsert: false });
        if (r.error) throw r.error;
        paths.push(path);
      }
      return paths;
    }

    document.getElementById('sgForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var body = document.getElementById('sgBody'), send = document.getElementById('sgSend'), msg = document.getElementById('sgMsg');
      if (body.value.trim().length < 3) { msg.textContent = 'Write a little more first.'; body.focus(); return; }
      if (anon.checked && chosen.some(function (f) { return f.type === 'application/pdf'; })) { msg.textContent = 'Without your name, attach photos only (remove the PDF).'; return; }
      send.disabled = true; msg.textContent = chosen.length ? 'Uploading…' : 'Sending…';
      var files = [];
      try { files = await upload(); }
      catch (x) { send.disabled = false; msg.textContent = 'A file didn’t upload. Please try again.'; return; }
      msg.textContent = 'Sending…';
      var r = await KB.client.rpc('kb_suggest', { p_topic: document.getElementById('sgTopic').value, p_body: body.value, p_anon: anon.checked, p_files: files.length ? files : null });
      send.disabled = false;
      if (r.error) { msg.textContent = 'That didn’t send. Please try again.'; return; }
      body.value = ''; chosen = []; drawChosen();
      msg.textContent = 'Thank you, it’s in the box.';
      // Sent without a name: the private code, shown this once (only its hash is kept).
      var code = r.data && r.data.code;
      document.getElementById('sgCodeShow').innerHTML = code ?
        '<div class="sg-codebox"><span class="sg-reply-k">Your private code</span><b>' + esc(code) + '</b>' +
        '<button type="button" class="sg-link" id="sgCopy">Copy</button>' +
        '<p>Keep it somewhere safe. It is the only way to read our reply, and we can’t show it again or tell whose it is.</p></div>' : '';
      var cp = document.getElementById('sgCopy');
      if (cp) cp.onclick = function () { try { navigator.clipboard.writeText(code); cp.textContent = 'Copied'; } catch (x) {} };
      if (!code) loadMine();
      if (reads) loadInbox();
    });

    function mineItem(s) {
      return '<li class="sg-item"><div class="sg-top"><span class="sg-topic">' + esc(s.topic) + '</span><span class="sg-when">' + esc(when(s.created_at)) + '</span></div>' +
        '<p class="sg-body">' + esc(s.body) + '</p>' +
        (s.reply ? '<div class="sg-reply"><span class="sg-reply-k">Reply from ' + esc(s.reply_by || 'the team') + ', ' + esc(when(s.reply_at)) + '</span><p>' + esc(s.reply) + '</p></div>'
                 : '<div class="sg-by">' + (s.status === 'new' ? 'Not read yet' : s.status === 'done' ? 'Done' : 'Read, no reply yet') + '</div>') + '</li>';
    }
    async function loadMine() {
      var r = await KB.client.rpc('kb_my_suggestions');
      var rows = (!r.error && r.data) || [];
      document.getElementById('sgMine').innerHTML = rows.length ? rows.map(mineItem).join('')
        : '<li class="sg-none">Nothing sent with your name yet.</li>';
    }
    document.getElementById('sgCodeForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var v = document.getElementById('sgCode').value.trim(), out = document.getElementById('sgCodeOut');
      if (!v) return;
      var r = await KB.client.rpc('kb_my_suggestions', { p_code: v });
      var rows = (!r.error && r.data) || [];
      out.innerHTML = rows.length ? '<ul class="sg-list">' + rows.map(mineItem).join('') + '</ul>'
        : '<p class="sg-hint-inline">No suggestion has that code. Check it and try again.</p>';
    });
    loadMine();

    if (!reads) return;
    main.querySelectorAll('.sg-inbox select').forEach(function (sel) {
      KB.pillDD(sel);
      sel.addEventListener('change', function () { f[sel.dataset.k] = sel.value; drawInbox(); });
    });
    document.getElementById('sgList').addEventListener('click', async function (e) {
      var ed = e.target.closest('[data-edit]'), sv = e.target.closest('[data-save]'), cl = e.target.closest('[data-clear]');
      if (e.target.closest('[data-cancel]')) { editing = null; drawInbox(); return; }
      if (ed) { editing = +ed.dataset.edit; drawInbox(); var ta = document.getElementById('sgR' + editing); if (ta) ta.focus(); return; }
      if (sv || cl) {
        var btn = sv || cl, id = +(sv ? sv.dataset.save : cl.dataset.clear), txt = sv ? document.getElementById('sgR' + id).value : '';
        if (sv && !txt.trim()) return;
        btn.disabled = true;
        var rr = await KB.client.rpc('kb_suggestion_reply', { p_id: id, p_reply: txt });
        if (!rr.error && rr.data) { editing = null; loadInbox(); } else btn.disabled = false;
        return;
      }
      var b = e.target.closest('button[data-s]');
      if (!b || b.getAttribute('aria-pressed') === 'true') return;
      var r = await KB.client.rpc('kb_suggestion_mark', { p_id: +b.dataset.id, p_status: b.dataset.s });
      if (!r.error && r.data) loadInbox();
    });
    loadInbox();
  });
})();
</script>
</body>
</html>
