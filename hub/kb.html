<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team Home · Tara Rose Salons</title>
<script>
  try { var t = localStorage.getItem('trs-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-96x96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon-96x96.png">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2D2E37" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub/hub.css?v=20261006pgic">
</head>
<body class="kb-wait">
<!-- One page for both a section's list (?s=beauty-sop) and a single SOP (?p=<slug>).
     There is deliberately no file per SOP: this repository is public, the pages are
     rows in kb_pages, readable only once signed in (Kate, 1 Oct 2026). -->
<div class="wrap">
  <header class="kb-head" id="kbHead" data-title="Team Home"></header>
  <main id="kbMain"><p class="kb-msg">Loading…</p></main>
  <footer class="kb-foot">For the Tara Rose Salons team only. <a href="/privacy/">Privacy</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=20261001kb"></script>
<script src="/hub/hub.js?v=20261006pgic"></script>
<script src="/hub/kb-doc.js?v=20261005dots"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), main = document.getElementById('kbMain'), esc = KB.esc;
  function sectionOf(key) { return KB.SECTIONS.find(function (s) { return s.key === key; }) || { key: key, title: key }; }
  function when(ts) {
    try { return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Dubai' }); }
    catch (e) { return ''; }
  }
  function notFound() {
    main.innerHTML = '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p><p class="kb-msg">This page isn’t here, or it isn’t open to your account. <a href="/hub/">Back to Team Home</a></p>';
  }

  // Every page can be starred, from the list and from the page itself (Kate, 1 Oct 2026).
  // A star repaints just itself; the list and the page stay where they are.
  main.addEventListener('click', function (e) {
    var b = e.target.closest('.kb-star');
    if (!b) return;
    e.preventDefault();
    var k = b.dataset.k, title = b.getAttribute('aria-label').replace(/^(Add|Remove) | (to|from) favourites$/g, '');
    KB.toggleFav(k, function () {
      var on = !!KB.favs[k], fresh = document.createElement('div');
      fresh.innerHTML = KB.starBtn(k, title);
      main.querySelectorAll('.kb-star').forEach(function (x) { if (x.dataset.k === k) x.replaceWith(fresh.firstChild.cloneNode(true)); });
    });
  });

  // ── PDF (Kate, 5 Oct 2026): one page, or the whole section as one book ──
  // KBDoc.pdf (kb-doc.js) builds a real PDF in the browser, same type and colours as the
  // page, text selectable. Nothing goes to a server.
  var PDF_ICON = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 14.5V16h12v-1.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function pdfBtn(label) { return '<button type="button" class="kb-pdf">' + PDF_ICON + '<span>' + esc(label) + '</span></button>'; }
  function busy(btn, label) {
    var span = btn.querySelector('span'), was = span.textContent;
    btn.disabled = true; btn.classList.add('busy'); span.textContent = label;
    return function (msg) {
      btn.disabled = false; btn.classList.remove('busy'); span.textContent = was;
      if (msg) alert(msg);
    };
  }
  function metaLine(p, i, n) {
    return (i >= 0 && n ? 'Chapter ' + (i + 1) + ' of ' + n + ', version ' : 'Version ') + p.version +
      ', updated ' + when(p.updated_at) + (p.owner ? '. Owner: ' + p.owner : '');
  }
  function forPdf(p, sec, i, n) {
    return { title: p.title, eyebrow: sec.title + (p.group_name ? ' · ' + p.group_name : ''), meta: metaLine(p, i, n),
      note: p.note, html: p.body_html };
  }
  function failMsg(e) { return (e && e.message) || 'The PDF could not be made. Try again in a moment.'; }
  function pagePdf(p, sec, i, n, btn) {
    var done = busy(btn, 'Making the PDF…');
    KBDoc.pdf([forPdf(p, sec, i, n)], { filename: KBDoc.filename(p.title), running: sec.title })
      .then(function () { done(); }, function (e) { done(failMsg(e)); });
  }
  async function bookPdf(key, btn) {
    var sec = sectionOf(key), done = busy(btn, 'Gathering the pages…');
    try {
      var r = await KB.client.from('kb_pages').select('slug,title,group_name,sort,body_html,note,owner,version,updated_at').eq('section', key).order('sort');
      if (r.error) throw r.error;
      var list = (r.data || []).filter(function (p) { return KB.shows(p.slug); });
      btn.querySelector('span').textContent = 'Making the PDF…';
      await KBDoc.pdf(list.map(function (p, i) { return forPdf(p, sec, i, list.length); }), {
        filename: KBDoc.filename(sec.title), running: sec.title,
        book: { title: sec.title, sub: list.length + ' chapters, downloaded ' + when(new Date()) } });
      done();
    } catch (e) { done(failMsg(e)); }
  }

  async function sectionList(key) {
    var sec = sectionOf(key);
    if (KB.viewAs && KB.allowed.indexOf(key) < 0) { notFound(); return; }   // "View as": not open at that level
    document.title = sec.title + ' · Team Home';
    var r = await KB.client.from('kb_pages').select('slug,title,group_name,sort,note').eq('section', key).order('sort');
    if (r.data) r.data = r.data.filter(function (p) { return KB.shows(p.slug); });   // "View as": leadership-only pages
    if (r.error || !r.data || !r.data.length) { notFound(); return; }
    var groups = [], by = {};
    r.data.forEach(function (p) {
      var g = p.group_name || '';
      if (!by[g]) { by[g] = []; groups.push(g); }
      by[g].push(p);
    });
    var anyNote = r.data.some(function (p) { return p.note; });
    // Kate, 6 Oct 2026: a page whose note says something is being confirmed wears a
    // "To check" chip, and ?check=1 (the "N to check" link on Team Home) lists only those.
    // Level 2 and up only; Level 1 keeps the plain dot and reads the note on the page.
    var toCheck = function (p) { return KB.level >= 2 && !!p.note && /confirm|approv|review/i.test(p.note); };
    var nCheck = r.data.filter(toCheck).length, only = q.get('check') === '1' && nCheck > 0;
    main.innerHTML =
      '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p>' +
      KB.titleIcon(sec.key, esc(sec.title)) +
      '<p class="kb-meta">' + r.data.length + ' pages</p>' +
      '<div class="kb-tools">' + pdfBtn('Download all as one PDF') + '</div>' +
      (nCheck ? '<p class="kb-legend"><span class="kb-flag" style="margin:0">To check</span>' + nCheck + (nCheck > 1 ? ' pages have' : ' page has') +
        ' something still being confirmed.<button type="button" id="kbOnlyCheck" aria-pressed="' + only + '">' + (only ? 'Show all pages' : 'Show only these') + '</button></p>'
        : anyNote ? '<p class="kb-legend"><span class="kb-dot"></span>Something on this page is still being confirmed.</p>' : '') +
      groups.map(function (g) {
        var list = only ? by[g].filter(toCheck) : by[g];
        if (!list.length) return '';
        return '<section class="kb-group"><h2>' + esc(g) + '</h2><ul class="kb-list">' +
          list.map(function (p) {
            return '<li><a href="/hub/kb.html?p=' + encodeURIComponent(p.slug) + '">' +
              KB.pageIcon(p, key, sec.rule) +
              (p.note && !toCheck(p) ? '<span class="kb-dot" title="Being confirmed"></span>' : '') + esc(p.title) +
              (toCheck(p) ? '<span class="kb-flag">To check</span>' : '') + '</a>' +
              KB.starBtn('p:' + p.slug, p.title) + '</li>';
          }).join('') + '</ul></section>';
      }).join('');
    var oc = document.getElementById('kbOnlyCheck');
    if (oc) oc.addEventListener('click', function () {
      var u = new URL(location.href);
      if (only) u.searchParams.delete('check'); else u.searchParams.set('check', '1');
      history.replaceState(null, '', u.pathname + u.search);
      q = new URLSearchParams(u.search);
      sectionList(key);
    });
    main.querySelector('.kb-pdf').addEventListener('click', function (e) { bookPdf(key, e.currentTarget); });
  }

  // Kate, 1 Oct 2026: a page reads like a document, the section's chapters down the side
  // (a fold-out list on a phone). 5 Oct 2026: one view only. The Workbook | Text switch is
  // gone; every page is drawn as the house document (KBDoc.clean: Playfair + Inter, paper,
  // ink and turquoise) and downloads as a PDF in the same look.
  function toc(list, cur) {
    var groups = [], by = {};
    list.forEach(function (x) { var g = x.group_name || ''; if (!by[g]) { by[g] = []; groups.push(g); } by[g].push(x); });
    return groups.map(function (g) {
      return (g ? '<div class="kb-toc-g">' + esc(g) + '</div>' : '') + '<ul>' + by[g].map(function (x) {
        var on = x.slug === cur;
        return '<li><a href="/hub/kb.html?p=' + encodeURIComponent(x.slug) + '"' + (on ? ' class="on" aria-current="page"' : '') + '>' + esc(x.title) + '</a></li>';
      }).join('') + '</ul>';
    }).join('');
  }

  async function onePage(slug) {
    var r = await KB.client.from('kb_pages').select('slug,section,group_name,sort,title,body_html,note,owner,version,updated_at').eq('slug', slug).maybeSingle();
    if (r.error || !r.data) { notFound(); return; }
    var p = r.data, sec = sectionOf(p.section);
    if (KB.viewAs && (KB.allowed.indexOf(p.section) < 0 || !KB.shows(p.slug))) { notFound(); return; }
    document.title = p.title + ' · ' + sec.title;
    // The section's chapters, for the side list and previous / next: titles only.
    var all = await KB.client.from('kb_pages').select('slug,title,sort,group_name').eq('section', p.section).order('sort');
    var list = (all.data || []).filter(function (x) { return KB.shows(x.slug); }), i = list.findIndex(function (x) { return x.slug === p.slug; });
    var prev = i > 0 ? list[i - 1] : null, next = i >= 0 && i < list.length - 1 ? list[i + 1] : null;
    main.innerHTML =
      '<p class="kb-crumbs"><a href="/hub/">Team Home</a> › <a href="/hub/kb.html?s=' + encodeURIComponent(p.section) + '">' + esc(sec.title) + '</a>' +
        (p.group_name ? ' › ' + esc(p.group_name) : '') + '</p>' +
      '<div class="kb-reader">' +
        '<details class="kb-toc" open><summary>Chapters <span>' + list.length + '</span></summary>' +
          '<nav aria-label="Chapters in ' + esc(sec.title) + '">' + toc(list, p.slug) + '</nav></details>' +
        '<div class="kb-read">' +
          '<div class="kb-tools">' + pdfBtn('Download PDF') + KB.starBtn('p:' + p.slug, p.title) + '</div>' +
          '<article class="kb-doc kd">' +
            '<header class="kd-head">' +
              '<p class="kd-eyebrow">' + esc(sec.title) + (p.group_name ? ' · ' + esc(p.group_name) : '') + '</p>' +
              KB.titleIcon(sec.key, esc(p.title), 'kd-title') +
              '<p class="kd-meta">' + esc(metaLine(p, i, list.length)) + '</p>' +
            '</header>' +
            (p.note ? p.note.split('\n').map(function (n) {
              return '<div class="kb-note"><div><b>Being confirmed</b>' + esc(n.replace(/^Being confirmed:\s*/i, '')) + '</div></div>';
            }).join('') : '') +
            '<div class="kd-body">' + KBDoc.clean(p.body_html) + '</div>' +
          '</article>' +
          '<nav class="kb-pager">' +
            (prev ? '<a class="prev" href="/hub/kb.html?p=' + encodeURIComponent(prev.slug) + '"><small>Previous</small>' + esc(prev.title) + '</a>' : '') +
            (next ? '<a class="next" href="/hub/kb.html?p=' + encodeURIComponent(next.slug) + '"><small>Next</small>' + esc(next.title) + '</a>' : '') +
          '</nav>' +
        '</div>' +
      '</div>';
    // A phone starts with the chapter list folded; on a wide screen the open one is in view.
    var det = main.querySelector('.kb-toc');
    if (matchMedia('(max-width:900px)').matches) det.open = false;
    var on = det.querySelector('a.on'); if (on && det.open) on.scrollIntoView({ block: 'center' });
    window.scrollTo(0, 0);
    main.querySelector('.kb-pdf').addEventListener('click', function (e) { pagePdf(p, sec, i, list.length, e.currentTarget); });
  }

  KB.ready.then(async function () {
    await KB.loadFavs();
    if (q.get('p')) onePage(q.get('p'));
    else if (q.get('s')) sectionList(q.get('s'));
    else location.replace('/hub/');
  });
})();
</script>
</body>
</html>
