<style>
/* Kate, 6 Oct 2026: Send invite, Level 5 only. */
.rs-when{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rs-inv{font-size:12px;color:var(--muted2)}
.rs-send{font:inherit;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.rs-send:hover{border-color:var(--text)}
.rs-send:disabled{cursor:default;opacity:.6;border-color:var(--border)}
/* Kate, 15 Oct 2026: Add person and Change level, Level 5 only. */
/* The My Numbers lock strip (audit 18 Oct 2026, P7-01). */
.rs-lock{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-size:14px}
.rs-lock b{font-weight:700}
.rs-lock .rs-lk-on{color:#2E7D5B}.rs-lock .rs-lk-off{color:var(--muted)}
.rs-lock details{margin-top:8px}
.rs-lock summary{cursor:pointer;min-height:32px;display:flex;align-items:center;color:var(--muted)}
.rs-lock ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.rs-lock .rs-lkbtn{font:inherit;font-size:13px;font-weight:600;padding:6px 14px;min-height:36px;border-radius:999px;border:1px solid var(--text);background:transparent;color:var(--text);cursor:pointer;margin-left:8px}
.rs-add{margin:14px 0 6px}
.rs-addbtn{font:inherit;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid var(--text);background:var(--text);color:var(--bg);cursor:pointer}
.rs-form{display:none;margin-top:12px;padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);gap:10px;flex-wrap:wrap;align-items:flex-end}
.rs-form.open{display:flex}
.rs-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted2);flex:1 1 180px}
.rs-form input,.rs-form select,.rs-lv{font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.rs-form .rs-hint{flex:1 1 100%;font-size:12px;color:var(--muted2);margin:0}
.rs-lv{font-size:12.5px;padding:4px 8px}
.rs-rm{font:inherit;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted2);cursor:pointer}
.rs-rm:hover{border-color:#B3261E;color:#B3261E}
.rs-rm:disabled{cursor:default;opacity:.6}
#rsRevoked{margin-top:28px}
/* Kate, 15 Oct 2026: columns under a sticky header row. --rs-top is the Team Home header's
   height, set in the page script. Phones keep the stacked cards (no header row). */
.wrap{max-width:1360px}   /* room for the extra column */
.rs-tbl{--rs-top:96px;--rs-grid:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.3fr) 124px 116px}
.rs-tbl.rs-lvl{--rs-grid:190px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.3fr) 124px 116px 124px}
.rs-ll{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.rs-llt{font-size:12px;color:var(--muted2)}
.rs-rm{white-space:nowrap}
.rs-emrow{display:flex;align-items:center;gap:8px;min-width:0}
/* Kate, 15 Oct 2026: click an email to copy it; the whole address shows (wraps), not cut off. */
.rs-contact .rs-emt{min-width:0;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;cursor:pointer}
.rs-contact .rs-emt:hover{text-decoration:underline dotted;text-underline-offset:3px}
.rs-contact .rs-emt.copied{color:#2E7D5B;text-decoration:none}
.rs-chg{flex:none;font:inherit;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted2);cursor:pointer}
.rs-chg:hover{border-color:var(--text);color:var(--text)}
.rs-chg:disabled{cursor:default;opacity:.6}
.rs-cols{display:none}
.rs-lvt{font-size:13px;color:var(--muted)}
.rs-jt{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-jt:empty{display:none}
@media (min-width:761px){
  .rs-tbl .rs-cols{display:grid;grid-template-columns:var(--rs-grid);gap:0 14px;position:sticky;top:var(--rs-top);z-index:15;
    background:var(--bg);padding:10px 18px;margin:0 0 12px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted2);font-weight:600;box-shadow:0 1px 0 var(--border)}
  .rs-tbl #rsList .rs-list li{grid-template-columns:var(--rs-grid);gap:4px 14px}
  .rs-tbl #rsList .rs-when{text-align:left;align-items:flex-start}
  .rs-tbl .rs-lv{width:100%}
}
@media (max-width:760px){
  /* The folds (audit 18 Oct 2026, P7-09): a group is one tappable row with its count; the people sit under it as the stacked cards they were. */
  .rs-fold{border-top:1px solid var(--border);margin:0}
  .rs-fold > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:52px;cursor:pointer}
  .rs-fold > summary::-webkit-details-marker{display:none}
  .rs-fold > summary h2{margin:0;font-size:17px}
  .rs-fold > summary::after{content:'+';font-size:22px;line-height:1;color:var(--muted)}
  .rs-fold[open] > summary::after{content:'\2013'}
  /* Tap targets: the copy-an-email text, Change, Send invite, Revoke and the level menu were 12 to 32px high. */
  .rs-contact .rs-emt{display:inline-flex;align-items:center;min-height:44px}
  .rs-chg,.rs-send,.rs-rm,.rs-lv,.rs-undo{min-height:44px;padding-left:14px;padding-right:14px}
  .rs-chg{font-size:12.5px}
  .rs-tbl #rsList .rs-list li{grid-template-areas:"who when" "jt ll" "contact contact"}
  .rs-tbl.rs-lvl #rsList .rs-list li{grid-template-areas:"who when" "jt ll" "contact contact" "lv act"}
  .rs-tbl #rsList .rs-ll{grid-area:ll;align-items:flex-end;text-align:right}
  .rs-tbl.rs-lvl #rsList .rs-lvc{grid-area:lv}
  .rs-tbl.rs-lvl #rsList .rs-act{grid-area:act;justify-self:end}
  .rs-tbl #rsList .rs-jt{grid-area:jt;padding-left:50px}
  .rs-tbl #rsList .rs-when{align-items:flex-end}
}
</style>
</head>
<body class="kb-wait">
<!-- Staff Roster & Access (Kate, 3 Oct 2026): everyone who can sign in to the site,
     with their job position, for Level 3 and up, view only; levels show to Level 5 only. The list comes from kb_roster() in Supabase
     (migrations/kb_roster.sql), which answers Level 3 and up only; nothing of it is
     in this file, the repo is public.
     Kate, 6 Oct 2026: Level 5 also gets a Send invite button on anyone from the
     dashboard list who has never signed in (kb_send_invite(), migrations/kb_roster_invite.sql). -->
<div class="wrap">
  <header class="kb-head" id="kbHead" data-title="Team Home"></header>
  <main id="kbMain"><p class="kb-msg">Loading…</p></main>
  <footer class="kb-foot">For the Tara Rose Salons team only. <a href="/privacy/">Privacy</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=3823f956"></script>
<script src="/assets/theme-fade.js"></script>
<script src="/hub/hub.js?v=ed24ec49"></script>
<script src="/visits.js?v=1176426c"></script>
<script>
(function () {
  var main = document.getElementById('kbMain'), esc = KB.esc;
  // Kate, 3 Oct 2026: the address is /hub/roster, without .html (Pages serves both).
  if (/\.html$/.test(location.pathname)) history.replaceState(null, '', location.pathname.replace(/\.html$/, '') + location.search + location.hash);
  var BRANCH = { SAA: 'Saadiyat', KCA: 'Khalifa City A', MC: 'Motor City', AQ: 'Al Quoz', BAH: 'Bahrain' };
  var TEAMS = ['Management & Office', 'Hair', 'Beauty', 'Front Desk', 'Call Centre'];
  function notFound() {
    main.innerHTML = '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p><p class="kb-msg">This page isn’t open to your account. <a href="/hub/">Back to Team Home</a></p>';
  }
  function when(ts) {
    if (!ts) return 'Never signed in';
    try { return 'Last in ' + new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Dubai' }); }
    catch (e) { return ''; }
  }
  // Kate, 15 Oct 2026: its own Last login column: the date and the time, Dubai time.
  function stamp(ts) {
    try {
      var d = new Date(ts);
      return '<span>' + esc(d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Dubai' })) + '</span>' +
        '<span class="rs-llt">' + esc(d.toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Asia/Dubai' })) + '</span>';
    } catch (e) { return ''; }
  }
  function day(ts) {
    try { return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'Asia/Dubai' }); }
    catch (e) { return ''; }
  }
  // Kate, 6 Oct 2026: Level 5 (not on "View as") can send the dashboard invite to
  // anyone on the dashboard list who has never signed in. Resends too, if they
  // were invited before and never accepted.
  function canInvite(p) { return byLevel && p.team === 'Management & Office' && !p.last_sign_in; }
  // Kate, 15 Oct 2026: Level 5 can change a dashboard-list person's level (2 to 4); the
  // owner row and Level 1 staff have no dropdown. The database refuses anything else.
  function canSetLevel(p) { return byLevel && p.team === 'Management & Office' && p.level >= 2 && p.level <= 4; }
  function levelBits(p) {
    if (!canSetLevel(p)) return '';
    return '<select class="rs-lv" data-email="' + esc(p.email) + '" aria-label="Level for ' + esc(p.name) + '">' +
      [2, 3, 4].map(function (l) {
        return '<option value="' + l + '"' + (l === p.level ? ' selected' : '') + '>Level ' + l + ' · ' + esc(KB.LEVELS[l] || '') + '</option>';
      }).join('') + '</select>';
  }
  // Kate, 15 Oct 2026: Revoke access on every row except the owner's, at any level or
  // position, for people who have left. kb_revoke_access() in the database.
  function revokeBits(p) {
    if (!byLevel || !(p.level >= 1 && p.level <= 4)) return '';
    return '<button type="button" class="rs-rm" data-email="' + esc(p.email) + '">Revoke access</button>';
  }
  function drawRevoked() {
    var el = document.getElementById('rsRevoked');
    if (!el) return;
    var list = data.revoked || [];
    el.innerHTML = list.length ? '<section class="kb-group"><h2>Access revoked <span class="rs-n">' + list.length + '</span></h2><ul class="kb-list rs-list">' +
      list.map(function (r) {
        return '<li><div class="rs-who"><div class="rs-id"><b>' + esc(r.name) + '</b><span class="rs-pos">' + esc(r.note || '') + '</span></div></div>' +
          '<div class="rs-contact"><span class="rs-emt" data-copy="' + esc(r.email) + '" title="Click to copy">' + esc(r.email) + '</span></div>' +
          '<div class="rs-when"><span>Revoked ' + esc(day(r.blocked_at)) + '</span>' +
          '<button type="button" class="rs-send rs-undo" data-email="' + esc(r.email) + '">Allow again</button></div></li>';
      }).join('') + '</ul></section>' : '';
  }
  function inviteBits(p) {
    if (!canInvite(p)) return '';
    return (p.invited ? '<span class="rs-inv">Invited ' + esc(day(p.invited)) + '</span>' : '') +
      '<button type="button" class="rs-send" data-email="' + esc(p.email) + '">' + (p.invited ? 'Resend invite' : 'Send invite') + '</button>';
  }
  function branchOf(p) { return p.branch || p.scope || ''; }
  function where(p) {
    var bits = [];
    if (p.branch) bits.push(BRANCH[p.branch] || p.branch);
    if (p.scope) bits.push((BRANCH[p.scope] || p.scope) + ' only');
    return bits.join(', ');
  }

  // Kate, 3 Oct 2026: levels are hers alone. Level 5 sees the list by level (and a Level
  // filter); everyone else, and Kate on "View as", sees it by team with no level
  // anywhere. kb_roster() leaves the level out for anyone below 5, so it isn't only hidden.
  var data = null, byLevel = false, f = { q: '', team: '', branch: '', seen: '', level: '' };
  // Audit 18 Oct 2026 (P7-09): on a phone the page was 85 rows, 14,388px tall. There each group (team, or level for Level 5) is a fold that
  // opens on a tap and says how many are in it; a search or a filter opens them all, and a group you opened stays open when the list redraws.
  var PHONE = matchMedia('(max-width:760px)'), openG = {};
  function opts(label, list) {
    return '<option value="">' + esc(label) + '</option>' + list.map(function (o) {
      return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>';
    }).join('');
  }
  function match(p) {
    if (f.team && p.team !== f.team) return false;
    if (f.branch && branchOf(p) !== f.branch) return false;
    if (f.seen === 'in' && !p.last_sign_in) return false;
    if (f.seen === 'never' && p.last_sign_in) return false;
    if (f.level && String(p.level) !== f.level) return false;
    var q = f.q.trim().toLowerCase();
    return !q || [p.name, p.email, p.position, p.team, where(p)].join(' ').toLowerCase().indexOf(q) >= 0;
  }
  function draw() {
    var people = data.people.filter(match);
    var groups = [], by = {};
    people.forEach(function (p) {
      var g = byLevel ? (p.level > 1 ? 'Level ' + p.level + ' · ' + (KB.LEVELS[p.level] || '') : 'Level 1 · Team, ' + (p.dept || 'Other')) : p.team || 'Other';
      if (!by[g]) { by[g] = []; groups.push(g); }
      by[g].push(p);
    });
    if (!byLevel) groups.sort(function (a, b) { return TEAMS.indexOf(a) - TEAMS.indexOf(b); });
    var filtered = people.length !== data.people.length;
    var fold = PHONE.matches, narrowed = !!(f.q.trim() || f.team || f.branch || f.seen || f.level);
    document.getElementById('rsCount').textContent = filtered ? 'Showing ' + people.length + ' of ' + data.people.length : '';
    document.getElementById('rsClear').hidden = !filtered;
    document.getElementById('rsList').innerHTML = groups.length ? groups.map(function (g) {
      var title = esc(g) + ' <span class="rs-n">' + by[g].length + '</span>';
      var body = '<ul class="kb-list rs-list">' +
        by[g].map(function (p) {
          // Kate, 3 Oct 2026: their photo (org chart or staff card, from kb_positions);
          // initials when there is none yet, or if the picture fails to load.
          var ini = (p.name.match(/[A-Za-z]+/g) || ['?']).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
          // Kate, 15 Oct 2026: one column per thing, under a sticky header row: Level, Name,
          // Job title, Email, Sign-in (the invite button replaces "Never signed in"), and
          // Revoke on the right. Level and Revoke are Level 5 only.
          var lvCell = byLevel ? '<div class="rs-lvc">' + (canSetLevel(p) ? levelBits(p) :
            '<span class="rs-lvt">Level ' + p.level + ' · ' + esc(KB.LEVELS[p.level] || '') + '</span>') + '</div>' : '';
          var signIn = p.last_sign_in ? '<span>Signed in</span>' :
            (canInvite(p) ? inviteBits(p) : '<span>Never signed in</span>');
          return '<li>' + lvCell +
            '<div class="rs-who"><span class="rs-av" aria-hidden="true">' + esc(ini) +
              (p.photo ? '<img src="' + esc(p.photo) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</span>' +
            '<div class="rs-id"><b>' + esc(p.name) + '</b></div></div>' +
            '<div class="rs-jt" title="' + esc(p.position || '') + '">' + esc(p.position || '') + '</div>' +
            '<div class="rs-contact"><span class="rs-emrow"><span class="rs-emt" data-copy="' + esc(p.email) + '" title="Click to copy">' + esc(p.email) + '</span>' +
              (byLevel && p.level < 5 ? '<button type="button" class="rs-chg" data-email="' + esc(p.email) + '" aria-label="Change email for ' + esc(p.name) + '">Change</button>' : '') +
              '</span><span class="rs-where">' + esc(where(p)) + '</span></div>' +
            '<div class="rs-when' + (p.last_sign_in ? '' : ' never') + '">' + signIn + '</div>' +
            '<div class="rs-ll">' + (p.last_sign_in ? stamp(p.last_sign_in) : '<span class="rs-llt">—</span>') + '</div>' +
            (byLevel ? '<div class="rs-act">' + revokeBits(p) + '</div>' : '') + '</li>';
        }).join('') + '</ul>';
      return fold
        ? '<details class="kb-group rs-fold" data-g="' + esc(g) + '"' + ((narrowed || openG[g]) ? ' open' : '') + '><summary><h2>' + title + '</h2></summary>' + body + '</details>'
        : '<section class="kb-group"><h2>' + title + '</h2>' + body + '</section>';
    }).join('') : '<p class="kb-msg">Nobody matches those filters.</p>';
    drawRevoked();
  }

  KB.ready.then(async function () {
    if (KB.allowed.indexOf('access') < 0) { notFound(); return; }   // also "View as" below Level 3
    var r = await KB.client.rpc('kb_roster');
    if (r.error || !r.data) { notFound(); return; }
    data = r.data;
    byLevel = KB.level === 5;
    if (!byLevel) data.people.sort(function (a, b) { return a.name.localeCompare(b.name); });
    var staff = data.people.filter(function (p) { return p.team !== 'Management & Office'; }).length;
    var branches = Object.keys(BRANCH).filter(function (b) { return data.people.some(function (p) { return branchOf(p) === b; }); });
    var teams = TEAMS.filter(function (t) { return data.people.some(function (p) { return p.team === t; }); });
    main.innerHTML =
      '<p class="kb-crumbs"><a href="/hub/">Team Home</a></p>' +
      KB.titleIcon('access', 'Staff Roster &amp; Access') +
      '<p class="kb-meta">' + data.people.length + ' people can sign in' +
        (byLevel ? ': ' + (data.people.length - staff) + ' on the dashboard list and ' + staff + ' in the team' : '') +
        (byLevel ? '. You can add people, change their level or email, and revoke access here.' : '. View only; changes go through Kate.') + '</p>' +
      '<div class="rs-lock" id="rsLock" hidden></div>' +
      (byLevel ? '<div class="rs-add"><button type="button" class="rs-addbtn" id="rsAddBtn">Add person</button>' +
        '<form class="rs-form" id="rsForm" autocomplete="off">' +
          '<label>Full name<input type="text" id="rsName" required></label>' +
          '<label>Email<input type="email" id="rsEmail" required></label>' +
          '<label>Level<select id="rsLevel">' + [2, 3, 4].map(function (l) {
            return '<option value="' + l + '">Level ' + l + ' · ' + esc(KB.LEVELS[l] || '') + '</option>';
          }).join('') + '</select></label>' +
          '<label>Region<select id="rsScope"><option value="">All branches</option><option value="BAH">Bahrain only</option></select></label>' +
          '<button type="submit" class="rs-addbtn" id="rsAddGo">Add and send invite</button>' +
          '<p class="rs-hint">They get the Team Home invite email straight away. Level 5 is not set here.</p>' +
        '</form></div>' : '') +
      (data.staff_open ? '' : '<div class="kb-note">Team Home isn’t open to the salon team yet, so they can’t sign in until it is.</div>') +
      '<div class="rs-bar">' +
        '<div class="kb-search rs-filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
          '<input type="search" id="rsFilter" placeholder="Search names, emails or roles" autocomplete="off" aria-label="Search the roster"></div>' +
        '<div class="rs-selects">' +
          '<select data-k="team" aria-label="Team">' + opts('All teams', teams.map(function (t) { return [t, t]; })) + '</select>' +
          '<select data-k="branch" aria-label="Branch">' + opts('All branches', branches.map(function (b) { return [b, BRANCH[b]]; })) + '</select>' +
          '<select data-k="seen" aria-label="Signed in">' + opts('Signed in or not', [['in', 'Has signed in'], ['never', 'Never signed in']]) + '</select>' +
          (byLevel ? '<select data-k="level" aria-label="Level">' + opts('All levels', [5, 4, 3, 2, 1].map(function (l) { return [String(l), 'Level ' + l]; })) + '</select>' : '') +
        '</div>' +
      '</div>' +
      '<div class="rs-status"><span id="rsCount"></span><button type="button" id="rsClear" hidden>Clear filters</button></div>' +
      '<div class="rs-tbl' + (byLevel ? ' rs-lvl' : '') + '" id="rsTbl">' +
        '<div class="rs-cols" aria-hidden="true">' + (byLevel ? '<span>Level</span>' : '') +
          '<span>Name</span><span>Job title</span><span>Email</span><span>Sign-in</span><span>Last login</span>' + (byLevel ? '<span></span>' : '') + '</div>' +
        '<div id="rsList"></div></div><div id="rsRevoked"></div>';
    // The sticky column header sits just under the Team Home header, whatever its height.
    var head = document.getElementById('kbHead'), tbl = document.getElementById('rsTbl');
    function setTop() { if (head && tbl) tbl.style.setProperty('--rs-top', Math.round(head.getBoundingClientRect().height) + 'px'); }
    setTop(); window.addEventListener('resize', setTop);
    if (window.ResizeObserver && head) new ResizeObserver(setTop).observe(head);
    // The My Numbers sign-in lock (migrations/my_numbers_lock.sql): the switch and who has signed in so far. Level 3 and above read it; Level 5 flips it.
    async function drawLock() {
      var box = document.getElementById('rsLock');
      var r = await KB.client.rpc('perf_lock_status');
      if (r.error || !r.data) { box.hidden = true; return; }
      var st = r.data, never = st.never || [], nonG = never.filter(function (n) { return !n.gmail; }).length;
      box.hidden = false;
      box.innerHTML = '<b>My Numbers sign-in lock:</b> <span class="' + (st.on ? 'rs-lk-on' : 'rs-lk-off') + '"><b>' + (st.on ? 'ON' : 'OFF') + '</b></span>. ' +
        st.signed_in + ' of ' + st.total + ' stylists and therapists have signed in' + (never.length ? ' (' + never.length + ' not yet, ' + nonG + ' of them without a Gmail address, who use the email link)' : '') + '.' +
        (byLevel ? '<button type="button" class="rs-lkbtn" id="rsLkBtn">' + (st.on ? 'Switch off' : 'Switch on') + '</button>' : '') +
        (never.length ? '<details><summary>Who has not signed in yet (' + never.length + ')</summary><ul>' + never.map(function (n) {
          return '<li>' + esc(n.name) + ' · ' + esc(BRANCH[n.branch] || n.branch || '') + ' · ' + esc(n.email) + (n.gmail ? '' : ' · email link') + '</li>';
        }).join('') + '</ul></details>' : '');
      var b = document.getElementById('rsLkBtn');
      if (b) b.onclick = async function () {
        var turnOn = !st.on;
        if (!confirm(turnOn
          ? 'Switch the lock ON? A stylist\u2019s link will then ask her to sign in with her own email, and ' + never.length + ' have not signed in yet.'
          : 'Switch the lock OFF? Links open with no sign-in again.')) return;
        b.disabled = true;
        var s = await KB.client.rpc('perf_lock_set', { p_on: turnOn });
        if (s.error) { alert('Not changed: ' + s.error.message); b.disabled = false; return; }
        drawLock();
      };
    }
    drawLock();
    draw();
    document.getElementById('rsList').addEventListener('toggle', function (e) {
      var d = e.target; if (d && d.dataset && d.dataset.g !== undefined) openG[d.dataset.g] = d.open;
    }, true);
    PHONE.addEventListener('change', function () { draw(); });
    document.getElementById('rsFilter').addEventListener('input', function (e) { f.q = e.target.value; draw(); });
    // Kate, 3 Oct 2026: the site's own pill menus, not the browser's dropdowns.
    main.querySelectorAll('.rs-selects select').forEach(function (sel) {
      KB.pillDD(sel);
      sel.addEventListener('change', function () { f[sel.dataset.k] = sel.value; draw(); });
    });
    // Send invite: the email goes out from the invite-user edge function a few
    // seconds later; the roster is read again to show the new "Invited" date.
    document.getElementById('rsList').addEventListener('click', async function (e) {
      var b = e.target.closest('.rs-send');
      if (!b || b.disabled) return;
      var email = b.dataset.email, who = data.people.find(function (p) { return p.email === email; });
      if (!confirm('Send the Team Home invite email to ' + email + '?')) return;
      b.disabled = true; b.textContent = 'Sending…';
      var s = await KB.client.rpc('kb_send_invite', { p_email: email });
      if (s.error) {
        b.disabled = false; b.textContent = 'Try again';
        alert('The invite didn’t send: ' + s.error.message);
        return;
      }
      var before = who && who.invited;
      for (var i = 0; i < 4; i++) {
        await new Promise(function (r) { setTimeout(r, 2500); });
        var r = await KB.client.rpc('kb_roster');
        var now = r.data && r.data.people.find(function (p) { return p.email === email; });
        if (now && now.invited && now.invited !== before) {
          who.invited = now.invited;
          draw();
          var nb = document.querySelector('.rs-send[data-email="' + CSS.escape(email) + '"]');
          if (nb) { nb.disabled = true; nb.textContent = 'Invite sent'; }
          return;
        }
      }
      b.textContent = 'Sent, not confirmed yet';
    });
    // Kate, 15 Oct 2026: Add person (kb_add_user) and Change level (kb_set_user_level),
    // migrations/kb_roster_manage.sql. Level 5 only, checked again in the database.
    async function reload() {
      var r = await KB.client.rpc('kb_roster');
      if (r.data) { data = r.data; draw(); }
    }
    if (byLevel) {
      var form = document.getElementById('rsForm');
      document.getElementById('rsAddBtn').addEventListener('click', function () {
        form.classList.toggle('open');
        if (form.classList.contains('open')) document.getElementById('rsName').focus();
      });
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var name = document.getElementById('rsName').value.trim(), email = document.getElementById('rsEmail').value.trim().toLowerCase();
        var level = parseInt(document.getElementById('rsLevel').value, 10), scope = document.getElementById('rsScope').value || null;
        if (!confirm('Add ' + name + ' (' + email + ') at Level ' + level + (scope ? ', Bahrain only' : '') + ' and email them the invite?')) return;
        var go = document.getElementById('rsAddGo'); go.disabled = true; go.textContent = 'Adding…';
        var s = await KB.client.rpc('kb_add_user', { p_email: email, p_name: name, p_level: level, p_scope: scope });
        go.disabled = false; go.textContent = 'Add and send invite';
        if (s.error) { alert('Not added: ' + s.error.message); return; }
        form.reset(); form.classList.remove('open');
        await reload();
        alert(name + ' is on the list at Level ' + level + '. The invite email goes out in a few seconds.');
      });
      // Revoke access (kb_revoke_access): shuts the person out altogether, any level or
      // position: off the dashboard list (a copy is kept), onto the block list, sign-in
      // account deleted. "Allow again" (kb_restore_access) lifts the block.
      document.getElementById('rsList').addEventListener('click', async function (e) {
        var b = e.target.closest('.rs-rm');
        if (!b || b.disabled) return;
        var email = b.dataset.email, who = data.people.find(function (p) { return p.email === email; });
        if (!confirm('Revoke ALL access for ' + (who ? who.name : email) + ' (' + email + ')? They are signed out and can no longer open the dashboard or Team Home.')) return;
        var note = prompt('Note for your records (optional), e.g. "Resigned 15 Oct":', 'Resigned');
        if (note === null) return;
        b.disabled = true; b.textContent = 'Revoking…';
        var s = await KB.client.rpc('kb_revoke_access', { p_email: email, p_note: note });
        if (s.error) { b.disabled = false; b.textContent = 'Revoke access'; alert('Not revoked: ' + s.error.message); return; }
        await reload();
      });
      // Change email (kb_change_email): updates it everywhere the person is stored, ends the
      // old sign-in account, and invites a dashboard-list person at the new address.
      document.getElementById('rsList').addEventListener('click', async function (e) {
        var b = e.target.closest('.rs-chg');
        if (!b || b.disabled) return;
        var old = b.dataset.email, who = data.people.find(function (p) { return p.email === old; });
        var next = prompt('New email for ' + (who ? who.name : old) + ':', old);
        if (next === null) return;
        next = next.trim().toLowerCase();
        if (!next || next === old) return;
        if (!confirm('Change ' + (who ? who.name : old) + ' from ' + old + ' to ' + next + '?\n\nTheir old sign-in stops working. ' +
            (who && who.team === 'Management & Office' ? 'They are emailed an invite at the new address.' : 'They sign in with the new address.'))) return;
        b.disabled = true; b.textContent = 'Saving…';
        var s = await KB.client.rpc('kb_change_email', { p_old: old, p_new: next });
        if (s.error) { b.disabled = false; b.textContent = 'Change'; alert('Not changed: ' + s.error.message); return; }
        await reload();
      });
      document.getElementById('rsRevoked').addEventListener('click', async function (e) {
        var b = e.target.closest('.rs-undo');
        if (!b || b.disabled) return;
        var r = (data.revoked || []).find(function (x) { return x.email === b.dataset.email; });
        if (!confirm('Allow ' + (r ? r.name : b.dataset.email) + ' back in? Staff regain their Team Home access straight away; a dashboard-list person has to be added again with Add person.')) return;
        b.disabled = true; b.textContent = 'Working…';
        var s = await KB.client.rpc('kb_restore_access', { p_email: b.dataset.email });
        if (s.error) { b.disabled = false; b.textContent = 'Allow again'; alert('Not changed: ' + s.error.message); return; }
        await reload();
      });
      document.getElementById('rsList').addEventListener('change', async function (e) {
        var sel = e.target.closest('.rs-lv');
        if (!sel) return;
        var email = sel.dataset.email, who = data.people.find(function (p) { return p.email === email; });
        var lv = parseInt(sel.value, 10);
        if (!confirm('Change ' + (who ? who.name : email) + ' to Level ' + lv + '?')) { if (who) sel.value = who.level; return; }
        sel.disabled = true;
        var s = await KB.client.rpc('kb_set_user_level', { p_email: email, p_level: lv });
        if (s.error) { alert('Not changed: ' + s.error.message); if (who) sel.value = who.level; sel.disabled = false; return; }
        await reload();
      });
    }
    // Click an email to copy it. Works for everyone who can see the roster.
    main.addEventListener('click', function (e) {
      var t = e.target.closest('.rs-emt');
      if (!t || !t.dataset.copy) return;
      var txt = t.dataset.copy;
      function done() {
        var was = t.textContent;
        t.classList.add('copied'); t.textContent = 'Copied ✓';
        setTimeout(function () { t.classList.remove('copied'); t.textContent = was; }, 1100);
      }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (err) {}
        ta.remove();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
      else fallback();
    });
    document.getElementById('rsClear').addEventListener('click', function () {
      f = { q: '', team: '', branch: '', seen: '', level: '' };
      document.getElementById('rsFilter').value = '';
      main.querySelectorAll('.rs-selects select').forEach(function (sel) { sel.value = ''; sel._ddPaint(); });
      draw();
    });
  });
})();
</script>
