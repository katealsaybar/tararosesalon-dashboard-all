<!-- Kate, 8 Oct 2026: the second front door. Team Home is the first (/hub/); this is the
     plain search page, the way Google opens: the logo, one bar, nothing else. The tokens,
     logo, icons and favourite pills are Team Home's (hub.css, hub.js); the search itself
     happens where the signed-in person's access lives: the dashboard's results page for
     dashboard people (/?q=), Team Home's own search for staff (/hub/?q=). -->
<link rel="stylesheet" href="/hub/hub.css?v=20261008su">
<style>
  body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  body.sr-wait .sr-main{visibility:hidden}
  .sr-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px 12vh;text-align:center}
  .sr-main .kb-brand img{width:min(260px,62vw)}
  .sr-main .kb-brand span{font-size:13px;margin-top:2px}
  .sr-hello{margin:28px 0 14px;font:400 15px/1.4 'Inter',system-ui,sans-serif;color:var(--muted)}
  .sr-form{width:100%;max-width:600px}
  .sr-barwrap{position:relative}
  .sr-bar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:0 22px;height:46px;box-shadow:var(--shadow);
    transition:box-shadow .2s var(--ease),border-color .2s var(--ease)}
  .sr-bar:hover{box-shadow:var(--shadow-hover)}
  .sr-bar:focus-within{border-color:var(--text);box-shadow:0 0 0 3px rgba(153,246,228,.45),var(--shadow-hover)}
  .sr-bar svg{width:19px;height:19px;flex-shrink:0;color:var(--muted)}
  .sr-bar input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--text)}
  .sr-bar input::placeholder{color:var(--muted2)}
  .sr-bar input::-webkit-search-cancel-button{display:none}
  /* Suggestions drop under the bar as Team Home's search results do (hub.css .kb-results). */
  .sr-sug{text-align:left;top:calc(100% + 10px)}
  .sr-sug .kb-result{cursor:pointer}
  .sr-sug .sr-fix{color:var(--muted);font-size:14px;margin-bottom:2px}
  .sr-sug .sr-fix b{color:var(--text)}
  .sr-sug .sr-all{color:var(--muted);font-size:14px;border-top:1px solid var(--border2);border-radius:0 0 8px 8px;margin-top:4px;padding-top:12px}
  .sr-go{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap}
  /* inline-flex, so the label sits in the middle of the button whatever the button's height */
  .sr-btn{appearance:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;
    border:1px solid var(--border);background:var(--surface2);color:var(--text);
    border-radius:8px;padding:10px 20px;font:500 14px/1 'Inter',system-ui,sans-serif;text-decoration:none;white-space:nowrap;
    transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
  .sr-btn:hover{border-color:var(--text);box-shadow:var(--shadow)}
  .sr-btn:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(153,246,228,.6)}
  .sr-hint{margin:22px 0 0;font-size:13px;color:var(--muted2)}
  .sr-hint kbd{font:inherit;font-size:11px;border:1px solid var(--border);border-radius:4px;padding:1px 6px;background:var(--surface)}
  .sr-foot{padding:18px 20px calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--muted2)}
  .sr-foot a{margin:0 8px}
  /* Shortcuts: Team Home's own favourite pills (kb-fv, 32px icon), starred first, then what you open most. */
  .sr-tiles{margin-top:34px;width:100%;max-width:780px}
  .sr-tiles .kb-fvs{justify-content:center;margin:0}
  /* A starred pill wears the star Team Home's cards have, so you can tell it from one that is only often opened. */
  .sr-pstar{flex:none;display:grid;place-items:center;margin-left:-4px;color:#C9971A}
  .sr-pstar svg{width:14px;height:14px;fill:currentColor}
  .sr-cap{margin:14px 0 0;font-size:12px;color:var(--muted2)}
  .sr-top{position:fixed;top:14px;right:16px;z-index:5;display:flex;gap:8px}
  /* Narrow, the buttons would sit over the logo: they take a row of their own above it instead. */
  @media (max-width:760px){.sr-top{position:static;align-self:flex-end;padding:14px 16px 0}}
  .sr-theme{appearance:none;cursor:pointer;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);border-radius:999px;padding:8px 16px;font:500 13px/1 'Inter',system-ui,sans-serif}
  .sr-theme:hover{color:var(--text);border-color:var(--text)}
  @media (max-width:760px){
    /* Team Home lets its favourites swipe sideways on a phone; here they wrap and stay centred. */
    .sr-tiles .kb-fvs{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
  }
  @media (max-width:560px){
    .sr-bar{height:46px;padding:0 18px}
    .sr-bar input{font-size:16px}
    .sr-go{gap:8px}
    .sr-btn{flex:1;padding:12px 8px}
  }
</style>

<!-- Team Home's own script: the sign-in check, the icons and the stars. It draws no header here (no #kbHead). -->

<script>
(async function () {
  // Signed in and on a list, as Team Home checks it; anyone else is sent to the sign-in card
  // and comes back here (hub.js).
  await KB.ready;
  var c = KB.client;
  var me = await TRSAuth.me().catch(function () { return null; });
  var role = await TRSAuth.role().catch(function () { return null; });
  // The dashboard's search reads the UAE; a Bahrain-scoped sign-in has none (search.js
  // open()), so it searches Team Home like staff do.
  var dash = !!role && !(me && me.scope) && KB.allowed.indexOf('dashboards') >= 0;

  var first = ((KB.name || (me && me.name)) || '').split(/[\s(]/)[0];
  if (first) document.getElementById('srHello').textContent = 'Hello, ' + first;

  var input = document.getElementById('srIn');
  if (dash) {
    input.placeholder = 'Find anything, or ask a question';
    document.getElementById('srDash').classList.remove('hide');
    document.getElementById('srHint').textContent = 'Staff, branches, pages, clients, services and Team Home. Ask it the way you would say it.';
  } else {
    document.getElementById('srHint').textContent = 'Treatments, policies and how-tos.';
  }
  document.body.classList.remove('sr-wait');
  input.focus();

  // Light and dark: the dashboard's own setting (trs-theme), the same switch Team Home has.
  var tbtn = document.getElementById('srTheme');
  function theme() {
    var t = document.documentElement.getAttribute('data-theme');
    return t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function paintTheme() { tbtn.textContent = theme() === 'dark' ? 'Light mode' : 'Dark mode'; }
  tbtn.addEventListener('click', function () {
    var next = theme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('trs-theme', next); } catch (e) {}
    paintTheme();
  });
  paintTheme();

  // Sign out, as Team Home and the dashboard have it (Kate, 8 Oct 2026: "walang logout button").
  document.getElementById('srOut').addEventListener('click', async function () {
    try { await c.auth.signOut(); } catch (e) { /* signed out or not, the door is the same */ }
    location.replace('/');
  });

  var esc = KB.esc;
  var secBy = {};
  KB.SECTIONS.forEach(function (s) { secBy[s.key] = s; });
  // The same titles as Team Home's favourites and the dashboard's sidebar.
  var DASH = { dashboard: 'Organisation Pulse', branchperf: 'Branch Performance', compare: 'Comparison', team: 'Podium Race',
    teamquad: 'Staff Quadrant', staffperf: 'Staff Dashboards', staffweeks: 'Staff’s 13 Week Report', stafflevels: 'Stylist’s Benchmarks',
    stylists: 'Staff Cards', orgchart: 'Org Chart', products: 'Products', ledgerFinancials: 'Financial Totals',
    ledgerTargets: 'Daily Target Sheet', ledgerActuals: 'Actuals vs Targets', ledgerStylist: 'Daily Stylist Target',
    services: 'Service Rankings', clients: 'Top Clients', lostclients: 'Lost Clients', wvperf: 'Wellness Voucher Performance',
    reviews: 'Google Reviews', googleads: 'Google Ads', website: 'Website & Search' };
  // The level each dashboard page asks for, as the dashboard hides them (the dashboard still refuses the rest).
  var DASH_MIN = { lostclients: 2, wvperf: 2, googleads: 3, website: 3 };
  var DASH_IC = { lostclients: 'lost-clients', ledgerTargets: 'today', ledgerStylist: 'today', ledgerActuals: 'today',
    orgchart: 'people', stylists: 'access', team: 'access', teamquad: 'access', staffperf: 'access', staffweeks: 'access',
    stafflevels: 'access', googleads: 'marketing', website: 'dashboards', wvperf: 'campaigns' };
  function dashIcon(v) { return KB.icon(DASH_IC[v] || 'dashboards', 'var(--accent-lavender)'); }
  function initials(t) {
    return t.replace(/&/g, ' ').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
  }
  // Team Home's own icon for a section, or its initials on the section's colour (hub/index.html icon()).
  function secIcon(s) {
    return KB.ICONS[s.ic || s.key] ? KB.icon(s.ic || s.key, s.rule)
      : '<span class="kb-ic" style="--c:' + s.rule + '" aria-hidden="true">' + esc(initials(s.title)) + '</span>';
  }
  function secHref(s) { return s.href || '/hub/kb.html?s=' + s.key; }

  // ── Shortcuts: what you starred (kept per person, the same stars as Team Home and the
  // dashboard sidebar), then what you open most (counted in this browser by visits.js).
  var MAX_TILES = 8;
  (async function () {
    var tiles = [], seen = {};
    function add(t, h, ic, star) {
      if (!t || !h || seen[h] || tiles.length >= MAX_TILES) return;
      seen[h] = 1; tiles.push({ t: t, h: h, ic: ic, star: !!star });
    }
    // Team Home's cards, in its order: what this person may open, plus the two it adds itself.
    var shown = KB.SECTIONS.filter(KB.opens);
    if (KB.myLink) shown.unshift({ key: 'my-numbers', title: 'My numbers & payslip', href: KB.myLink, rule: 'var(--accent-mint)' });
    shown.push({ key: 'suggestions', title: 'Suggestions Box', href: '/hub/suggestions', rule: 'var(--accent-butter)' });
    var starred = [];
    try {
      var favs = await KB.loadFavs();
      shown.forEach(function (s) { if (favs[s.key]) add(s.title, secHref(s), secIcon(s), true); });
      var slugs = Object.keys(favs).filter(function (k) { return k.indexOf('p:') === 0; }).map(function (k) { return k.slice(2); });
      if (slugs.length) {
        var pr = await c.from('kb_pages').select('slug,title,section,group_name').in('slug', slugs);
        ((pr.data) || []).filter(function (p) { return KB.shows(p.slug); }).forEach(function (p) {
          var sec = secBy[p.section] || {};
          add(p.title, '/hub/kb.html?p=' + encodeURIComponent(p.slug), secIcon({ key: sec.key || p.section, title: p.title, rule: sec.rule || 'var(--accent-mint)', ic: sec.key }), true);
        });
      }
      if (dash) Object.keys(favs).forEach(function (k) {
        if (k.indexOf('d:') === 0 && DASH[k.slice(2)]) add(DASH[k.slice(2)], '/?view=' + k.slice(2), dashIcon(k.slice(2)), true);
      });
    } catch (e) { /* no favourites to show; the rest still can */ }

    // What you open most: the page's own icon, found from where it lives.
    var visits = [];
    try {
      var v = JSON.parse(localStorage.getItem('trs-visits') || '{}') || {};
      visits = Object.keys(v).map(function (k) { return v[k]; })
        .sort(function (a, b) { return (b.n - a.n) || (b.ts - a.ts); })
        .filter(function (e) { return e.h && e.t && !(e.h.indexOf('/?view=') === 0 && !dash); });
    } catch (e) { /* private window: no counts */ }
    var pslugs = [];
    visits.forEach(function (e) { var m = e.h.match(/^\/hub\/kb\.html\?p=([^&]+)/); if (m) pslugs.push(decodeURIComponent(m[1])); });
    var pageBy = {};
    if (pslugs.length) {
      try {
        var vr = await c.from('kb_pages').select('slug,title,section,group_name').in('slug', pslugs);
        ((vr.data) || []).forEach(function (p) { pageBy[p.slug] = p; });
      } catch (e) { /* initials instead */ }
    }
    function visitIcon(e) {
      var m = e.h.match(/^\/\?view=(\w+)/);
      if (m) return dashIcon(m[1]);
      var pm = e.h.match(/^\/hub\/kb\.html\?p=([^&]+)/);
      if (pm) {
        var p = pageBy[decodeURIComponent(pm[1])], sec = p && secBy[p.section];
        if (p && sec) { var i = KB.pageIcon(p, sec.key, sec.rule); if (i) return i; }
        return '<span class="kb-ic" style="--c:var(--accent-mint)" aria-hidden="true">' + esc(initials(e.t)) + '</span>';
      }
      var s = shown.filter(function (x) { return secHref(x) === e.h || e.h.indexOf(secHref(x) + '?') === 0 || e.h === secHref(x) + '.html'; })[0];
      if (!s) { var sm = e.h.match(/[?&]s=([\w-]+)/); s = sm && secBy[sm[1]]; }
      return s ? secIcon(s) : '<span class="kb-ic" style="--c:var(--accent-mint)" aria-hidden="true">' + esc(initials(e.t)) + '</span>';
    }
    visits.forEach(function (e) {
      var pm = e.h.match(/^\/hub\/kb\.html\?p=([^&]+)/);
      if (pm && pslugs.length && !pageBy[decodeURIComponent(pm[1])] && Object.keys(pageBy).length) return;   // a page this person can no longer read
      add(e.t, e.h, visitIcon(e), false);
    });

    var nav = document.getElementById('srTiles');
    if (!tiles.length) {
      document.getElementById('srCap').textContent = 'Star a page and it will wait here. So will the ones you open most.';
      nav.classList.remove('hide');
      return;
    }
    document.getElementById('srTilesRow').innerHTML = tiles.map(function (t) {
      return '<a class="kb-fv" href="' + esc(t.h) + '" title="' + esc(t.t) + (t.star ? ' (starred)' : '') + '">' + t.ic + '<span>' + esc(t.t) + '</span>' +
        (t.star ? '<span class="sr-pstar" role="img" aria-label="Starred"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/></svg></span>' : '') + '</a>';
    }).join('');
    document.getElementById('srCap').textContent = tiles.some(function (t) { return t.star; }) ? 'Pages with a star come first, then the ones you open most.' : 'The pages you open most. Star one, on Team Home or in the dashboard, to keep it first.';
    nav.classList.remove('hide');
  })();

  // ── Suggestions, as you type. Pages (Team Home's cards, and the dashboard's pages for
  // dashboard people) answer at once; Team Home's own pages come a moment later from
  // kb_search, run as this person, so only what they may read. The last row is the full
  // results (dashboard people: the dashboard's results page).
  var box = document.getElementById('srSug');
  var local = [], localSeen = {};
  KB.SECTIONS.filter(KB.opens).forEach(function (s) {
    var h = secHref(s);
    if (!localSeen[h]) { localSeen[h] = 1; local.push({ t: s.title, h: h, g: s.dept, b: s.blurb || '' }); }
  });
  if (dash) Object.keys(DASH).forEach(function (v) {
    var h = '/?view=' + v;
    if (localSeen[h] || KB.level < (DASH_MIN[v] || 1)) return;
    localSeen[h] = 1; local.push({ t: DASH[v], h: h, g: 'Dashboard', b: '' });
  });
  local.forEach(function (x) { x.tw = words(x.t); x.bw = words(x.b); });
  function words(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').match(/[a-z0-9%]+/g) || []; }
  // Typos, by the dashboard search's own rules (search.js tokMatch): a word of four letters or
  // fewer has to be exact; from five, a slip of one letter (two from nine) still lands, a swap of
  // two neighbours counts as one, and the word may be half typed.
  function dist(a, b) {
    var d = [], i, j;
    for (i = 0; i <= a.length; i++) d[i] = [i];
    for (j = 1; j <= b.length; j++) d[0][j] = j;
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
    return d[a.length][b.length];
  }
  function slip(t, w) {
    if (t.length < 5 || w.length < 5) return 9;
    var room = t.length >= 9 ? 2 : 1, best = 9;
    [w, w.slice(0, t.length), w.slice(0, t.length + 1)].forEach(function (c) {
      if (c.length >= 3 && Math.abs(c.length - t.length) <= room) best = Math.min(best, dist(t, c));
    });
    return best <= room ? best : 9;
  }
  // 3 when every typed word starts a word of the text, 2 when some only land by a slip, 0 when one does not land.
  function fit(q, ws) {
    var lvl = 3;
    for (var i = 0; i < q.length; i++) {
      var t = q[i];
      if (ws.some(function (w) { return w.indexOf(t) === 0; })) continue;
      if (ws.some(function (w) { return slip(t, w) < 9; })) { lvl = 2; continue; }
      return 0;
    }
    return lvl;
  }
  function localHits(q) {
    var out = [];
    local.forEach(function (x) {
      var t = fit(q, x.tw), s = 0;
      if (t === 3) s = words(x.t).join(' ').indexOf(q.join(' ')) === 0 ? 5 : 4;
      else if (t === 2) s = 3;
      else { var b = fit(q, x.tw.concat(x.bw)); s = b === 3 ? 2 : b === 2 ? 1 : 0; }
      if (s) out.push({ x: x, s: s });
    });
    return out.sort(function (a, b) { return b.s - a.s; }).slice(0, 5).map(function (o) { return o.x; });
  }
  // Every word Team Home's cards use, to put a mistyped word right before Team Home's pages are searched
  // (kb_search matches the letters it is given, so a slip finds nothing there).
  var vocab = {};
  local.forEach(function (x) { x.tw.concat(x.bw).forEach(function (w) { if (w.length >= 5) vocab[w] = 1; }); });
  var vocabList = Object.keys(vocab);
  function fixWord(t) {
    if (t.length < 5 || vocabList.some(function (w) { return w.indexOf(t) === 0; })) return t;
    var best = t, bd = 9;
    vocabList.forEach(function (w) { var d = slip(t, w); if (d < bd) { bd = d; best = w; } });
    return best;
  }
  function fixQuery(q) { return q.map(fixWord); }
  function mark(text, q) {
    var out = esc(text);
    q.filter(function (w) { return w.length > 1; }).forEach(function (w) {
      out = out.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
    });
    return out;
  }
  var items = [], active = -1, seq = 0, timer = 0, kbHits = [], kbFor = '';
  function closeSug() { box.classList.remove('open'); box.innerHTML = ''; items = []; active = -1; input.setAttribute('aria-expanded', 'false'); }
  function paintSug(raw) {
    var q = words(raw), fixed = fixQuery(q), fix = fixed.join(' ') !== q.join(' ') ? fixed.join(' ') : '';
    items = fix ? [{ fix: fix, t: 'Did you mean ' + fix + '?' }] : [];
    items = items.concat(localHits(q).map(function (x) { return { t: x.t, h: x.h, g: x.g, s: x.b }; }));
    q = q.concat(fixed);
    if (kbFor === raw) {
      var have = {}; items.forEach(function (i) { have[i.h] = 1; });
      kbHits.forEach(function (r) {
        var h = '/hub/kb.html?p=' + encodeURIComponent(r.slug);
        if (have[h]) return;
        var sec = secBy[r.section];
        items.push({ t: r.title, h: h, g: (sec ? sec.title + ' › ' : '') + (r.group_name || 'Page'), s: r.snippet ? '…' + r.snippet + '…' : '' });
      });
    }
    items.push({ all: true, t: 'See all results for “' + raw + '”' });
    box.innerHTML = items.map(function (it, i) {
      if (it.fix) return '<a class="kb-result sr-fix' + (i === active ? ' active' : '') + '" role="option" href="#" data-i="' + i + '">Did you mean <b>' + esc(it.fix) + '</b>?</a>';
      if (it.all) return '<a class="kb-result sr-all' + (i === active ? ' active' : '') + '" role="option" href="#" data-i="' + i + '">' + esc(it.t) + '</a>';
      return '<a class="kb-result' + (i === active ? ' active' : '') + '" role="option" href="' + esc(it.h) + '" data-i="' + i + '">' +
        '<div class="kb-result-group">' + esc(it.g || '') + '</div>' +
        '<div class="kb-result-title">' + mark(it.t, q) + '</div>' +
        (it.s ? '<div class="kb-result-snip">' + mark(it.s, q) + '</div>' : '') + '</a>';
    }).join('');
    box.classList.add('open');
    input.setAttribute('aria-expanded', 'true');
  }
  function submitQuery() {
    var q = input.value.trim().slice(0, 200);
    if (!q) { input.focus(); return; }
    location.href = (dash ? '/' : '/hub/') + '?q=' + encodeURIComponent(q);
  }
  input.addEventListener('input', function () {
    clearTimeout(timer);
    var raw = input.value.trim();
    active = -1;
    if (raw.length < 2) { ++seq; closeSug(); return; }
    paintSug(raw);
    var mine = ++seq;
    timer = setTimeout(async function () {
      var r = await c.rpc('kb_search', { q: raw });
      var rows = r.error ? [] : (r.data || []);
      // Nothing for the words as typed: try them as Team Home's own words spell them.
      var fixed = fixQuery(words(raw)).join(' ');
      if (!rows.length && fixed && fixed !== words(raw).join(' ')) {
        r = await c.rpc('kb_search', { q: fixed });
        rows = r.error ? [] : (r.data || []);
      }
      if (mine !== seq) return;                       // typed on since
      if (KB.viewAs) rows = rows.filter(function (it) { return KB.allowed.indexOf(it.section) >= 0 && KB.shows(it.slug); });
      kbHits = rows.slice(0, 5); kbFor = raw;
      if (input.value.trim() === raw) paintSug(raw);
    }, 220);
  });
  input.addEventListener('focus', function () { if (input.value.trim().length >= 2) paintSug(input.value.trim()); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (box.classList.contains('open')) { e.preventDefault(); closeSug(); } return; }
    if (!box.classList.contains('open')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      active = e.key === 'ArrowDown' ? Math.min(active + 1, items.length - 1) : Math.max(active - 1, -1);
      box.querySelectorAll('.kb-result').forEach(function (a, i) { a.classList.toggle('active', i === active); });
      if (active >= 0) box.querySelectorAll('.kb-result')[active].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && active >= 0 && items[active] && !items[active].all) {
      e.preventDefault();
      if (items[active].fix) useFix(items[active].fix); else location.href = items[active].h;
    }
  });
  box.addEventListener('click', function (e) {
    var a = e.target.closest('.kb-result');
    if (a && a.classList.contains('sr-all')) { e.preventDefault(); submitQuery(); }
    else if (a && a.classList.contains('sr-fix')) { e.preventDefault(); useFix(items[+a.dataset.i].fix); }
  });
  // "Did you mean": the corrected words go into the bar and the suggestions are drawn again for them.
  function useFix(text) {
    input.value = text;
    input.dispatchEvent(new Event('input'));
    input.focus();
  }
  box.addEventListener('mousedown', function (e) { e.preventDefault(); });   // keep the bar focused while choosing
  document.addEventListener('click', function (e) { if (!box.contains(e.target) && e.target !== input) closeSug(); });

  document.getElementById('srForm').addEventListener('submit', function (e) { e.preventDefault(); submitQuery(); });
  // / jumps to the bar, as it does everywhere else on the site.
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== input && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault(); input.focus();
    }
  });
})();
</script>
</body>
</html>
