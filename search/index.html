<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Search · Tara Rose Salons</title>
<script>
  // The dashboard's theme setting, before the first paint.
  try { var t = localStorage.getItem('trs-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-96x96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon-96x96.png">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2D2E37" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Kate, 8 Oct 2026: the second front door. Team Home is the first (/hub/); this is the
     plain search page, the way Google opens: the logo, one bar, nothing else. The tokens
     and logo are Team Home's (hub.css); the search itself happens where the signed-in
     person's access lives: the dashboard's results page for dashboard people (/?q=), Team
     Home's own search for staff (/hub/?q=). -->
<link rel="stylesheet" href="/hub/hub.css?v=20261008ss">
<style>
  body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  body.sr-wait .sr-main{visibility:hidden}
  .sr-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px 12vh;text-align:center}
  .sr-main .kb-brand img{width:min(260px,62vw)}
  .sr-main .kb-brand span{font-size:13px;margin-top:2px}
  .sr-hello{margin:28px 0 14px;font:400 15px/1.4 'Inter',system-ui,sans-serif;color:var(--muted)}
  .sr-form{width:100%;max-width:600px}
  .sr-bar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:0 22px;height:46px;box-shadow:var(--shadow);
    transition:box-shadow .2s var(--ease),border-color .2s var(--ease)}
  .sr-bar:hover{box-shadow:var(--shadow-hover)}
  .sr-bar:focus-within{border-color:var(--text);box-shadow:0 0 0 3px rgba(153,246,228,.45),var(--shadow-hover)}
  .sr-bar svg{width:19px;height:19px;flex-shrink:0;color:var(--muted)}
  .sr-bar input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--text)}
  .sr-bar input::placeholder{color:var(--muted2)}
  .sr-bar input::-webkit-search-cancel-button{display:none}
  .sr-go{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap}
  .sr-btn{appearance:none;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);
    border-radius:8px;padding:10px 20px;font:500 14px/1 'Inter',system-ui,sans-serif;text-decoration:none;
    transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
  .sr-btn:hover{border-color:var(--text);box-shadow:var(--shadow)}
  .sr-btn:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(153,246,228,.6)}
  .sr-hint{margin:22px 0 0;font-size:13px;color:var(--muted2)}
  .sr-hint kbd{font:inherit;font-size:11px;border:1px solid var(--border);border-radius:4px;padding:1px 6px;background:var(--surface)}
  .sr-foot{padding:18px 20px calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--muted2)}
  .sr-foot a{margin:0 8px}
  /* Shortcuts, as Chrome's new tab has them: what you starred, then what you open most. */
  .sr-tiles{margin-top:34px;width:100%;max-width:780px}
  .sr-tiles-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px}
  .sr-tile{width:100px;display:flex;flex-direction:column;align-items:center;gap:9px;padding:10px 4px 8px;border-radius:14px;
    text-decoration:none;color:var(--text);transition:background .15s var(--ease)}
  .sr-tile:hover{background:var(--surface2)}
  .sr-tile:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(153,246,228,.6)}
  .sr-ic{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--c);
    color:#1A1A1A;font:600 20px/1 'Inter',system-ui,sans-serif;box-shadow:var(--shadow)}
  .sr-star{position:absolute;right:-4px;top:-4px;width:19px;height:19px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:#C9971A}
  .sr-star svg{width:11px;height:11px;fill:currentColor}
  .sr-lbl{font:500 13px/1.25 'Inter',system-ui,sans-serif;text-align:center;max-width:100%;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .sr-cap{margin:8px 0 0;font-size:12px;color:var(--muted2)}
  .sr-theme{position:fixed;top:14px;right:16px;z-index:5;appearance:none;cursor:pointer;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);border-radius:999px;padding:8px 16px;font:500 13px/1 'Inter',system-ui,sans-serif}
  .sr-theme:hover{color:var(--text);border-color:var(--text)}
  @media (max-width:560px){
    .sr-tile{width:84px}
    .sr-bar{height:46px;padding:0 18px}
    .sr-bar input{font-size:16px}
    .sr-btn{flex:1}
  }
</style>
</head>
<body class="sr-wait">
<button type="button" class="sr-theme" id="srTheme"></button>
<main class="sr-main">
  <a class="kb-brand" href="/hub/" aria-label="Tara Rose Salons, Team Home">
    <img class="kb-logo-light" src="/assets/mast-ink.png" alt="Tara Rose">
    <img class="kb-logo-dark" src="/assets/mast-paper.png" alt="Tara Rose">
    <span>Salons</span>
  </a>
  <p class="sr-hello" id="srHello"></p>
  <form class="sr-form" id="srForm" role="search" autocomplete="off">
    <div class="sr-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="srIn" name="q" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
        placeholder="Find a treatment, policy or how-to" aria-label="Search">
    </div>
    <div class="sr-go">
      <button type="submit" class="sr-btn">Search</button>
      <a class="sr-btn" href="/hub/">Team Home</a>
      <a class="sr-btn hide" id="srDash" href="/?view=dashboard">Dashboard</a>
    </div>
  </form>
  <p class="sr-hint" id="srHint"></p>
  <nav class="sr-tiles hide" id="srTiles" aria-label="Your shortcuts"><div class="sr-tiles-row" id="srTilesRow"></div><p class="sr-cap" id="srCap"></p></nav>
</main>
<footer class="sr-foot">For the Tara Rose Salons team only. <a href="/privacy/">Privacy</a></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=20261001kb"></script>
<script>
(async function () {
  var back = '/?next=' + encodeURIComponent('/search/');
  var c = TRSAuth.client();
  var s = (await c.auth.getSession()).data.session;
  if (!s) { location.replace(back); return; }
  // On either list (dashboard_users, or Team Home's kb_access), as Team Home checks it.
  var acc = await c.rpc('kb_access');
  if (acc.error || !acc.data) { location.replace(back); return; }
  var me = await TRSAuth.me().catch(function () { return null; });
  var role = await TRSAuth.role().catch(function () { return null; });
  // The dashboard's search reads the UAE; a Bahrain-scoped sign-in has none (search.js
  // open()), so it searches Team Home like staff do.
  var dash = !!role && !(me && me.scope);

  var first = ((me && me.name) || '').split(/[\s(]/)[0];
  if (!first) {
    var n = await c.rpc('kb_me');
    first = (!n.error && n.data || '').split(/[\s(]/)[0];
  }
  if (first) document.getElementById('srHello').textContent = 'Hello, ' + first;

  var input = document.getElementById('srIn');
  if (dash) {
    input.placeholder = 'Find anything, or ask a question';
    document.getElementById('srDash').classList.remove('hide');
    document.getElementById('srHint').textContent = 'Staff, branches, pages, clients, services and Team Home. Ask it the way you would say it.';
  } else {
    document.getElementById('srHint').textContent = 'Treatments, policies and how-tos.';
  }
  document.body.classList.remove('sr-wait');
  input.focus();

  // Light and dark: the dashboard's own setting (trs-theme), the same switch Team Home has.
  var tbtn = document.getElementById('srTheme');
  function theme() {
    var t = document.documentElement.getAttribute('data-theme');
    return t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function paintTheme() { tbtn.textContent = theme() === 'dark' ? 'Light mode' : 'Dark mode'; }
  tbtn.addEventListener('click', function () {
    var next = theme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('trs-theme', next); } catch (e) {}
    paintTheme();
  });
  paintTheme();

  // Shortcuts: what you starred (kept per person, the same stars as Team Home and the
  // dashboard sidebar), then what you open most (counted in this browser by visits.js).
  var DASH = { dashboard: 'Organisation Pulse', branchperf: 'Branch Performance', compare: 'Comparison', team: 'Podium Race',
    teamquad: 'Staff Quadrant', staffperf: 'Staff Dashboards', staffweeks: 'Staff\u2019s 13 Week Report', stafflevels: 'Stylist\u2019s Benchmarks',
    stylists: 'Staff Cards', orgchart: 'Org Chart', products: 'Products', ledgerFinancials: 'Financial Totals',
    ledgerTargets: 'Daily Target Sheet', ledgerActuals: 'Actuals vs Targets', ledgerStylist: 'Daily Stylist Target',
    services: 'Service Rankings', clients: 'Top Clients', lostclients: 'Lost Clients', wvperf: 'Wellness Voucher Performance',
    reviews: 'Google Reviews', googleads: 'Google Ads', website: 'Website & Search' };
  var SECS = { 'full-loop': ['Service Playbooks', '/hub/full-loop'], 'hr-forms': ['HR Forms & Waivers', '/hub/forms'],
    'hair-sop': ['Hair SOPs', '/hub/kb.html?s=hair-sop'], 'hair-induction': ['Hair Induction & Onboarding', '/hub/kb.html?s=hair-induction'],
    'beauty-sop': ['Beauty SOPs', '/hub/kb.html?s=beauty-sop'], 'beauty-induction': ['Beauty Induction & Onboarding', '/hub/kb.html?s=beauty-induction'],
    'front-desk': ['Front Desk & Policies', '/hub/kb.html?s=front-desk'], 'front-desk-induction': ['Front Desk Induction & Onboarding', '/hub/kb.html?s=front-desk-induction'],
    'call-centre': ['Call Centre Scripts & Policies', '/hub/kb.html?s=call-centre'], 'call-centre-induction': ['Call Centre Induction & Onboarding', '/hub/kb.html?s=call-centre-induction'],
    marketing: ['Marketing Workspace', '/hub/marketing'], access: ['Staff Roster & Access', '/hub/roster'], uploads: ['Upload Portal', '/upload/'] };
  var PALETTE = ['var(--accent-mint)', 'var(--accent-lavender)', 'var(--accent-butter)', 'var(--accent-coral)'];
  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/></svg>';
  var MAX_TILES = 8;
  (async function () {
    var tiles = [], seen = {};
    function add(t, h, star) {
      if (!t || !h || seen[h] || tiles.length >= MAX_TILES) return;
      seen[h] = 1; tiles.push({ t: t, h: h, star: !!star });
    }
    try {
      var f = await c.from('kb_favourites').select('section');
      var slugs = [];
      ((f.data) || []).forEach(function (r) {
        var k = r.section || '';
        if (k.indexOf('d:') === 0) { if (dash && DASH[k.slice(2)]) add(DASH[k.slice(2)], '/?view=' + k.slice(2), true); }
        else if (k.indexOf('p:') === 0) slugs.push(k.slice(2));
        else if (SECS[k]) add(SECS[k][0], SECS[k][1], true);
      });
      if (slugs.length) {
        var pr = await c.from('kb_pages').select('slug,title').in('slug', slugs);
        ((pr.data) || []).forEach(function (p) { add(p.title, '/hub/kb.html?p=' + encodeURIComponent(p.slug), true); });
      }
    } catch (e) { /* no favourites to show; the rest still can */ }
    try {
      var v = JSON.parse(localStorage.getItem('trs-visits') || '{}') || {};
      Object.keys(v).map(function (k) { return v[k]; })
        .sort(function (a, b) { return (b.n - a.n) || (b.ts - a.ts); })
        .forEach(function (e) {
          if (e.h && e.h.indexOf('/?view=') === 0 && !dash) return;
          add(e.t, e.h, false);
        });
    } catch (e) { /* private window: no counts */ }
    var nav = document.getElementById('srTiles');
    if (!tiles.length) {
      document.getElementById('srCap').textContent = 'Star a page and it will wait here. So will the ones you open most.';
      nav.classList.remove('hide');
      return;
    }
    function esc(x) { return String(x).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
    document.getElementById('srTilesRow').innerHTML = tiles.map(function (t, i) {
      var letter = (t.t.match(/[A-Za-z0-9]/) || ['\u2022'])[0].toUpperCase();
      return '<a class="sr-tile" href="' + esc(t.h) + '" title="' + esc(t.t) + '"><span class="sr-ic" style="--c:' + PALETTE[i % PALETTE.length] + '">' +
        letter + (t.star ? '<span class="sr-star">' + STAR + '</span>' : '') + '</span><span class="sr-lbl">' + esc(t.t) + '</span></a>';
    }).join('');
    document.getElementById('srCap').textContent = tiles.some(function (t) { return t.star; }) ? 'Starred pages first, then the ones you open most.' : 'The pages you open most.';
    nav.classList.remove('hide');
  })();

  document.getElementById('srForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = input.value.trim().slice(0, 200);
    if (!q) { input.focus(); return; }
    location.href = (dash ? '/' : '/hub/') + '?q=' + encodeURIComponent(q);
  });
  // / jumps to the bar, as it does everywhere else on the site.
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== input && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault(); input.focus();
    }
  });
})();
</script>
</body>
</html>
