<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Tara Rose Salons</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script>
  // GitHub Pages serves this file for any address that has no page of its own.
  // A stylist's name link, /me/<name>-<code> (Kate, 1 Oct 2026), is one of those:
  // there is deliberately no file per stylist, because this repository is public
  // and a folder per person would list every link. It goes on to her My Numbers
  // page, which swaps the slug for her token (perf_slug_token).
  (function () {
    var m = location.pathname.match(/^\/me\/([a-z0-9-]+)\/?$/i);
    if (m) location.replace('/performance/?s=' + encodeURIComponent(m[1].toLowerCase()));
  })();
</script>
<style>
  :root{--bg:#FAF8F3;--text:#2D2E37;--muted:#6E6E77}
  @media (prefers-color-scheme:dark){:root{--bg:#1A1B22;--text:#FAF8F3;--muted:rgba(250,248,243,.6)}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
    font-family:Inter,system-ui,sans-serif;padding:16px;box-sizing:border-box;text-align:center}
  h1{font-family:Georgia,serif;font-weight:400;font-size:28px;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 18px;line-height:1.5}
  a{color:var(--text)}
</style>
</head>
<body>
  <main>
    <h1>This page isn't here</h1>
    <p>The link may be old or mistyped.</p>
    <a href="/">Go to the dashboard</a>
  </main>
</body>
</html>
