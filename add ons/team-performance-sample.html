<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tara Rose · Team Performance — three sample directions</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   TEAM PERFORMANCE — SAMPLE, three directions in one file. Kate, 2026-08-14.

   Not wired to anything. The numbers below are invented but shaped like the real
   ones (aggData()'s per-stylist fields, the ledger's Target / MTD / Variance
   spine) so the layouts get stress-tested at realistic magnitudes: 27 hair, a
   short beauty bench, four branches, one of them hair-only.

   Tokens are copied verbatim from index.html so what you see here is what the
   dashboard would look like. Photos are read from ../assets/staff/, the same
   PNGs the Stylist Cards view uses, and fall back to initials when missing —
   the beauty team has no cards in the deck yet.
   ═══════════════════════════════════════════════════════════════════════════ */

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --accent-mint:#99F6E4;--accent-butter:#EEF3C7;--accent-lavender:#C4B5FD;--accent-coral:#FF9B9B;
  --radius-card:10px;
  --card-ease:cubic-bezier(.2,.7,.2,1);
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;--s6:48px;
}
[data-theme="light"]{
  --bg:#FAF7F0;--surface:#fff;--surface2:#F4F1E9;--border:#E8E2D6;--border2:#F0ECE3;
  --text:#1A1A1A;--muted:#565049;--muted2:#77706A;--accent:#1A1A1A;--accent-fg:#FBF7F0;
  --shadow-card:0 1px 2px rgba(26,26,26,0.05),0 10px 28px -8px rgba(26,26,26,0.10);
  --shadow-card-hover:0 2px 4px rgba(26,26,26,0.07),0 18px 40px -10px rgba(26,26,26,0.16);
  --shadow:var(--shadow-card);
  --good:#0F6E56;--good-bg:#E1F5EE;--warn:#BA7517;--warn-bg:#FAEEDA;--bad:#A32D2D;--bad-bg:#FCEBEB;
  --hair:#7C5CD4;--beauty:#0F8A72;
}
[data-theme="dark"]{
  --bg:#2D2E37;--surface:#383944;--surface2:#3f4052;--border:rgba(250,248,243,0.09);--border2:rgba(250,248,243,0.05);
  --text:#FAF8F3;--muted:rgba(250,248,243,0.68);--muted2:rgba(250,248,243,0.5);--accent:#FFD4D9;--accent-fg:#2D2E37;
  --shadow-card:0 1px 2px rgba(0,0,0,0.3),0 10px 28px -8px rgba(0,0,0,0.35);
  --shadow-card-hover:0 2px 4px rgba(0,0,0,0.35),0 20px 44px -10px rgba(0,0,0,0.45);
  --shadow:var(--shadow-card);
  --good:#99F6E4;--good-bg:rgba(153,246,228,0.12);--warn:#EEF3C7;--warn-bg:rgba(238,243,199,0.12);--bad:#FF9B9B;--bad-bg:rgba(255,155,155,0.12);
  --hair:#C4B5FD;--beauty:#99F6E4;
}

body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;font-weight:600}

/* ── SAMPLE CHROME — only the switcher. Not part of any proposal. ────────── */
.sample-bar{position:sticky;top:0;z-index:60;background:var(--bg);
  border-bottom:1px solid var(--border);padding:12px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sample-bar .brand{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;white-space:nowrap}
.sample-bar .brand span{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted2);display:block;margin-top:1px}
.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:999px;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.04em;
  padding:6px 14px;border-radius:999px;cursor:pointer;transition:background .18s,color .18s;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:700}
@media(hover:hover){.seg button:hover:not(.on){color:var(--text)}}
.ghost{appearance:none;padding:6px 13px;border-radius:999px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
@media(hover:hover){.ghost:hover{border-color:var(--accent);color:var(--text)}}
.sp{margin-left:auto}

.stage{max-width:1400px;margin:0 auto;padding:18px 20px 80px}

/* The one-paragraph brief above each direction. Sample-only. */
.brief{border-left:2px solid var(--accent);padding:2px 0 2px 14px;margin:4px 0 22px;
  max-width:760px;color:var(--muted);font-size:13px;line-height:1.65}
.brief b{color:var(--text);font-weight:600}
.brief .q{font-family:'Playfair Display',serif;font-size:17px;color:var(--text);display:block;margin-bottom:5px}

.sec{display:flex;align-items:center;gap:8px;margin:26px 0 10px;
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sec i{width:8px;height:8px;border-radius:50%;background:var(--accent-coral);flex-shrink:0}
.sec .n{font-weight:500;letter-spacing:.04em;text-transform:none;font-size:11.5px;color:var(--muted2)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-card)}

/* ── SHARED BITS ─────────────────────────────────────────────────────────── */
.ph{border-radius:50%;object-fit:cover;object-position:top center;background:var(--surface2);flex-shrink:0}
.ini{border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#2D2E37;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.tagline{font-size:10.5px;color:var(--muted2);letter-spacing:.04em}
.aed{font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;font-weight:600}

/* Benchmark meter — the four-across bar used in A and C. Colour is scored
   against target, never against the best performer: "green" has to mean
   "hit the number", or the board flatters a weak month. */
.mtr{min-width:0}
.mtr .lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted2);display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.mtr .val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;margin:1px 0 3px}
.mtr .trk{height:4px;border-radius:3px;background:var(--surface2);overflow:hidden;position:relative}
.mtr .fil{height:100%;border-radius:3px;transition:width .5s var(--card-ease)}
.mtr .tgt{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--muted2);opacity:.55}
.g .fil{background:var(--good)} .g .val{color:var(--good)}
.w .fil{background:var(--warn)} .w .val{color:var(--warn)}
.b .fil{background:var(--bad)}  .b .val{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;
  font-size:10px;font-weight:700;letter-spacing:.06em;border:1px solid var(--border);
  color:var(--muted);white-space:nowrap}
.pill.hair{color:var(--hair);border-color:color-mix(in srgb,var(--hair) 35%,transparent)}
.pill.beauty{color:var(--beauty);border-color:color-mix(in srgb,var(--beauty) 35%,transparent)}

/* ═══ DIRECTION A — THE LINE-UP ═══════════════════════════════════════════ */
.lu-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 0 12px;border-bottom:1px solid var(--border);margin-bottom:2px}
.chip{appearance:none;border:1px solid var(--border);background:transparent;color:var(--muted);
  font:inherit;font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:999px;cursor:pointer;
  transition:.18s;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
@media(hover:hover){.chip:hover:not(.on){border-color:var(--accent);color:var(--text)}}

.lu-hd,.lu-row{display:grid;gap:14px;align-items:center;
  grid-template-columns:26px minmax(190px,1.3fr) repeat(4,minmax(78px,1fr)) 116px 22px}
.lu-hd{padding:8px 14px;font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted2)}
.lu-row{padding:11px 14px;border-top:1px solid var(--border);cursor:pointer;
  transition:background .16s}
@media(hover:hover){.lu-row:hover{background:var(--surface2)}}
.lu-row .rk{font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums;text-align:right}
.lu-who{display:flex;align-items:center;gap:10px;min-width:0}
.lu-who .ph,.lu-who .ini{width:38px;height:38px;font-size:12px}
.lu-nm{font-weight:600;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu-sub{font-size:10.5px;color:var(--muted2);display:flex;align-items:center;gap:5px;margin-top:2px;white-space:nowrap}
.lu-rev{text-align:right}
.lu-rev .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.lu-rev .s{font-size:10px;color:var(--muted2)}
.lu-chev{color:var(--muted2);font-size:11px;transition:transform .2s;text-align:center}
.lu-item.open .lu-chev{transform:rotate(180deg)}
.lu-item.open .lu-row{background:var(--surface2)}
.lu-dr{display:none;padding:4px 14px 18px;border-top:1px solid var(--border2);background:var(--surface2)}
.lu-item.open .lu-dr{display:block}
.dr-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:12px}
.dr-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 13px}
.dr-t{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}
.kv span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.stack{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:6px 0 8px;background:var(--surface2)}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:10.5px;color:var(--muted)}
.lg i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.spark{display:flex;align-items:flex-end;gap:4px;height:52px;margin-top:4px}
.spark div{flex:1;background:var(--accent-lavender);border-radius:2px 2px 0 0;min-height:3px;position:relative}
[data-theme="light"] .spark div{background:#B9A6FB}
.spark span{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:8.5px;color:var(--muted2)}

/* ═══ DIRECTION B — THE COACH'S BOARD ═════════════════════════════════════ */
.cb-top{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:6px}
.cb-brx{padding:14px 15px}
.cb-brx .h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cb-brx .big{font-family:'Playfair Display',serif;font-size:27px;font-weight:600;margin:8px 0 1px;font-variant-numeric:tabular-nums}
.cb-brx .sub{font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums}
.cb-brx .trk{height:6px;border-radius:4px;background:var(--surface2);margin-top:10px;position:relative;overflow:visible}
.cb-brx .fil{height:100%;border-radius:4px}
.pace{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1px dashed var(--muted2);opacity:.75}
.pace b{position:absolute;top:-16px;left:-15px;width:30px;text-align:center;
  font-size:8.5px;font-weight:600;color:var(--muted2);letter-spacing:.04em}

.cb-grp{margin-top:18px}
.cb-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.cb-c{padding:13px 14px;display:flex;gap:12px;align-items:flex-start}
.cb-c .ph,.cb-c .ini{width:44px;height:44px;font-size:13px}
.cb-c .nm{font-weight:600;font-size:14.5px;line-height:1.2}
.cb-c .rl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-top:3px}
.cb-body{flex:1;min-width:0}
.cb-fig{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:9px}
.cb-fig .m{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.cb-fig .t{font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums}
.cb-trk{height:7px;border-radius:4px;background:var(--surface2);margin-top:7px;position:relative;overflow:visible}
.cb-fil{height:100%;border-radius:4px}
.cb-foot{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:11px;font-variant-numeric:tabular-nums}
.var{font-weight:700}
.var.up{color:var(--good)} .var.dn{color:var(--bad)}
.cb-flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.flag{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  border-radius:999px;padding:2px 8px;border:1px solid transparent}
.flag.bad{color:var(--bad);background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 28%,transparent)}
.flag.warn{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.flag.good{color:var(--good);background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 28%,transparent)}

/* ═══ DIRECTION C — PODIUM + COMPARE TRAY ════════════════════════════════ */
.pod{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pod-c{padding:0;overflow:hidden;position:relative}
.pod-top{padding:16px 16px 12px;display:flex;gap:13px;align-items:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 20%,transparent),transparent)}
.pod-c .ph,.pod-c .ini{width:64px;height:64px;font-size:17px;box-shadow:0 0 0 2px var(--pc)}
.pod-rk{position:absolute;top:10px;right:12px;font-family:'Playfair Display',serif;
  font-size:30px;font-weight:700;color:var(--pc);opacity:.55;line-height:1}
.pod-nm{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;line-height:1.15}
.pod-rl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-top:3px}
.pod-fig{padding:0 16px 14px}
.pod-fig .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.pod-fig .l{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
.pod-mtrs{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:12px 16px 14px;border-top:1px solid var(--border)}

.gr{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
.gr-c{padding:11px 12px;display:flex;align-items:center;gap:10px;position:relative}
.gr-c .ph,.gr-c .ini{width:36px;height:36px;font-size:11.5px}
.gr-nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-sub{font-size:10.5px;color:var(--muted2);font-variant-numeric:tabular-nums;margin-top:2px}
.add{appearance:none;margin-left:auto;width:26px;height:26px;border-radius:50%;flex-shrink:0;
  border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;
  font-size:15px;line-height:1;transition:.18s}
@media(hover:hover){.add:hover{border-color:var(--accent);color:var(--text)}}
.add.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.tray{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);
  border-top:1px solid var(--border);box-shadow:0 -12px 34px -18px rgba(0,0,0,.5);
  transform:translateY(101%);transition:transform .3s var(--card-ease)}
.tray.up{transform:none}
.tray-in{max-width:1400px;margin:0 auto;padding:12px 20px 16px}
.tray-hd{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px}
.tray-cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.tray-col{border:1px solid var(--border);border-radius:8px;padding:11px 12px}
.tray-col .who{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.tray-col .ph,.tray-col .ini{width:32px;height:32px;font-size:11px}
.tray-col .who div{min-width:0}
.tray-col .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray-mtrs{display:grid;gap:9px}
.tray-empty{color:var(--muted2);font-size:12px;padding:6px 0 2px}
.x{appearance:none;border:0;background:transparent;color:var(--muted2);cursor:pointer;
  font-size:15px;line-height:1;margin-left:auto;padding:0 2px}

@media(max-width:900px){
  .lu-hd{display:none}
  .lu-row{grid-template-columns:24px 1fr 22px;row-gap:10px}
  .lu-row .mtr{grid-column:2/4}
  .lu-row .lu-rev{grid-column:2/4;text-align:left}
  .lu-mtrs-m{grid-column:2/4;display:grid;grid-template-columns:1fr 1fr;gap:10px}
}
@media(max-width:600px){
  .stage{padding:14px 14px 80px}
  .sample-bar{padding:10px 14px}
  /* Three long labels in one nowrap row are wider than a 375px phone, and the
     whole page picked up a sideways scroll from the switcher alone. */
  .seg{flex-wrap:wrap}
  .seg button{padding:6px 10px;font-size:11px}
  .sample-bar .sp{margin-left:0}
}
</style>
</head>
<body>

<div class="sample-bar">
  <div class="brand">Team Performance<span>sample · three directions</span></div>
  <div class="seg" id="dirSeg">
    <button class="on" data-d="A">A · The Line-up</button>
    <button data-d="B">B · Coach's Board</button>
    <button data-d="C">C · Podium + Compare</button>
  </div>
  <div class="sp"></div>
  <button class="ghost" onclick="toggleTheme()"><span id="thLbl">Dark</span></button>
</div>

<main class="stage" id="stage"></main>

<!-- Direction C's compare tray. Lives outside the stage so it can be fixed. -->
<div class="tray" id="tray">
  <div class="tray-in">
    <div class="tray-hd">Comparing <span id="trayN">0</span> of 3
      <button class="ghost" style="margin-left:auto" onclick="clearTray()">Clear</button>
    </div>
    <div class="tray-cols" id="trayCols"></div>
  </div>
</div>

<script>
/* ═══ MOCK DATA ══════════════════════════════════════════════════════════════
   Shaped like a real August MTD read: 14 days in, so most targets sit around
   40-55% done. Fields mirror the ones the dashboard already computes per
   stylist, plus the ledger's target column that the dashboard does not have yet.
   ════════════════════════════════════════════════════════════════════════════ */
const BRANCH = {
  KCA:{name:'Khalifa City',color:'#FFD4D9'},
  SAA:{name:'Saadiyat',    color:'#C4B5FD'},
  MC: {name:'Motor City',  color:'#99F6E4'},
  AQ: {name:'AQ Ladies',   color:'#FF9B9B'},
};
const TARGETS = {rebookPct:45, treatmentPct:20, retailPct:12, hairAvgBill:650, beautyAvgBill:200};
const DAY_OF_MONTH = 14, DAYS_IN_MONTH = 31;

// name, role, branch, beauty?, photo, [net, target, rebook%, treatment%, retail%, avgBill, clients, new, rebooked]
const RAW = [
  ['Emma Williamson','Style Director','SAA',0,'emma.png',   88400,150000,57,26,15,880,101,14,58],
  ['Tegan Skinner','Style Director','KCA',0,'tegan.png',    81200,140000,52,24,13,810, 99,11,52],
  ['Lucy Glow','Style Director','MC',0,'lucy.png',          76900,135000,49,21,11,760, 98,17,48],
  ['Alan Joseph','Style Director','MC',0,'alan.png',        71500,132000,44,19,10,720, 97,12,43],
  ['Jeida Rivera','Style Director','SAA',0,'jeida.png',     68300,125000,46,22, 9,740, 90, 9,41],
  ['Ashleigh Fairgrieve','Style Director','MC',0,'ashleigh.png',65100,124000,41,17,12,700,92,15,38],
  ['Ruth Nabeel','Style Director','AQ',0,'ruth.png',        61800,120000,38,15, 8,660, 91,19,35],
  ['Kate Sirik','Style Director','KCA',0,'kate.png',        59400,118000,50,23,14,690, 84, 8,42],
  ['Holly Bennett','Senior Stylist','SAA',0,'holly.png',    54200,105000,43,18,11,640, 83,13,36],
  ['Molly Robinson','Senior Stylist','SAA',0,'molly.png',   51700,102000,45,20,10,620, 82,10,37],

const AVCOL = ['#FFD4D9','#C4B5FD','#99F6E4','#EEF3C7','#FF9B9B','#FCD4A0'];
const TEAM = RAW.map((r,i)=>{
  const [name,role,branch,beauty,photo,net,target,rebookPct,treatmentPct,retailPct,avgBill,total,newC,rebooked]=r;
  return {id:i,name,role,branch,beauty:!!beauty,photo,net,target,rebookPct,treatmentPct,retailPct,
    avgBill,total,newC,rebooked,
    // Derived the way the real view would: services = net minus retail, retail from its %.
    retail:Math.round(net*retailPct/100),
    treatments:Math.round(net*treatmentPct/100),
    services:Math.round(net*(100-retailPct-treatmentPct)/100),
    ncr:Math.round(newC*0.55), colour:AVCOL[i%AVCOL.length],
    // Four mock weeks so the drawer has a trend to draw.
    weeks:[0.9,1.05,0.95,1.1].map(k=>Math.round(net/4*k)),
  };
});

/* ═══ HELPERS ════════════════════════════════════════════════════════════ */
const aed=n=>'AED '+Math.round(n).toLocaleString('en-GB');
const aedK=n=>n>=1000?'AED '+(n/1000).toFixed(n>=10000?0:1)+'k':'AED '+Math.round(n);
const pct=n=>(Math.round(n*10)/10)+'%';
const ini=n=>n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Scored against target, not against the field. 100%+ good, 80%+ warn, below bad.
function band(val,target){const r=target?val/target:0;return r>=1?'g':r>=0.8?'w':'b';}

function avatar(s,cls){
  if(s.photo) return `<img class="ph ${cls||''}" src="../assets/staff/${s.photo}" alt=""
    onerror="this.replaceWith(Object.assign(document.createElement('div'),
      {className:'ini ${cls||''}',textContent:'${ini(s.name)}',style:'background:${s.colour}'}))">`;
  return `<div class="ini ${cls||''}" style="background:${s.colour}">${ini(s.name)}</div>`;
}

function meter(label,val,target,fmt){
  const b=band(val,target), w=Math.max(3,Math.min(100,target?val/target*100:0));
  // Target tick sits where 100% of target would be — i.e. always at the bar's
  // own scale point, so a stylist at 130% overshoots visibly past the tick.
  const scale=Math.max(100,w), tick=100/scale*100;
  return `<div class="mtr ${b}">
    <div class="lbl"><span>${label}</span><span>${fmt(target)}</span></div>
    <div class="val">${fmt(val)}</div>
    <div class="trk"><div class="tgt" style="left:${tick}%"></div>
      <div class="fil" style="width:${w/scale*100}%"></div></div>
  </div>`;
}
function meters(s){
  const ab = s.beauty?TARGETS.beautyAvgBill:TARGETS.hairAvgBill;
  const out=[meter('Rebook',s.rebookPct,TARGETS.rebookPct,pct)];
  if(!s.beauty) out.push(meter('Treatment',s.treatmentPct,TARGETS.treatmentPct,pct));
  out.push(meter('Retail',s.retailPct,TARGETS.retailPct,pct));
  out.push(meter('Avg bill',s.avgBill,ab,v=>Math.round(v).toLocaleString('en-GB')));
  return out;
}

/* ═══ DIRECTION A — THE LINE-UP ═════════════════════════════════════════════
   One row per person, the whole team in one scan, four benchmarks read as bars
   rather than as a wall of percentages. The row opens in place, so you never
   lose your position in the list — the fault the current view has, where
   clicking a stylist scrolls you to a panel somewhere else.
   ═══════════════════════════════════════════════════════════════════════════ */
let luDept='hair', luBranch='all', luSort='net', luOpen=null;

function renderA(){
  const list=TEAM
    .filter(s=>luDept==='all'|| (luDept==='hair'?!s.beauty:s.beauty))
    .filter(s=>luBranch==='all'||s.branch===luBranch)
    .sort((a,b)=>(b[luSort]||0)-(a[luSort]||0));

  const chips=(id,val,opts)=>opts.map(o=>
    `<button class="chip${val===o[0]?' on':''}" onclick="setA('${id}','${o[0]}')">${o[1]}</button>`).join('');

  return `
  <div class="brief">
    <span class="q">"Who is where, and against what?"</span>
    The whole team as <b>one ranked list</b>, four benchmark bars read against target on every
    row — green only ever means <b>hit the number</b>, never "best of a bad month". A row
    <b>opens in place</b>: revenue split, client mix, four-week trend, no scroll away from your spot.
  </div>

  <div class="lu-bar">
    <div class="seg">${chips('dept',luDept,[['hair','Hair'],['beauty','Beauty'],['all','Everyone']])}</div>
    ${chips('branch',luBranch,[['all','All branches'],['SAA','Saadiyat'],['KCA','Khalifa City'],['MC','Motor City'],['AQ','AQ Ladies']])}
    <div class="sp"></div>
    <span class="tagline">Sort</span>
    ${chips('sort',luSort,[['net','Net take'],['rebookPct','Rebook %'],['avgBill','Avg bill'],['total','Clients']])}
  </div>

  <div class="card" style="margin-top:14px;overflow:hidden">
    <div class="lu-hd">
      <div style="text-align:right">#</div><div>Stylist</div>
      <!-- Beauty carries no treatment target, so that column drops out rather
           than showing a bar scored against a number that does not apply. -->
      <div>Rebooking</div><div>${luDept==='beauty'?'Retail':'Treatment'}</div>
      <div>${luDept==='beauty'?'Avg bill':'Retail'}</div><div>${luDept==='beauty'?'':'Avg bill'}</div>
      <div style="text-align:right">Net take</div><div></div>
    </div>
    ${list.map((s,i)=>luItem(s,i)).join('')}
  </div>`;
}

function luItem(s,i){
  const m=meters(s), open=luOpen===s.id;
  return `<div class="lu-item${open?' open':''}">
    <div class="lu-row" onclick="luToggle(${s.id})">
      <div class="rk">${i+1}</div>
      <div class="lu-who">
        ${avatar(s)}
        <div style="min-width:0">
          <div class="lu-nm">${esc(s.name)}</div>
          <div class="lu-sub"><i class="dot" style="background:${BRANCH[s.branch].color}"></i>
            ${BRANCH[s.branch].name} · ${esc(s.role)}</div>
        </div>
      </div>
      ${m.slice(0,4).map(x=>x).join('')}${m.length<4?'<div></div>':''}
      <div class="lu-rev"><div class="v">${aedK(s.net)}</div>
        <div class="s">${s.total} clients</div></div>
      <div class="lu-chev">▾</div>
    </div>
    <div class="lu-dr">${open?luDrawer(s):''}</div>
  </div>`;
}

function luDrawer(s){
  const tot=s.services+s.treatments+s.retail, mx=Math.max(...s.weeks);
  const done=s.net/s.target*100;
  return `<div class="dr-grid">
    <div class="dr-box">
      <div class="dr-t">Revenue mix</div>
      <div class="stack">
        <div style="width:${s.services/tot*100}%;background:var(--accent-lavender)"></div>
        <div style="width:${s.treatments/tot*100}%;background:var(--accent-mint)"></div>
        <div style="width:${s.retail/tot*100}%;background:var(--accent-butter)"></div>
      </div>
      <div class="lg">
        <span><i style="background:var(--accent-lavender)"></i>Services ${aedK(s.services)}</span>
        <span><i style="background:var(--accent-mint)"></i>Treatments ${aedK(s.treatments)}</span>
        <span><i style="background:var(--accent-butter)"></i>Retail ${aedK(s.retail)}</span>
      </div>
    </div>
    <div class="dr-box">
      <div class="dr-t">Clients</div>
      <div class="kv"><span>Total</span><span>${s.total}</span></div>
      <div class="kv"><span>New</span><span>${s.newC}</span></div>
      <div class="kv"><span>New client requests</span><span>${s.ncr}</span></div>
      <div class="kv"><span>Rebooked</span><span>${s.rebooked}</span></div>
    </div>
    <div class="dr-box">
      <div class="dr-t">Against target</div>
      <div class="kv"><span>Month target</span><span>${aed(s.target)}</span></div>
      <div class="kv"><span>MTD actual</span><span>${aed(s.net)}</span></div>
      <div class="kv"><span>Variance</span><span class="var ${s.net>=s.target?'up':'dn'}">${s.net>=s.target?'+':'−'}${aed(Math.abs(s.net-s.target))}</span></div>
      <div class="kv"><span>% done</span><span>${pct(done)}</span></div>
    </div>
    <div class="dr-box">
      <div class="dr-t">Last four weeks</div>
      <div class="spark">${s.weeks.map((w,i)=>
        `<div style="height:${w/mx*100}%"><span>W${i+1}</span></div>`).join('')}</div>
      <div style="height:14px"></div>
    </div>
  </div>`;
}

function setA(k,v){ if(k==='dept')luDept=v; if(k==='branch')luBranch=v; if(k==='sort')luSort=v; luOpen=null; paint(); }
function luToggle(id){ luOpen = luOpen===id?null:id; paint(); }

/* ═══ DIRECTION B — THE COACH'S BOARD ══════════════════════════════════════
   Target-first, and deliberately the same spine as Emma's ledger: Target ·
   MTD Actual · Variance · % Done · Remaining. Sorted by the biggest gap, not
   by the biggest number, so the list reads as "who needs a conversation this
   week" rather than "who is already winning".

   The dashed pace tick is the one thing here the ledger does NOT do — the sheet
   compares % done to target only, never to elapsed days. Shown so you can decide
   whether to keep it. If it stays, it has to be visibly a different mark, or
   Emma's numbers stop matching her sheet.
   ═══════════════════════════════════════════════════════════════════════════ */
let cbBranch='all';

function renderB(){
  const pace=DAY_OF_MONTH/DAYS_IN_MONTH*100;
  const branches=Object.keys(BRANCH);
  const brSummary=branches.map(code=>{
    const team=TEAM.filter(s=>s.branch===code);
    const mtd=team.reduce((a,s)=>a+s.net,0), tgt=team.reduce((a,s)=>a+s.target,0);
    return {code,mtd,tgt,done:mtd/tgt*100,n:team.length};
  });

  const list=TEAM
    .filter(s=>cbBranch==='all'||s.branch===cbBranch)
    .map(s=>({...s,done:s.net/s.target*100,gap:s.target-s.net}))
    .sort((a,b)=>a.done-b.done);

  return `
  <div class="brief">
    <span class="q">"Who needs a conversation this week?"</span>
    The same spine as Emma's target sheet — <b>Target · MTD · Variance · % done · Remaining</b> —
    sorted by <b>furthest behind first</b>. Everyone carries the flags that explain the gap
    (rebooking, treatment, retail), so the coaching note is on the card, not three clicks away.
  </div>

  <div class="cb-top">
    ${brSummary.map(b=>{
      const bd=b.done>=pace?'good':b.done>=pace-12?'warn':'bad';
      return `<div class="card cb-brx">
        <div class="h"><i class="dot" style="background:${BRANCH[b.code].color}"></i>${BRANCH[b.code].name}</div>
        <div class="big">${pct(b.done)}</div>
        <div class="sub">${aedK(b.mtd)} of ${aedK(b.tgt)} · ${b.n} people</div>
        <div class="trk">
          <div class="fil" style="width:${Math.min(100,b.done)}%;background:var(--${bd})"></div>
          <div class="pace" style="left:${pace}%"><b>day ${DAY_OF_MONTH}</b></div>
        </div>
      </div>`;
    }).join('')}
  </div>

  <div class="lu-bar" style="margin-top:22px">
    <span class="tagline">Branch</span>
    ${['all',...branches].map(c=>
      `<button class="chip${cbBranch===c?' on':''}" onclick="cbBranch='${c}';paint()">${c==='all'?'All':BRANCH[c].name}</button>`).join('')}
    <div class="sp"></div>
    <span class="tagline">Furthest behind first · MTD to ${DAY_OF_MONTH} Aug</span>
  </div>

  <div class="cb-list" style="margin-top:14px">
    ${list.map(s=>cbCard(s,pace)).join('')}
  </div>`;
}

function cbCard(s,pace){
  const bd=s.done>=pace?'good':s.done>=pace-12?'warn':'bad';
  const flags=[];
  if(s.rebookPct<TARGETS.rebookPct*0.8) flags.push(['bad','Rebooking '+pct(s.rebookPct)]);
  else if(s.rebookPct<TARGETS.rebookPct) flags.push(['warn','Rebooking '+pct(s.rebookPct)]);
  else flags.push(['good','Rebooking '+pct(s.rebookPct)]);
  if(!s.beauty){
    if(s.treatmentPct<TARGETS.treatmentPct*0.8) flags.push(['bad','Treatment '+pct(s.treatmentPct)]);
    else if(s.treatmentPct<TARGETS.treatmentPct) flags.push(['warn','Treatment '+pct(s.treatmentPct)]);
  }
  if(s.retailPct<TARGETS.retailPct*0.8) flags.push(['bad','Retail '+pct(s.retailPct)]);
  else if(s.retailPct<TARGETS.retailPct) flags.push(['warn','Retail '+pct(s.retailPct)]);

  return `<div class="card cb-c">
    ${avatar(s)}
    <div class="cb-body">
      <div class="nm">${esc(s.name)}</div>
      <div class="rl">${esc(s.role)} · ${BRANCH[s.branch].name}</div>
      <div class="cb-fig">
        <span class="m">${aedK(s.net)}</span>
        <span class="t">of ${aedK(s.target)}</span>
      </div>
      <div class="cb-trk">
        <div class="cb-fil" style="width:${Math.min(100,s.done)}%;background:var(--${bd})"></div>
        <div class="pace" style="left:${pace}%"></div>
      </div>
      <div class="cb-foot">
        <span class="var ${s.gap<=0?'up':'dn'}">${s.gap<=0?'+':'−'}${aedK(Math.abs(s.gap))}</span>
        <span style="color:var(--muted2)">${pct(s.done)} done · ${aedK(Math.max(0,s.gap))} left</span>
      </div>
      <div class="cb-flags">${flags.map(f=>`<span class="flag ${f[0]}">${f[1]}</span>`).join('')}</div>
    </div>
  </div>`;
}

/* ═══ DIRECTION C — PODIUM + COMPARE TRAY ══════════════════════════════════
   Closest to what is there now, rebuilt around the photos: a top three that
   reads as a result, the rest as a dense grid, and comparison as a TRAY you
   fill by tapping "+" — no three dropdowns to set before anything draws.
   ═══════════════════════════════════════════════════════════════════════════ */
let cSel=[], cDept='hair';

function renderC(){
  const list=TEAM.filter(s=>cDept==='hair'?!s.beauty:s.beauty).sort((a,b)=>b.net-a.net);
  const top=list.slice(0,3), rest=list.slice(3);
  const medal=['#E7C86A','#C9CBD1','#D3A17A'];

  return `
  <div class="brief">
    <span class="q">"Who is leading, and how do two of them actually differ?"</span>
    A <b>top three that reads as a result</b> — photo-led, the way the stylist cards do it — then
    the rest as a dense grid. Comparison is a <b>tray you fill by tapping +</b>, up to three,
    instead of three dropdowns you have to set before anything draws.
  </div>

  <div class="lu-bar">
    <div class="seg">
      <button class="chip${cDept==='hair'?' on':''}" onclick="cDept='hair';cSel=[];paint()">Hair</button>
      <button class="chip${cDept==='beauty'?' on':''}" onclick="cDept='beauty';cSel=[];paint()">Beauty</button>
    </div>
    <div class="sp"></div>
    <span class="tagline">Tap + on anyone to compare · up to 3</span>
  </div>

  <div class="sec"><i></i>Leading this month <span class="n">by net salon take</span></div>
  <div class="pod">
    ${top.map((s,i)=>`
      <div class="card pod-c" style="--pc:${medal[i]}">
        <div class="pod-rk">${i+1}</div>
        <div class="pod-top">${avatar(s)}
          <div style="min-width:0">
            <div class="pod-nm">${esc(s.name)}</div>
            <div class="pod-rl">${esc(s.role)}</div>
            <div class="lu-sub" style="margin-top:5px"><i class="dot" style="background:${BRANCH[s.branch].color}"></i>${BRANCH[s.branch].name}</div>
          </div>
        </div>
        <div class="pod-fig">
          <div class="l">Net salon take</div>
          <div class="v">${aed(s.net)}</div>
          <div class="tagline" style="margin-top:2px">${s.total} clients · ${s.rebooked} rebooked</div>
        </div>
        <div class="pod-mtrs">${meters(s).join('')}</div>
      </div>`).join('')}
  </div>

  <div class="sec"><i style="background:var(--accent-mint)"></i>The rest of the ${cDept==='hair'?'hair floor':'beauty bench'}
    <span class="n">${rest.length} people</span></div>
  <div class="gr">
    ${rest.map((s,i)=>`
      <div class="card gr-c">
        <span class="tagline" style="width:14px;text-align:right">${i+4}</span>
        ${avatar(s)}
        <div style="min-width:0">
          <div class="gr-nm">${esc(s.name)}</div>
          <div class="gr-sub">${aedK(s.net)} · ${pct(s.rebookPct)} rebook</div>
        </div>
        <button class="add${cSel.includes(s.id)?' on':''}" onclick="pick(${s.id})">${cSel.includes(s.id)?'✓':'+'}</button>
      </div>`).join('')}
  </div>
  <div style="height:${cSel.length?'230px':'0'}"></div>`;
}

function pick(id){
  const i=cSel.indexOf(id);
  if(i>=0) cSel.splice(i,1);
  else { if(cSel.length>=3) cSel.shift(); cSel.push(id); }
  paint(); paintTray();
}
function clearTray(){ cSel=[]; paint(); paintTray(); }

function paintTray(){
  const tray=document.getElementById('tray');
  tray.classList.toggle('up', dir==='C' && cSel.length>0);
  document.getElementById('trayN').textContent=cSel.length;
  document.getElementById('trayCols').innerHTML = cSel.map(id=>{
    const s=TEAM.find(x=>x.id===id);
    return `<div class="tray-col">
      <div class="who">${avatar(s)}
        <div><div class="nm">${esc(s.name)}</div>
          <div class="tagline">${BRANCH[s.branch].name} · ${aedK(s.net)}</div></div>
        <button class="x" onclick="pick(${s.id})">×</button>
      </div>
      <div class="tray-mtrs">${meters(s).join('')}</div>
    </div>`;
  }).join('') || '<div class="tray-empty">Nothing picked yet.</div>';
}

/* ═══ SHELL ══════════════════════════════════════════════════════════════ */
let dir='A';
function paint(){
  document.getElementById('stage').innerHTML =
    dir==='A'?renderA(): dir==='B'?renderB(): renderC();
  paintTray();
  document.querySelectorAll('#dirSeg button').forEach(b=>b.classList.toggle('on',b.dataset.d===dir));
}
document.getElementById('dirSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  dir=b.dataset.d; window.scrollTo({top:0}); paint();
});
function toggleTheme(){
  const r=document.documentElement, next=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',next);
  document.getElementById('thLbl').textContent = next==='dark'?'Light':'Dark';
}
paint();
</script>
